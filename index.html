                    ctx.restore();
                }

                // 날씨 파티클 그리기 (타입별 배치 렌더링)
                ctx.save();
                // 눈 파티클
                ctx.fillStyle = '#FFFFFF';
                ctx.globalAlpha = 0.8;
                ctx.beginPath();
                for (let i = 0; i < this.weatherParticles.length; i++) {
                    const p = this.weatherParticles[i];
                    if (p.type === 'snow') {
                        ctx.moveTo(p.x + p.size, p.y);
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    }
                }
                ctx.fill();
                ctx.restore();

                // 잎/꽃잎 파티클
                for (let i = 0; i < this.weatherParticles.length; i++) {
                    const p = this.weatherParticles[i];
                    if (p.type === 'leaf') {
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate(p.rot || 0);
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.ellipse(0, 0, p.size, p.size * 0.5, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    } else if (p.type === 'petal') {
                        ctx.save();
                        ctx.globalAlpha = 0.7;
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.ellipse(p.x, p.y, p.size, p.size * 0.6, Math.sin(p.x * 0.1) * 0.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                }

                // 계절 표시 (좌하단)
                ctx.save();
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.beginPath();
                ctx.roundRect(GAME_CONFIG.width - 120, GAME_CONFIG.groundY - 35, 110, 28, 8);
                ctx.fill();
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(SEASONS[this.currentSeason].label, GAME_CONFIG.width - 65, GAME_CONFIG.groundY - 21);
                ctx.restore();
            }

            drawCloud(ctx, x, y, color) {
                ctx.save();
                ctx.fillStyle = color;
                ctx.globalAlpha = 0.7;
                ctx.beginPath();
                ctx.arc(x, y, 22, 0, Math.PI * 2);
                ctx.arc(x + 22, y - 5, 28, 0, Math.PI * 2);
                ctx.arc(x + 50, y, 22, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            drawTree(ctx, x, groundY, season, index) {
                const trunkH = 40 + (index % 3) * 10;
                // 줄기
                ctx.fillStyle = season.treeTrunk;
                ctx.fillRect(x - 4, groundY - trunkH, 8, trunkH);

                const treeAlpha = season.treeAlpha !== undefined ? season.treeAlpha : (season.treeColor ? 1 : 0);
                const winterAlpha = 1 - treeAlpha; // 나뭇잎이 사라질수록 가지가 나타남

                // 나뭇잎 (페이드인/아웃)
                if (season.treeColor && treeAlpha > 0.01) {
                    ctx.save();
                    ctx.globalAlpha = treeAlpha;
                    ctx.fillStyle = season.treeColor;
                    ctx.beginPath();
                    ctx.arc(x, groundY - trunkH - 15, 20 + (index % 2) * 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x - 12, groundY - trunkH - 5, 14, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x + 12, groundY - trunkH - 5, 14, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                // 겨울 앙상한 가지 + 눈 (페이드인/아웃)
                if (winterAlpha > 0.01) {
                    ctx.save();
                    ctx.globalAlpha = winterAlpha;
                    ctx.strokeStyle = season.treeTrunk;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(x, groundY - trunkH);
                    ctx.lineTo(x - 15, groundY - trunkH - 20);
                    ctx.moveTo(x, groundY - trunkH);
                    ctx.lineTo(x + 15, groundY - trunkH - 18);
                    ctx.moveTo(x, groundY - trunkH + 10);
                    ctx.lineTo(x - 10, groundY - trunkH - 5);
                    ctx.stroke();
                    // 눈
                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath();
                    ctx.arc(x - 15, groundY - trunkH - 22, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x + 15, groundY - trunkH - 20, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }
        }

        // ============================================================================
        // SCENE CLASSES
        // ============================================================================
        class TitleScene {
            constructor() {
                this.bounceY = 0;
                this.bounceSpeed = 0.3;
                this.charFrame = 0;
                this.bg = new Background();
            }

            update(deltaTime) {
                this.bounceY += this.bounceSpeed;
                if (this.bounceY > 15 || this.bounceY < 0) this.bounceSpeed *= -1;
                this.charFrame += 0.05;
                this.bg.update(deltaTime * 0.3);
            }

            draw(ctx) {
                this.bg.draw(ctx);

                // 반투명 패널
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.beginPath();
                ctx.roundRect(GAME_CONFIG.width/2 - 280, 40, 560, 490, 20);
                ctx.fill();
                ctx.strokeStyle = '#0099FF';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.save();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // 제목
                ctx.fillStyle = '#FF4444';
                ctx.strokeStyle = '#CC0000';
                ctx.lineWidth = 3;
                ctx.font = 'bold 60px Arial';
                ctx.strokeText('동그라미 런', GAME_CONFIG.width/2, 95 - this.bounceY * 0.5);
                ctx.fillText('동그라미 런', GAME_CONFIG.width/2, 95 - this.bounceY * 0.5);

                // 선택된 캐릭터 미리보기
                const charKey = gameState.selectedCharacter;
                const char = spriteConfig.sprites[charKey];
                if (char && char.drawSprite) {
                    char.drawSprite(ctx, GAME_CONFIG.width/2 - 32, 130, this.charFrame, false, false);
                }
                ctx.fillStyle = '#333';
                ctx.font = 'bold 20px Arial';
                ctx.fillText(char ? char.name : '동그라미', GAME_CONFIG.width/2, 210);

                // 최고 점수 / 동전
                ctx.fillStyle = '#555';
                ctx.font = '22px Arial';
                ctx.fillText(`최고 점수: ${gameState.bestScore}  |  보유 동전: ${gameState.totalCoins}`, GAME_CONFIG.width/2, 250);

                // 게임 시작 버튼
                ctx.fillStyle = '#0099FF';
                ctx.beginPath();
                ctx.roundRect(GAME_CONFIG.width/2 - 150, 290, 300, 65, 12);
                ctx.fill();
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 32px Arial';
                ctx.fillText('게임 시작!', GAME_CONFIG.width/2, 323);

                // 캐릭터 선택 버튼
                ctx.fillStyle = '#FF8800';
                ctx.beginPath();
                ctx.roundRect(GAME_CONFIG.width/2 - 150, 375, 300, 55, 12);
                ctx.fill();
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 26px Arial';
                ctx.fillText('캐릭터 선택', GAME_CONFIG.width/2, 403);

                // 조작법 안내
                ctx.fillStyle = '#888';
                ctx.font = '16px Arial';
                ctx.fillText('탭 = 점프 / 더블탭 = 더블점프 / 아래 스와이프 = 숙이기', GAME_CONFIG.width/2, 465);

                // 버전 표시 (우측 하단)
                ctx.textAlign = 'right';
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.font = '13px Arial';
                ctx.fillText('v2.0.0', GAME_CONFIG.width - 15, GAME_CONFIG.height - 12);

                ctx.restore();
            }

            handleInput(inputState) {
                if (!inputState.jumping) return;
                const mx = inputManager.lastTouchX;
                const my = inputManager.lastTouchY;
                if (mx === undefined || my === undefined) return;

                const cx = GAME_CONFIG.width / 2;
                // 게임 시작 버튼 영역
                if (mx >= cx - 150 && mx <= cx + 150 && my >= 290 && my <= 355) {
                    gameState.score = 0;
                    gameState.coins = 0;
                    gameState.coinsEarned = 0;
                    gameState.lives = gameState.maxLives;
                    gameState.invulnTimer = 0;
                    gameState.speedLevel = 0;
                    gameState.winterCount = 0;
                    gameState.seasonLevel = 0;
                    gameState.gameSpeed = GAME_CONFIG.initialSpeed;
                    gameState.currentScene = 'game';
                    gameState.isRunning = true;
                    gameState.isPaused = false;
                    gameState.gameStartTime = Date.now();
                    if (typeof engine !== 'undefined' && engine.scenes) {
                        engine.scenes.game = null;
                        engine.scenes.gameOver = null;
                    }
                }
                // 캐릭터 선택 버튼 영역
                if (mx >= cx - 150 && mx <= cx + 150 && my >= 375 && my <= 430) {
                    gameState.currentScene = 'select';
                }
            }
        }

        // ============================================================================
        // CHARACTER SELECT SCENE
        // ============================================================================
        class SelectScene {
            constructor() {
                this.charFrame = 0;
                this.bg = new Background();
                this.message = '';
                this.messageTimer = 0;
            }

            update(deltaTime) {
                this.charFrame += 0.05;
                this.bg.update(deltaTime * 0.2);
                if (this.messageTimer > 0) this.messageTimer -= deltaTime;
            }

            draw(ctx) {
                this.bg.draw(ctx);

                // 메인 패널
                ctx.fillStyle = 'rgba(255,255,255,0.92)';
                ctx.beginPath();
                ctx.roundRect(30, 20, GAME_CONFIG.width - 60, GAME_CONFIG.height - 40, 20);
                ctx.fill();
                ctx.strokeStyle = '#FF8800';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.save();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // 제목
                ctx.fillStyle = '#FF8800';
                ctx.font = 'bold 40px Arial';
                ctx.fillText('캐릭터 선택', GAME_CONFIG.width/2, 60);

                // 보유 동전
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 24px Arial';
                ctx.fillText(`보유 동전: ${gameState.totalCoins}`, GAME_CONFIG.width/2, 100);

                // 캐릭터 그리드 (5개)
                const keys = Object.keys(spriteConfig.sprites);
                const cols = Math.min(keys.length, 5);
                const cellW = 150;
                const cellH = 180;
                const startX = GAME_CONFIG.width/2 - (cols * cellW) / 2;
                const startY = 130;

                keys.forEach((key, i) => {
                    const char = spriteConfig.sprites[key];
                    const col = i % cols;
                    const cx = startX + col * cellW + cellW / 2;
                    const cy = startY + cellH / 2;
                    const isSelected = gameState.selectedCharacter === key;
                    const isUnlocked = gameState.unlockedCharacters.includes(key);

                    // 카드 배경
                    ctx.fillStyle = isSelected ? '#E0F0FF' : '#F5F5F5';
                    ctx.strokeStyle = isSelected ? '#0099FF' : '#DDD';
                    ctx.lineWidth = isSelected ? 3 : 1;
                    ctx.beginPath();
                    ctx.roundRect(cx - 60, startY, 120, cellH - 10, 10);
                    ctx.fill();
                    ctx.stroke();

                    // 캐릭터 그리기 (잠긴 것도 반투명으로 보여줌)
                    if (char.drawSprite) {
                        if (!isUnlocked) ctx.globalAlpha = 0.35;
                        try {
                            char.drawSprite(ctx, cx - 32, startY + 15, this.charFrame, false, false);
                        } catch(e) {
                            ctx.fillStyle = char.colors ? char.colors.main : '#CCC';
                            ctx.beginPath();
                            ctx.arc(cx, startY + 50, 22, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.globalAlpha = 1;
                    }
                    if (!isUnlocked) {
                        // 잠금 아이콘 오버레이
                        ctx.fillStyle = 'rgba(0,0,0,0.3)';
                        ctx.beginPath();
                        ctx.arc(cx, startY + 47, 25, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#FFF';
                        ctx.font = 'bold 28px Arial';
                        ctx.fillText('🔒', cx, startY + 50);
                    }

                    // 이름
                    ctx.fillStyle = '#333';
                    ctx.font = 'bold 16px Arial';
                    ctx.fillText(char.name, cx, startY + cellH - 50);

                    // 가격 또는 상태
                    if (isSelected && isUnlocked) {
                        ctx.fillStyle = '#0099FF';
                        ctx.font = 'bold 14px Arial';
                        ctx.fillText('✓ 선택됨', cx, startY + cellH - 30);
                    } else if (isUnlocked) {
                        ctx.fillStyle = '#22BB22';
                        ctx.font = '14px Arial';
                        ctx.fillText('보유중', cx, startY + cellH - 30);
                    } else {
                        ctx.fillStyle = '#FF8800';
                        ctx.font = 'bold 14px Arial';
                        ctx.fillText(`${char.cost} 동전`, cx, startY + cellH - 30);
                    }
                });

                // 메시지 표시
                if (this.messageTimer > 0 && this.message) {
                    ctx.fillStyle = 'rgba(0,0,0,0.8)';
                    ctx.beginPath();
                    ctx.roundRect(GAME_CONFIG.width/2 - 180, GAME_CONFIG.height - 120, 360, 40, 10);
                    ctx.fill();
                    ctx.fillStyle = '#FFDD00';
                    ctx.font = 'bold 18px Arial';
                    ctx.fillText(this.message, GAME_CONFIG.width/2, GAME_CONFIG.height - 100);
                }

                // 뒤로가기 버튼
                ctx.fillStyle = '#666';
                ctx.beginPath();
                ctx.roundRect(GAME_CONFIG.width/2 - 80, GAME_CONFIG.height - 65, 160, 45, 10);
                ctx.fill();
                ctx.fillStyle = '#FFF';
                ctx.font = 'bold 22px Arial';
                ctx.fillText('← 돌아가기', GAME_CONFIG.width/2, GAME_CONFIG.height - 42);

                ctx.restore();
            }

            handleInput(inputState) {
                if (!inputState.jumping) return;
                const mx = inputManager.lastTouchX;
                const my = inputManager.lastTouchY;
                if (mx === undefined || my === undefined) return;

                // 돌아가기 버튼
                if (mx >= GAME_CONFIG.width/2 - 80 && mx <= GAME_CONFIG.width/2 + 80 &&
                    my >= GAME_CONFIG.height - 65 && my <= GAME_CONFIG.height - 20) {
                    gameState.currentScene = 'title';
                    localStorage.setItem('selectedCharacter', gameState.selectedCharacter);
                    return;
                }

                // 캐릭터 카드 클릭 판정
                const keys = Object.keys(spriteConfig.sprites);
                const cols = Math.min(keys.length, 5);
                const cellW = 150;
                const cellH = 180;
                const startX = GAME_CONFIG.width/2 - (cols * cellW) / 2;
                const startY = 130;

                keys.forEach((key, i) => {
                    const char = spriteConfig.sprites[key];
                    const col = i % cols;
                    const cx = startX + col * cellW + cellW / 2;
                    const isUnlocked = gameState.unlockedCharacters.includes(key);

                    if (mx >= cx - 60 && mx <= cx + 60 && my >= startY && my <= startY + cellH - 10) {
                        if (isUnlocked) {
                            gameState.selectedCharacter = key;
                            localStorage.setItem('selectedCharacter', key);
                            this.message = `${char.name} 선택 완료!`;
                            this.messageTimer = 1.5;
                        } else if (gameState.totalCoins >= char.cost) {
                            // 구매!
                            gameState.totalCoins -= char.cost;
                            gameState.unlockedCharacters.push(key);
                            gameState.selectedCharacter = key;
                            localStorage.setItem('totalCoins', gameState.totalCoins);
                            localStorage.setItem('unlockedCharacters', JSON.stringify(gameState.unlockedCharacters));
                            localStorage.setItem('selectedCharacter', key);
                            this.message = `${char.name} 구매 완료! 🎉`;
                            this.messageTimer = 2;
                            audioManager.playPowerUpSound();
                        } else {
                            this.message = `동전이 부족해요! (${char.cost - gameState.totalCoins}개 더 필요)`;
                            this.messageTimer = 2;
                        }
                    }
                });
            }
        }

        class GameScene {
            constructor() {
                this.background = new Background();
                this.player = new Player(gameState.selectedCharacter);
                this.obstacles = [];
                this.coins = [];
                this.powerUps = [];
                this.particles = new ParticleSystem();
                this.obstacleTimer = 3.0; // 첫 장애물까지 3초 대기
                this.coinTimer = 1.5;
                this.powerUpTimer = 8.0;
                this.seasonBanner = null; // { text, timer }
                this.lastSeason = 'spring';
                this.prevSeasonForWinter = 'spring'; // 겨울→봄 전환 감지용
                // BGM 시작
                if (typeof seasonalBGM !== 'undefined') {
                    seasonalBGM.start('spring');
                }
            }

            update(inputState, deltaTime) {
                if (gameState.isPaused) return;

                this.background.update(deltaTime, gameState.score);

                // 계절 전환 감지 → 배경의 실제 계절 상태를 기준으로 배너/BGM 전환
                const bgSeason = this.background.currentSeason;
                const bgReady = this.background.transitionT >= 0.5;
                if (bgReady && bgSeason !== this.lastSeason) {
                    // 시각 배너는 이제 BGM 오버레이로 대체 (seasonalBGM.drawOverlay)
                    this.lastSeason = bgSeason;

                    // BGM 계절 전환 (크로스페이드 + 오버레이)
                    if (typeof seasonalBGM !== 'undefined') {
                        seasonalBGM.changeSeason(bgSeason);
                    }
                }

                // 겨울 → 봄 전환 감지: 겨울을 완전히 지남 = 레벨 0.5 증가
                const rawSeason = getCurrentSeason(gameState.score || 0);
                if (this.prevSeasonForWinter === 'winter' && rawSeason === 'spring') {
                    gameState.winterCount++;
                    gameState.seasonLevel = gameState.winterCount * 0.5;
                }
                this.prevSeasonForWinter = rawSeason;

                // BGM 업데이트
                if (typeof seasonalBGM !== 'undefined') {
                    seasonalBGM.update(deltaTime);
                }

                this.player.update(inputState, deltaTime);
                this.particles.update(deltaTime);

                // Update speed & level (0~100) + 계절 레벨 보너스 적용
                const seasonSpeedBonus = gameState.seasonLevel * 15; // 겨울 1회 통과마다 속도 +7.5
                gameState.gameSpeed = Math.min(
                    GAME_CONFIG.maxSpeed,
                    GAME_CONFIG.initialSpeed + gameState.score * GAME_CONFIG.speedIncrease + seasonSpeedBonus
                );
                gameState.speedLevel = Math.min(100, Math.floor(
                    ((gameState.gameSpeed - GAME_CONFIG.initialSpeed) / (GAME_CONFIG.maxSpeed - GAME_CONFIG.initialSpeed)) * 100
                ));

                // Spawn obstacles (deltaTime 기반 — 끊김 방지)
                this.obstacleTimer -= deltaTime;
                if (this.obstacleTimer <= 0) {
                    this.spawnObstacle();
                    this.obstacleTimer = 2.5 + Math.random() * 2.5;
                }

                // Spawn coins
                this.coinTimer -= deltaTime;
                if (this.coinTimer <= 0) {
                    if (Math.random() < 0.4) {
                        this.coins.push(new Coin());
                    }
                    this.coinTimer = 1.2 + Math.random() * 1.0;
                }

                // Spawn power-ups
                this.powerUpTimer -= deltaTime;
                if (this.powerUpTimer <= 0) {
                    if (Math.random() < 0.3) {
                        const types = ['shield', 'magnet', '2x', 'slow'];
                        this.powerUps.push(new PowerUp(types[Math.floor(Math.random() * types.length)]));
                    }
                    this.powerUpTimer = 6.0 + Math.random() * 4.0;
                }

                // Update obstacles
                this.obstacles = this.obstacles.filter(o => {
                    o.update(gameState.gameSpeed, deltaTime);
                    return o.x + o.width > 0;
                });

                // Update coins
                this.coins = this.coins.filter(c => {
                    c.update(gameState.gameSpeed, deltaTime);
                    return c.x + c.radius > 0;
                });

                // Update power-ups
                this.powerUps = this.powerUps.filter(p => {
                    p.update(gameState.gameSpeed, deltaTime);
                    return p.x + p.radius > 0;
                });

                // Collision detection
                this.checkCollisions(deltaTime);

                // Score increment (초당 ~10점)
                gameState.score += deltaTime * 10;
            }

            spawnObstacle() {
                const score = gameState.score;
                const season = getCurrentSeason(score);
                let pool;

                if (score < 30) {
                    // 초반: 작은 장애물만
                    pool = ['cactus-small', 'rock-small', 'mushroom'];
                } else if (score < 70) {
                    // 중반 초기: 기본 + 계절별
                    const base = ['cactus-small', 'cactus-medium', 'rock-small', 'stump', 'bird-low'];
                    pool = this._addSeasonObstacles(base, season);
                } else if (score < 150) {
                    // 중반: 다양한 장애물
                    const base = ['cactus-small', 'cactus-medium', 'cactus-large', 'rock-small', 'rock-large',
                                  'bird-low', 'bird-mid', 'stump', 'bee', 'puddle'];
                    pool = this._addSeasonObstacles(base, season);
                } else {
                    // 후반: 모든 장애물
                    const base = ['cactus-small', 'cactus-medium', 'cactus-large', 'rock-small', 'rock-large',
                                  'bird-low', 'bird-mid', 'bird-high', 'stump', 'bee', 'puddle', 'mushroom'];
                    pool = this._addSeasonObstacles(base, season);
                }

                const type = pool[Math.floor(Math.random() * pool.length)];
                this.obstacles.push(new Obstacle(type, score));
            }

            _addSeasonObstacles(base, season) {
                const pool = [...base];
                if (season === 'winter') {
                    pool.push('snowman', 'snowman'); // 겨울: 눈사람 가중치
                } else if (season === 'spring') {
                    pool.push('mushroom', 'mushroom'); // 봄: 버섯 가중치
                } else if (season === 'summer') {
                    pool.push('bee', 'bee', 'puddle'); // 여름: 벌/웅덩이 가중치
                } else if (season === 'autumn') {
                    pool.push('stump', 'stump', 'rock-large'); // 가을: 그루터기/바위 가중치
                }
                return pool;
            }

            checkCollisions(deltaTime) {
                const playerHitbox = this.player.getHitbox();

                // 무적 타이머 감소
                if (gameState.invulnTimer > 0) gameState.invulnTimer -= deltaTime;

                // Check obstacle collisions
                this.obstacles.forEach(obstacle => {
                    if (this.checkAABBCollision(playerHitbox, obstacle.getHitbox())) {
                        if (this.player.activePowerUp === 'shield') {
                            // 쉴드로 파괴
                            this.particles.createExplosion(obstacle.x, obstacle.y, '#FF00FF', 12);
                            this.obstacles = this.obstacles.filter(o => o !== obstacle);
                            this.player.activePowerUp = null;
                        } else if (gameState.invulnTimer <= 0) {
                            // 하트 감소
                            gameState.lives--;
                            gameState.invulnTimer = 2.0; // 2초 무적
                            this.particles.createExplosion(obstacle.x, obstacle.y, '#FF0000', 10);
                            this.obstacles = this.obstacles.filter(o => o !== obstacle);
                            audioManager.playJumpSound(); // 피격음

                            if (gameState.lives <= 0) {
                                gameState.isRunning = false;
                                gameState.currentScene = 'gameOver';
                                audioManager.playGameOverSound();
                                if (typeof seasonalBGM !== 'undefined') seasonalBGM.stop();
                            }
                        }
                    }
                });

                // Check coin collisions
                this.coins.forEach(coin => {
                    if (this.checkAABBCollision(playerHitbox, coin.getHitbox())) {
                        gameState.coins++;
                        gameState.coinsEarned++;
                        this.particles.createExplosion(coin.x, coin.y, '#FFD700', 6);
                        this.coins = this.coins.filter(c => c !== coin);
                        audioManager.playCoinSound();
                    }
                });

                // Check power-up collisions
                this.powerUps.forEach(pu => {
                    if (this.checkAABBCollision(playerHitbox, pu.getHitbox())) {
                        this.player.activePowerUp = pu.type;
                        this.player.powerUpTimer = 5; // 5초 지속
                        this.particles.createExplosion(pu.x, pu.y, pu.color, 10);
                        this.powerUps = this.powerUps.filter(p => p !== pu);
                        audioManager.playPowerUpSound();
                    }
                });
            }

            checkAABBCollision(rect1, rect2) {
                return rect1.x < rect2.x + rect2.width &&
                    rect1.x + rect1.width > rect2.x &&
                    rect1.y < rect2.y + rect2.height &&
                    rect1.y + rect1.height > rect2.y;
            }

            draw(ctx) {
                this.background.draw(ctx);
                this.particles.draw(ctx);
                this.player.draw(ctx);
                this.obstacles.forEach(o => o.draw(ctx));
                this.coins.forEach(c => c.draw(ctx));
                this.powerUps.forEach(p => p.draw(ctx));

                // HUD
                ctx.fillStyle = '#000000';
                ctx.font = 'bold 28px Arial';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText(`점수: ${Math.floor(gameState.score)}`, 20, 20);

                // 속도 레벨 표시 (점수 옆)
                ctx.font = 'bold 22px Arial';
                ctx.fillStyle = gameState.speedLevel >= 80 ? '#FF2200' : gameState.speedLevel >= 50 ? '#FF8800' : '#0066CC';
                ctx.fillText(`⚡ LV.${gameState.speedLevel}`, 230, 22);

                // 계절 레벨 표시 (겨울 통과 보너스)
                if (gameState.seasonLevel > 0) {
                    ctx.font = 'bold 18px Arial';
                    ctx.fillStyle = '#8B4513';
                    ctx.fillText(`🌍 계절 +${gameState.seasonLevel.toFixed(1)}`, 370, 24);
                }

                ctx.fillStyle = '#000000';
                ctx.font = 'bold 24px Arial';
                ctx.fillText(`동전: ${gameState.coins}`, 20, 60);

                // Pause button
                ctx.fillStyle = '#FFFFFF';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                ctx.fillRect(GAME_CONFIG.width - 70, 20, 50, 50);
                ctx.strokeRect(GAME_CONFIG.width - 70, 20, 50, 50);
                ctx.fillStyle = '#000000';
                ctx.font = 'bold 32px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('⏸', GAME_CONFIG.width - 45, 45);

                // 하트(생명) 표시
                ctx.font = '28px Arial';
                ctx.textAlign = 'left';
                for (let i = 0; i < gameState.maxLives; i++) {
                    ctx.fillStyle = i < gameState.lives ? '#FF0000' : '#555555';
                    ctx.fillText(i < gameState.lives ? '❤️' : '🖤', 20 + i * 35, 100);
                }

                // 피격 무적 표시
                if (gameState.invulnTimer > 0) {
                    ctx.fillStyle = 'rgba(255,0,0,0.3)';
                    ctx.fillRect(0, 0, GAME_CONFIG.width, 5);
                }

                // 계절 전환 오버레이 (BGM 크로스페이드 + 시각 효과)
                if (typeof seasonalBGM !== 'undefined') {
                    seasonalBGM.drawOverlay(ctx);
                }
            }

            handleInput(inputState) {
                // Pause button hit detection (simplified)
                // Would need mouse position tracking for real implementation
            }
        }

        class GameOverScene {
            constructor() {
                // 기록 저장
                this.finalScore = Math.floor(gameState.score);
                this.finalCoins = gameState.coins;
                this.finalSpeedLevel = gameState.speedLevel;
                this.isNewBest = this.finalScore > gameState.bestScore;
                gameState.bestScore = Math.max(gameState.bestScore, this.finalScore);
                gameState.bestCoins = Math.max(gameState.bestCoins, this.finalCoins);
                gameState.bestSpeedLevel = Math.max(gameState.bestSpeedLevel || 0, this.finalSpeedLevel);
                gameState.totalCoins += this.finalCoins;
                gameState.totalGames = (gameState.totalGames || 0) + 1;
                try {
                    localStorage.setItem('bestScore', gameState.bestScore);
                    localStorage.setItem('bestCoins', gameState.bestCoins);
                    localStorage.setItem('bestSpeedLevel', gameState.bestSpeedLevel);
                    localStorage.setItem('totalCoins', gameState.totalCoins);
                    localStorage.setItem('totalGames', gameState.totalGames);
                } catch(e) { /* localStorage 사용 불가 환경 대응 */ }

                // 게임 시간 계산
                this.playTime = Math.floor((Date.now() - gameState.gameStartTime) / 1000);
                this.playMinutes = Math.floor(this.playTime / 60);
                this.playSeconds = this.playTime % 60;

                // 도달한 계절
                const seasonLabels = { spring: '봄 🌸', summer: '여름 ☀️', autumn: '가을 🍂', winter: '겨울 ❄️' };
                this.reachedSeason = seasonLabels[getCurrentSeason(this.finalScore)] || '봄 🌸';
                this.finalWinterCount = gameState.winterCount;
                this.finalSeasonLevel = gameState.seasonLevel;

                // 입력 차단: 2초 동안 버튼 비활성 + 터치 좌표 초기화
                this.inputDelay = 2.0;
                this.buttonsReady = false;
                inputManager.lastTouchX = undefined;
                inputManager.lastTouchY = undefined;
                inputManager.jumping = false;
                inputManager.jumpPressed = false;

                // 배경 (한 번만 생성)
                this.bg = new Background();

                // 등장 애니메이션
                this.animTime = 0;
            }

            update(deltaTime) {
                this.animTime += deltaTime;
                if (this.inputDelay > 0) {
                    this.inputDelay -= deltaTime;
                    if (this.inputDelay <= 0) {
                        this.buttonsReady = true;
                        // 버튼 활성화 시점에 다시 터치 좌표 클리어
                        inputManager.lastTouchX = undefined;
                        inputManager.lastTouchY = undefined;
                        inputManager.jumping = false;
                        inputManager.jumpPressed = false;
                    }
                }
                this.bg.update(deltaTime * 0.1); // 배경 아주 느리게 움직임
            }

            draw(ctx) {
                this.bg.draw(ctx);

                // 어두운 오버레이
                ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
                ctx.fillRect(0, 0, GAME_CONFIG.width, GAME_CONFIG.height);

                ctx.save();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                const cx = GAME_CONFIG.width / 2;

                // 메인 패널 (등장 애니메이션)
                const panelAlpha = Math.min(1, this.animTime / 0.5);
                ctx.globalAlpha = panelAlpha;

                const pw = 480, ph = 500;
                const px = cx - pw / 2, py = 40;
                ctx.fillStyle = 'rgba(255,255,255,0.95)';
                ctx.beginPath();
                ctx.roundRect(px, py, pw, ph, 20);
                ctx.fill();
                ctx.strokeStyle = '#FF4444';
                ctx.lineWidth = 3;
                ctx.stroke();

                // 게임 오버 제목
                ctx.fillStyle = '#FF4444';
                ctx.font = 'bold 48px Arial';
                ctx.fillText('게임 오버!', cx, py + 50);

                // 신기록 표시
                if (this.isNewBest) {
                    ctx.fillStyle = '#FFD700';
                    ctx.font = 'bold 22px Arial';
                    ctx.fillText('⭐ 신기록 달성! ⭐', cx, py + 85);
                }

                // 구분선
                const summaryY = this.isNewBest ? py + 110 : py + 95;
                ctx.strokeStyle = '#EEE';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(px + 40, summaryY);
                ctx.lineTo(px + pw - 40, summaryY);
                ctx.stroke();

                // 게임 플레이 Summary
                ctx.fillStyle = '#333';
                ctx.font = 'bold 20px Arial';
                ctx.fillText('📊 플레이 요약', cx, summaryY + 28);

                ctx.font = '22px Arial';
                ctx.fillStyle = '#444';
                const lineH = 36;
                let ly = summaryY + 65;

                // 최종 점수
                ctx.textAlign = 'left';
                ctx.fillText('최종 점수', px + 60, ly);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#0066CC';
                ctx.font = 'bold 22px Arial';
                ctx.fillText(`${this.finalScore}점`, px + pw - 60, ly);

                // 최고 점수
                ly += lineH;
                ctx.textAlign = 'left';
                ctx.fillStyle = '#444';
                ctx.font = '22px Arial';
                ctx.fillText('최고 점수', px + 60, ly);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#FF8800';
                ctx.font = 'bold 22px Arial';
                ctx.fillText(`${gameState.bestScore}점`, px + pw - 60, ly);

                // 획득 동전
                ly += lineH;
                ctx.textAlign = 'left';
                ctx.fillStyle = '#444';
                ctx.font = '22px Arial';
                ctx.fillText('획득한 동전', px + 60, ly);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#FFB700';
                ctx.font = 'bold 22px Arial';
                ctx.fillText(`${this.finalCoins}개`, px + pw - 60, ly);

                // 플레이 시간
                ly += lineH;
                ctx.textAlign = 'left';
                ctx.fillStyle = '#444';
                ctx.font = '22px Arial';
                ctx.fillText('플레이 시간', px + 60, ly);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#555';
                ctx.font = 'bold 22px Arial';
                const timeStr = this.playMinutes > 0
                    ? `${this.playMinutes}분 ${this.playSeconds}초`
                    : `${this.playSeconds}초`;
                ctx.fillText(timeStr, px + pw - 60, ly);

                // 도달 계절
                ly += lineH;
                ctx.textAlign = 'left';
                ctx.fillStyle = '#444';
                ctx.font = '22px Arial';
                ctx.fillText('마지막 계절', px + 60, ly);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#22AA22';
                ctx.font = 'bold 22px Arial';
                ctx.fillText(this.reachedSeason, px + pw - 60, ly);

                // 겨울 통과 횟수 & 계절 레벨
                if (this.finalWinterCount > 0) {
                    ly += lineH;
                    ctx.textAlign = 'left';
                    ctx.fillStyle = '#444';
                    ctx.font = '22px Arial';
                    ctx.fillText('겨울 통과', px + 60, ly);
                    ctx.textAlign = 'right';
                    ctx.fillStyle = '#4488CC';
                    ctx.font = 'bold 22px Arial';
                    ctx.fillText(`${this.finalWinterCount}회 (레벨 +${this.finalSeasonLevel.toFixed(1)})`, px + pw - 60, ly);
                }

                // 속도 레벨
                ly += lineH;
                ctx.textAlign = 'left';
                ctx.fillStyle = '#444';
                ctx.font = '22px Arial';
                ctx.fillText('속도 레벨', px + 60, ly);
                ctx.textAlign = 'right';
                ctx.fillStyle = this.finalSpeedLevel >= 80 ? '#FF2200' : '#0066CC';
                ctx.font = 'bold 22px Arial';
                ctx.fillText(`LV.${this.finalSpeedLevel}`, px + pw - 60, ly);

                // 버튼 영역
                const btnY = py + ph - 75;
                const btnW = 180, btnH = 55;
                const retryX = cx - btnW - 15;
                const menuX = cx + 15;

                if (this.buttonsReady) {
                    // 다시하기 버튼
                    ctx.fillStyle = '#0099FF';
                    ctx.beginPath();
                    ctx.roundRect(retryX, btnY, btnW, btnH, 12);
                    ctx.fill();
                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = 'bold 24px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('🔄 다시하기', retryX + btnW / 2, btnY + btnH / 2);

                    // 메인메뉴 버튼
                    ctx.fillStyle = '#FF6600';
                    ctx.beginPath();
                    ctx.roundRect(menuX, btnY, btnW, btnH, 12);
                    ctx.fill();
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillText('🏠 메인메뉴', menuX + btnW / 2, btnY + btnH / 2);
                } else {
                    // 버튼 비활성 상태 — 대기 메시지를 버튼 위에 별도 표시
                    ctx.fillStyle = '#AAAAAA';
                    ctx.beginPath();
                    ctx.roundRect(retryX, btnY, btnW, btnH, 12);
                    ctx.fill();
                    ctx.fillStyle = '#DDDDDD';
                    ctx.font = 'bold 24px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('🔄 다시하기', retryX + btnW / 2, btnY + btnH / 2);

                    ctx.fillStyle = '#AAAAAA';
                    ctx.beginPath();
                    ctx.roundRect(menuX, btnY, btnW, btnH, 12);
                    ctx.fill();
                    ctx.fillStyle = '#DDDDDD';
                    ctx.font = 'bold 24px Arial';
                    ctx.fillText('🏠 메인메뉴', menuX + btnW / 2, btnY + btnH / 2);

                    // 대기 메시지를 버튼 아래에 표시 (겹침 방지)
                    const waitSec = Math.ceil(this.inputDelay);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = '18px Arial';
                    ctx.fillText(`잠시만요... (${waitSec}초)`, cx, btnY + btnH + 22);
                }

                ctx.restore();
            }

            handleInput(inputState) {
                // 버튼이 준비되지 않았으면 모든 입력 무시
                if (!this.buttonsReady) return;
                if (!inputState.jumping) return;

                const mx = inputManager.lastTouchX;
                const my = inputManager.lastTouchY;
                if (mx === undefined || my === undefined) return;

                const cx = GAME_CONFIG.width / 2;
                const pw = 480, ph = 500;
                const btnY = 40 + ph - 75;
                const btnW = 180, btnH = 55;
                const retryX = cx - btnW - 15;
                const menuX = cx + 15;

                // 다시하기 버튼
                if (mx >= retryX && mx <= retryX + btnW && my >= btnY && my <= btnY + btnH) {
                    gameState.score = 0;
                    gameState.coins = 0;
                    gameState.coinsEarned = 0;
                    gameState.lives = gameState.maxLives;
                    gameState.invulnTimer = 0;
                    gameState.speedLevel = 0;
                    gameState.winterCount = 0;
                    gameState.seasonLevel = 0;
                    gameState.gameSpeed = GAME_CONFIG.initialSpeed;
                    gameState.currentScene = 'game';
                    gameState.isRunning = true;
                    gameState.isPaused = false;
                    gameState.gameStartTime = Date.now();
                    if (typeof seasonalBGM !== 'undefined') seasonalBGM.stop();
                    if (typeof engine !== 'undefined' && engine.scenes) {
                        engine.scenes.game = null;
                        engine.scenes.gameOver = null;
                    }
                }
                // 메인메뉴 버튼
                else if (mx >= menuX && mx <= menuX + btnW && my >= btnY && my <= btnY + btnH) {
                    gameState.currentScene = 'title';
                    gameState.isRunning = false;
                    if (typeof seasonalBGM !== 'undefined') seasonalBGM.stop();
                    if (typeof engine !== 'undefined' && engine.scenes) {
                        engine.scenes.game = null;
                        engine.scenes.gameOver = null;
                    }
                }
                // 버튼 밖 터치는 무시 (실수 방지)
            }
        }

        // ============================================================================
        // GAME ENGINE
        // ============================================================================
        class GameEngine {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.scenes = {
                    title: new TitleScene(),
                    select: new SelectScene(),
                    game: null,
                    gameOver: null
                };
                this.lastTime = 0; // rAF timestamp로 초기화됨
                this.prevScene = 'title';
            }

            run() {
                requestAnimationFrame((ts) => this.gameLoop(ts));
            }

            gameLoop(timestamp) {
                if (!this.lastTime) this.lastTime = timestamp;
                const deltaTime = Math.min((timestamp - this.lastTime), 33) / 1000;
                this.lastTime = timestamp;

                // 씬 전환 감지 → 입력 클리어
                if (gameState.currentScene !== this.prevScene) {
                    inputManager.lastTouchX = undefined;
                    inputManager.lastTouchY = undefined;
                    inputManager.jumping = false;
                    inputManager.jumpPressed = false;
                    this.prevScene = gameState.currentScene;
                }

                // Update
                const inputState = inputManager.getInputState();

                if (gameState.currentScene === 'title') {
                    this.scenes.title.update(deltaTime);
                    this.scenes.title.handleInput(inputState);
                } else if (gameState.currentScene === 'select') {
                    this.scenes.select.update(deltaTime);
                    this.scenes.select.handleInput(inputState);
                } else if (gameState.currentScene === 'game') {
                    if (!this.scenes.game) {
                        this.scenes.game = new GameScene();
                    }
                    if (gameState.isRunning) {
                        this.scenes.game.update(inputState, deltaTime);
                        this.scenes.game.handleInput(inputState);
                    }
                } else if (gameState.currentScene === 'gameOver') {
                    if (!this.scenes.gameOver) {
                        this.scenes.gameOver = new GameOverScene();
                    }
                    this.scenes.gameOver.update(deltaTime);
                    this.scenes.gameOver.handleInput(inputState);
                }

                // Draw
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                if (gameState.currentScene === 'title') {
                    this.scenes.title.draw(this.ctx);
                } else if (gameState.currentScene === 'select') {
                    this.scenes.select.draw(this.ctx);
                } else if (gameState.currentScene === 'game' && this.scenes.game) {
                    this.scenes.game.draw(this.ctx);
                } else if (gameState.currentScene === 'gameOver' && this.scenes.gameOver) {
                    this.scenes.gameOver.draw(this.ctx);
                }

                // 매 프레임 점프 입력 리셋 (모든 씬에서)
                inputManager.resetJump();

                this.run();
            }
        }

        // ============================================================================
        // MAIN INITIALIZATION
        // ============================================================================
        const canvas = document.getElementById('gameCanvas');
        canvas.width = GAME_CONFIG.width;
        canvas.height = GAME_CONFIG.height;

        // 캔버스를 화면에 맞게 리사이즈
        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            const containerW = container.clientWidth;
            const containerH = container.clientHeight;
            const scale = Math.min(containerW / GAME_CONFIG.width, containerH / GAME_CONFIG.height);
            canvas.style.width = (GAME_CONFIG.width * scale) + 'px';
            canvas.style.height = (GAME_CONFIG.height * scale) + 'px';
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 첫 실행 시 보너스 코인 300개 지급
        if (!localStorage.getItem('dongramiRunInitialized')) {
            localStorage.setItem('totalCoins', '300');
            localStorage.removeItem('selectedCharacter');
            localStorage.removeItem('unlockedCharacters');
            localStorage.setItem('dongramiRunInitialized', 'true');
            gameState.totalCoins = 300;
            gameState.selectedCharacter = Object.keys(spriteConfig.sprites)[0];
            gameState.unlockedCharacters = [Object.keys(spriteConfig.sprites)[0]];
        }

        const audioManager = new AudioManager();
        const seasonalBGM = new SeasonalBGM(audioManager);
        const inputManager = new InputManager();
        const engine = new GameEngine(canvas);

        // AudioContext 활성화 (사용자 인터랙션 필요)
        document.addEventListener('touchstart', function resumeAudio() {
            if (audioManager.audioContext && audioManager.audioContext.state === 'suspended') {
                audioManager.audioContext.resume();
            }
            document.removeEventListener('touchstart', resumeAudio);
        }, { once: true });
        document.addEventListener('click', function resumeAudio() {
            if (audioManager.audioContext && audioManager.audioContext.state === 'suspended') {
                audioManager.audioContext.resume();
            }
            document.removeEventListener('click', resumeAudio);
        }, { once: true });

        engine.run();
    </script>
</body>
</html>
