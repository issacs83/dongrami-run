                } else if (gameState.currentScene === 'gameOver') {
                    if (!this.scenes.gameOver) {
                        this.scenes.gameOver = new GameOverScene();
                    }
                    this.scenes.gameOver.update(deltaTime);
                    this.scenes.gameOver.handleInput(inputState);
                }

                // Draw
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                if (gameState.currentScene === 'title') {
                    this.scenes.title.draw(this.ctx);
                } else if (gameState.currentScene === 'select') {
                    this.scenes.select.draw(this.ctx);
                } else if (gameState.currentScene === 'settings') {
                    this.scenes.settings.draw(this.ctx);
                } else if (gameState.currentScene === 'game' && this.scenes.game) {
                    this.scenes.game.draw(this.ctx);
                } else if (gameState.currentScene === 'gameOver' && this.scenes.gameOver) {
                    this.scenes.gameOver.draw(this.ctx);
                }

                // 매 프레임 점프 입력 리셋 (모든 씬에서)
                inputManager.resetJump();

                this.run();
            }
        }

        // ============================================================================
        // MAIN INITIALIZATION
        // ============================================================================
        const canvas = document.getElementById('gameCanvas');
        canvas.width = GAME_CONFIG.width;
        canvas.height = GAME_CONFIG.height;

        // 캔버스를 화면에 맞게 리사이즈 (세로 모드 자동 가로 회전 지원)
        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            const isMobilePortrait = window.innerWidth <= 768 && window.innerWidth < window.innerHeight;
            let containerW, containerH;
            if (isMobilePortrait) {
                // 세로 모드: CSS가 90도 회전시키므로 가로=vh, 세로=vw
                containerW = window.innerHeight;
                containerH = window.innerWidth;
            } else {
                containerW = container.clientWidth;
                containerH = container.clientHeight;
            }
            const scale = Math.min(containerW / GAME_CONFIG.width, containerH / GAME_CONFIG.height);
            canvas.style.width = (GAME_CONFIG.width * scale) + 'px';
            canvas.style.height = (GAME_CONFIG.height * scale) + 'px';
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));
        resizeCanvas();

        // 가능하면 화면 방향을 가로로 잠금 (지원하는 브라우저)
        try {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
        } catch(e) {}

        // 첫 실행 시 보너스 코인 300개 지급
        if (!localStorage.getItem('dongramiRunInitialized')) {
            localStorage.setItem('totalCoins', '300');
            localStorage.removeItem('selectedCharacter');
            localStorage.removeItem('unlockedCharacters');
            localStorage.setItem('dongramiRunInitialized', 'true');
            gameState.totalCoins = 300;
            gameState.selectedCharacter = Object.keys(spriteConfig.sprites)[0];
            gameState.unlockedCharacters = [Object.keys(spriteConfig.sprites)[0]];
        }

        const audioManager = new AudioManager();
        const seasonalBGM = new SeasonalBGM(audioManager);
        const inputManager = new InputManager();
        const engine = new GameEngine(canvas);

        // AudioContext 활성화 (iOS/Safari에서는 사용자 인터랙션 후에만 재생 가능)
        function tryResumeAudio() {
            if (audioManager.audioContext && audioManager.audioContext.state === 'suspended') {
                audioManager.audioContext.resume();
            }
        }
        // 다양한 인터랙션 이벤트에서 resume 시도
        ['touchstart', 'touchend', 'click', 'keydown', 'mousedown'].forEach(evt => {
            document.addEventListener(evt, tryResumeAudio, { passive: true });
        });

        engine.run();
    </script>
</body>
</html>
