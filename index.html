                } else {
                    // 선인장 (기본)
                    ctx.fillStyle = this.color;
                    ctx.fillRect(this.x + 12, this.y, this.width - 24, this.height);
                    // 가시
                    ctx.fillStyle = '#009900';
                    for (let i = 0; i < this.height; i += 14) {
                        ctx.fillRect(this.x + 3, this.y + i, 8, 5);
                        ctx.fillRect(this.x + this.width - 11, this.y + i, 8, 5);
                    }
                    // 팔
                    if (this.type === 'cactus-medium' || this.type === 'cactus-large') {
                        ctx.fillStyle = this.color;
                        ctx.fillRect(this.x - 10, this.y + 18, 12, 10);
                        ctx.fillRect(this.x + this.width - 2, this.y + 18, 12, 10);
                    }
                    if (this.type === 'cactus-large') {
                        ctx.fillRect(this.x - 10, this.y + 50, 12, 10);
                        ctx.fillRect(this.x + this.width - 2, this.y + 50, 12, 10);
                    }
                    // 외곽
                    ctx.strokeStyle = '#005500';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(this.x + 12, this.y, this.width - 24, this.height);
                }

                ctx.restore();
            }
        }

        // ============================================================================
        // COIN CLASS
        // ============================================================================
        class Coin {
            constructor() {
                this.x = GAME_CONFIG.width;
                this.y = GAME_CONFIG.groundY - 110 - Math.random() * 80;
                this.radius = 20; // 14 → 20 (크기 업!)
                this.frameIndex = 0;
            }

            update(gameSpeed, deltaTime) {
                this.x -= gameSpeed;
                this.frameIndex += 0.15;
            }

            getHitbox() {
                return {
                    x: this.x - this.radius,
                    y: this.y - this.radius,
                    width: this.radius * 2,
                    height: this.radius * 2
                };
            }

            draw(ctx) {
                ctx.save();

                // Rotate
                ctx.translate(this.x, this.y);
                ctx.rotate(this.frameIndex * 0.05);

                // 그림자
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.beginPath();
                ctx.ellipse(2, 3, this.radius, this.radius * 0.7, 0, 0, Math.PI * 2);
                ctx.fill();

                // Coin body
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // 내부 링
                ctx.strokeStyle = '#DAA520';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius - 5, 0, Math.PI * 2);
                ctx.stroke();

                // Shine
                ctx.fillStyle = '#FFFF44';
                ctx.beginPath();
                ctx.arc(-5, -5, 5, 0, Math.PI * 2);
                ctx.fill();

                // Symbol
                ctx.fillStyle = '#CC8800';
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('★', 0, 1);

                // Outline
                ctx.strokeStyle = '#CC9900';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.stroke();

                ctx.restore();
            }
        }

        // ============================================================================
        // POWER-UP CLASS
        // ============================================================================
        class PowerUp {
            constructor(type) {
                this.type = type;
                this.x = GAME_CONFIG.width;
                this.y = GAME_CONFIG.groundY - 130 - Math.random() * 60;
                this.radius = 26; // 20 → 26 (크기 업!)
                this.frameIndex = 0;

                if (type === 'shield') {
                    this.color = '#0099FF';
                    this.icon = '🛡';
                } else if (type === 'magnet') {
                    this.color = '#9900FF';
                    this.icon = '🧲';
                } else if (type === '2x') {
                    this.color = '#FFD700';
                    this.icon = 'x2';
                } else if (type === 'slow') {
                    this.color = '#00FF88';
                    this.icon = '🐢';
                }
            }

            update(gameSpeed, deltaTime) {
                this.x -= gameSpeed;
                this.frameIndex += 0.1;
            }

            getHitbox() {
                return {
                    x: this.x - this.radius,
                    y: this.y - this.radius,
                    width: this.radius * 2,
                    height: this.radius * 2
                };
            }

            draw(ctx) {
                ctx.save();

                // Glow
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 25;

                // Body
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // Pulsing outline
                const pulse = 2.5 + Math.sin(this.frameIndex) * 2.5;
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = pulse;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius + 4, 0, Math.PI * 2);
                ctx.stroke();

                // Icon
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 22px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.icon, this.x, this.y + 1);

                ctx.restore();
            }
        }

        // ============================================================================
        // BACKGROUND CLASS - 계절 시스템 (봄 → 여름 → 가을 → 겨울)
        // ============================================================================
        // 계절 전환 기준 점수
        const SEASONS = {
            spring: { // 봄: 0~49점
                skyTop: '#A8D8FF', skyMid: '#D4ECFF', skyBot: '#FFF0F5',
                mountain: '#7BAE5E', mountainSnow: '#FFFFFF',
                ground: '#55CC55', groundLine: '#44AA44',
                cloudColor: '#FFFFFF',
                label: '🌸 봄', particles: 'petals',
                treeColor: '#FF99BB', treeTrunk: '#8B5E3C',
                flowerColors: ['#FF69B4', '#FF85C8', '#FFB7D5', '#FFFFFF']
            },
            summer: { // 여름: 50~149점
                skyTop: '#1E90FF', skyMid: '#66BBFF', skyBot: '#F0F8FF',
                mountain: '#5A8A3A', mountainSnow: null,
                ground: '#22AA22', groundLine: '#1A8A1A',
                cloudColor: '#FFFFFF',
                label: '☀️ 여름', particles: 'none',
                treeColor: '#228B22', treeTrunk: '#654321',
                flowerColors: ['#FFD700', '#FF6347', '#ADFF2F']
            },
            autumn: { // 가을: 150~299점
                skyTop: '#FF8C42', skyMid: '#FFBA73', skyBot: '#FFE0B2',
                mountain: '#B8860B', mountainSnow: null,
                ground: '#CC9944', groundLine: '#AA7733',
                cloudColor: '#FFE4C4',
                label: '🍂 가을', particles: 'leaves',
                treeColor: '#FF6600', treeTrunk: '#5C3317',
                flowerColors: ['#FF4500', '#FF8C00', '#FFD700', '#8B4513']
            },
            winter: { // 겨울: 300점 이상
                skyTop: '#4A6FA5', skyMid: '#8AACC8', skyBot: '#C8D8E8',
                mountain: '#6A7B8B', mountainSnow: '#FFFFFF',
                ground: '#E8E8F0', groundLine: '#B0B8C0',
                cloudColor: '#D0D8E0',
                label: '❄️ 겨울', particles: 'snow',
                treeColor: null, treeTrunk: '#5C3317',
                flowerColors: []
            }
        };

        // 계절 순환: 봄→여름→가을→겨울→봄→여름→... (400점 주기 — 한 계절 약 10초)
        function getCurrentSeason(score) {
            const cycle = score % 400;
            if (cycle < 100) return 'spring';
            if (cycle < 200) return 'summer';
            if (cycle < 300) return 'autumn';
            return 'winter';
        }

        function lerpColor(c1, c2, t) {
            // c1, c2 = '#RRGGBB'
            const r1 = parseInt(c1.slice(1,3),16), g1 = parseInt(c1.slice(3,5),16), b1 = parseInt(c1.slice(5,7),16);
            const r2 = parseInt(c2.slice(1,3),16), g2 = parseInt(c2.slice(3,5),16), b2 = parseInt(c2.slice(5,7),16);
            const r = Math.round(r1 + (r2-r1)*t), g = Math.round(g1 + (g2-g1)*t), b = Math.round(b1 + (b2-b1)*t);
            return `rgb(${r},${g},${b})`;
        }

        class Background {
            constructor() {
                this.cloudX = 0;
                this.time = 0;
                this.weatherParticles = [];
                this.currentSeason = 'spring';
                this.transitionT = 0; // 0~1 전환 진행도
                this.prevSeason = 'spring';
                this.treePositions = [120, 350, 580, 780, 950]; // 나무 x좌표
                this._cachedSeason = null; // 캐싱된 보간 결과
                this._cachedTransitionT = -1; // 마지막 캐싱 시 transitionT
                this._cachedSeasonKey = ''; // 캐시 키
            }

            update(deltaTime, score) {
                this.cloudX -= 90 * deltaTime; // 초당 90px (deltaTime 기반으로 부드럽게)
                // cloudX를 리셋하지 않음 — 구름/나무는 modulo로 위치 계산하므로
                // 끊김 없이 무한 스크롤됨. float 오버플로 방지만 처리.
                if (this.cloudX < -100000) this.cloudX += 100000;
                this.time += deltaTime;

                // 계절 전환 (이전 전환이 완료되지 않아도 즉시 새 계절로 전환 시작)
                const newSeason = getCurrentSeason(score || 0);
                if (newSeason !== this.currentSeason) {
                    this.prevSeason = this.currentSeason;
                    this.currentSeason = newSeason;
                    this.transitionT = 0;
                }
                if (this.transitionT < 1) {
                    this.transitionT = Math.min(1, this.transitionT + deltaTime * 0.18); // ~5.5초에 걸쳐 부드럽게 전환
                }

                // 날씨 파티클 생성 (계절 전환 시 페이드인/아웃)
                const currSeason = SEASONS[this.currentSeason];
                const prevSeason = SEASONS[this.prevSeason];
                const t = this.transitionT;

                // 새 계절 파티클 (전환 진행에 따라 확률 증가)
                const currRate = t >= 1 ? 1 : t;
                // 이전 계절 파티클 (전환 진행에 따라 확률 감소)
                const prevRate = t >= 1 ? 0 : (1 - t);

                // 헬퍼: 파티클 타입별 생성
                this._spawnParticles(currSeason, currRate);
                if (prevRate > 0.05 && this.prevSeason !== this.currentSeason) {
                    this._spawnParticles(prevSeason, prevRate);
                }

                // 파티클 업데이트
                this.weatherParticles = this.weatherParticles.filter(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.type === 'snow') p.x += Math.sin(p.y * 0.02) * 0.5;
                    if (p.rot !== undefined) p.rot += p.rotSpeed;
                    return p.x > -20 && p.y < GAME_CONFIG.height + 10;
                });
                // 파티클 수 제한
                if (this.weatherParticles.length > 60) {
                    this.weatherParticles = this.weatherParticles.slice(-60);
                }
            }

            _spawnParticles(season, rate) {
                if (season.particles === 'snow' && Math.random() < 0.15 * rate) {
                    this.weatherParticles.push({
                        x: Math.random() * GAME_CONFIG.width,
                        y: -5,
                        vx: Math.random() * 2 - 1,
                        vy: Math.random() * 1.5 + 1,
                        size: Math.random() * 3 + 2,
                        type: 'snow'
                    });
                }
                if (season.particles === 'leaves' && Math.random() < 0.08 * rate) {
                    const colors = season.flowerColors;
                    if (colors.length > 0) {
                        this.weatherParticles.push({
                            x: GAME_CONFIG.width + 10,
                            y: Math.random() * GAME_CONFIG.groundY * 0.7,
                            vx: -(Math.random() * 3 + 2),
                            vy: Math.random() * 1 + 0.5,
                            rot: Math.random() * Math.PI * 2,
                            rotSpeed: (Math.random() - 0.5) * 0.1,
                            size: Math.random() * 6 + 4,
                            color: colors[Math.floor(Math.random() * colors.length)],
                            type: 'leaf'
                        });
                    }
                }
                if (season.particles === 'petals' && Math.random() < 0.12 * rate) {
                    const colors = season.flowerColors;
                    if (colors.length > 0) {
                        this.weatherParticles.push({
                            x: GAME_CONFIG.width + 10,
                            y: Math.random() * GAME_CONFIG.groundY * 0.6,
                            vx: -(Math.random() * 2 + 1),
                            vy: Math.sin(this.time * 3) * 0.5 + 0.5,
                            size: Math.random() * 4 + 3,
                            color: colors[Math.floor(Math.random() * colors.length)],
                            type: 'petal'
                        });
                    }
                }
            }

            getSeason() {
                const s = SEASONS[this.currentSeason];
                if (this.transitionT >= 1 || this.prevSeason === this.currentSeason) {
                    // 전환 완료 상태에서도 snowAlpha / treeAlpha 포함
                    return Object.assign({}, s, {
                        snowAlpha: s.mountainSnow ? 1 : 0,
                        treeAlpha: s.treeColor ? 1 : 0,
                        winterGroundAlpha: this.currentSeason === 'winter' ? 0.3 : 0
                    });
                }

                // transitionT를 5% 단위로 스냅해서 캐시 히트율 높이기
                const snappedT = Math.round(this.transitionT * 20) / 20;
                const cacheKey = this.prevSeason + '_' + this.currentSeason + '_' + snappedT;
                if (this._cachedSeasonKey === cacheKey && this._cachedSeason) {
                    return this._cachedSeason;
                }

                const p = SEASONS[this.prevSeason];

                // 나무 잎 색상 보간 (null인 겨울 처리)
                let treeColorResult = s.treeColor;
                let treeAlpha = s.treeColor ? 1 : 0;
                if (p.treeColor && s.treeColor) {
                    // 둘 다 잎이 있음 → 색상 보간
                    treeColorResult = lerpColor(p.treeColor, s.treeColor, snappedT);
                    treeAlpha = 1;
                } else if (p.treeColor && !s.treeColor) {
                    // 잎 있음 → 겨울(잎 없음): 페이드아웃
                    treeColorResult = p.treeColor;
                    treeAlpha = 1 - snappedT;
                } else if (!p.treeColor && s.treeColor) {
                    // 겨울(잎 없음) → 잎 있음: 페이드인
                    treeColorResult = s.treeColor;
                    treeAlpha = snappedT;
                }

                // 산 위 눈 알파 보간
                const prevHasSnow = p.mountainSnow ? 1 : 0;
                const currHasSnow = s.mountainSnow ? 1 : 0;
                const snowAlpha = prevHasSnow + (currHasSnow - prevHasSnow) * snappedT;

                // 겨울 땅 눈 효과 알파
                const prevWinter = this.prevSeason === 'winter' ? 0.3 : 0;
                const currWinter = this.currentSeason === 'winter' ? 0.3 : 0;
                const winterGroundAlpha = prevWinter + (currWinter - prevWinter) * snappedT;

                this._cachedSeason = {
                    skyTop: lerpColor(p.skyTop, s.skyTop, snappedT),
                    skyMid: lerpColor(p.skyMid, s.skyMid, snappedT),
                    skyBot: lerpColor(p.skyBot, s.skyBot, snappedT),
                    mountain: lerpColor(p.mountain, s.mountain, snappedT),
                    mountainSnow: s.mountainSnow || p.mountainSnow,
                    snowAlpha: snowAlpha,
                    ground: lerpColor(p.ground, s.ground, snappedT),
                    groundLine: lerpColor(p.groundLine, s.groundLine, snappedT),
                    cloudColor: lerpColor(p.cloudColor, s.cloudColor, snappedT),
                    label: s.label,
                    particles: s.particles,
                    prevParticles: p.particles,
                    particleFade: snappedT,
                    treeColor: treeColorResult,
                    treeAlpha: treeAlpha,
                    treeTrunk: lerpColor(p.treeTrunk, s.treeTrunk, snappedT),
                    flowerColors: snappedT < 0.5 ? p.flowerColors : s.flowerColors,
                    winterGroundAlpha: winterGroundAlpha
                };
                this._cachedSeasonKey = cacheKey;
                return this._cachedSeason;
            }

            draw(ctx) {
                const s = this.getSeason();

                // 하늘 그라데이션 (캐싱)
                const skyKey = s.skyTop + s.skyMid + s.skyBot;
                if (this._skyKey !== skyKey) {
                    this._skyGradient = ctx.createLinearGradient(0, 0, 0, GAME_CONFIG.height);
                    this._skyGradient.addColorStop(0, s.skyTop);
                    this._skyGradient.addColorStop(0.5, s.skyMid);
                    this._skyGradient.addColorStop(1, s.skyBot);
                    this._skyKey = skyKey;
                }
                ctx.fillStyle = this._skyGradient;
                ctx.fillRect(0, 0, GAME_CONFIG.width, GAME_CONFIG.height);

                // 구름
                for (let i = 0; i < 4; i++) {
                    const cw = GAME_CONFIG.width + 200;
                    const cx = ((this.cloudX * 0.8 + i * 320) % cw + cw) % cw - 50;
                    this.drawCloud(ctx, cx, 60 + i * 35, s.cloudColor);
                }

                // 산
                ctx.fillStyle = s.mountain;
                ctx.beginPath();
                ctx.moveTo(-50, GAME_CONFIG.groundY - 50);
                ctx.lineTo(150, GAME_CONFIG.groundY - 180);
                ctx.lineTo(350, GAME_CONFIG.groundY - 60);
                ctx.lineTo(500, GAME_CONFIG.groundY - 200);
                ctx.lineTo(700, GAME_CONFIG.groundY - 70);
                ctx.lineTo(850, GAME_CONFIG.groundY - 160);
                ctx.lineTo(GAME_CONFIG.width + 50, GAME_CONFIG.groundY - 80);
                ctx.lineTo(GAME_CONFIG.width + 50, GAME_CONFIG.height);
                ctx.lineTo(-50, GAME_CONFIG.height);
                ctx.closePath();
                ctx.fill();

                // 산 위 눈 (봄, 겨울) — 페이드인/아웃
                if (s.mountainSnow && s.snowAlpha > 0.01) {
                    ctx.save();
                    ctx.globalAlpha = s.snowAlpha;
                    ctx.fillStyle = s.mountainSnow;
                    // 봉우리 1
                    ctx.beginPath();
                    ctx.moveTo(150, GAME_CONFIG.groundY - 180);
                    ctx.lineTo(130, GAME_CONFIG.groundY - 145);
                    ctx.lineTo(170, GAME_CONFIG.groundY - 145);
                    ctx.closePath();
                    ctx.fill();
                    // 봉우리 2
                    ctx.beginPath();
                    ctx.moveTo(500, GAME_CONFIG.groundY - 200);
                    ctx.lineTo(475, GAME_CONFIG.groundY - 160);
                    ctx.lineTo(525, GAME_CONFIG.groundY - 160);
                    ctx.closePath();
                    ctx.fill();
                    // 봉우리 3
                    ctx.beginPath();
                    ctx.moveTo(850, GAME_CONFIG.groundY - 160);
                    ctx.lineTo(830, GAME_CONFIG.groundY - 130);
                    ctx.lineTo(870, GAME_CONFIG.groundY - 130);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                }

                // 나무들
                this.treePositions.forEach((tx, i) => {
                    const scrolledX = ((tx + this.cloudX * 0.5) % (GAME_CONFIG.width + 100) + (GAME_CONFIG.width + 100)) % (GAME_CONFIG.width + 100) - 50;
                    this.drawTree(ctx, scrolledX, GAME_CONFIG.groundY, s, i);
                });

                // 땅
                ctx.fillStyle = s.ground;
                ctx.fillRect(0, GAME_CONFIG.groundY, GAME_CONFIG.width, GAME_CONFIG.height - GAME_CONFIG.groundY);

                // 땅 경계선
                ctx.strokeStyle = s.groundLine;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, GAME_CONFIG.groundY);
                ctx.lineTo(GAME_CONFIG.width, GAME_CONFIG.groundY);
                ctx.stroke();

                // 겨울 눈 쌓인 효과 (그라데이션 페이드)
                if (s.winterGroundAlpha > 0.01) {
                    ctx.save();
                    ctx.globalAlpha = s.winterGroundAlpha / 0.3; // 0~1 범위로 정규화
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.fillRect(0, GAME_CONFIG.groundY - 2, GAME_CONFIG.width, 6);
                    ctx.restore();
                }

                // 날씨 파티클 그리기 (타입별 배치 렌더링)
                ctx.save();
                // 눈 파티클
                ctx.fillStyle = '#FFFFFF';
                ctx.globalAlpha = 0.8;
                ctx.beginPath();
                for (let i = 0; i < this.weatherParticles.length; i++) {
                    const p = this.weatherParticles[i];
                    if (p.type === 'snow') {
                        ctx.moveTo(p.x + p.size, p.y);
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    }
                }
                ctx.fill();
                ctx.restore();

                // 잎/꽃잎 파티클
                for (let i = 0; i < this.weatherParticles.length; i++) {
                    const p = this.weatherParticles[i];
                    if (p.type === 'leaf') {
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate(p.rot || 0);
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.ellipse(0, 0, p.size, p.size * 0.5, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    } else if (p.type === 'petal') {
                        ctx.save();
                        ctx.globalAlpha = 0.7;
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.ellipse(p.x, p.y, p.size, p.size * 0.6, Math.sin(p.x * 0.1) * 0.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                }

                // 계절 표시 (좌하단)
                ctx.save();
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.beginPath();
                ctx.roundRect(GAME_CONFIG.width - 120, GAME_CONFIG.groundY - 35, 110, 28, 8);
                ctx.fill();
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(SEASONS[this.currentSeason].label, GAME_CONFIG.width - 65, GAME_CONFIG.groundY - 21);
                ctx.restore();
            }

            drawCloud(ctx, x, y, color) {
                ctx.save();
                ctx.fillStyle = color;
                ctx.globalAlpha = 0.7;
                ctx.beginPath();
                ctx.arc(x, y, 22, 0, Math.PI * 2);
                ctx.arc(x + 22, y - 5, 28, 0, Math.PI * 2);
                ctx.arc(x + 50, y, 22, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            drawTree(ctx, x, groundY, season, index) {
                const trunkH = 40 + (index % 3) * 10;
                // 줄기
                ctx.fillStyle = season.treeTrunk;
                ctx.fillRect(x - 4, groundY - trunkH, 8, trunkH);

                const treeAlpha = season.treeAlpha !== undefined ? season.treeAlpha : (season.treeColor ? 1 : 0);
                const winterAlpha = 1 - treeAlpha; // 나뭇잎이 사라질수록 가지가 나타남

                // 나뭇잎 (페이드인/아웃)
                if (season.treeColor && treeAlpha > 0.01) {
                    ctx.save();
                    ctx.globalAlpha = treeAlpha;
                    ctx.fillStyle = season.treeColor;
                    ctx.beginPath();
                    ctx.arc(x, groundY - trunkH - 15, 20 + (index % 2) * 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x - 12, groundY - trunkH - 5, 14, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x + 12, groundY - trunkH - 5, 14, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                // 겨울 앙상한 가지 + 눈 (페이드인/아웃)
                if (winterAlpha > 0.01) {
                    ctx.save();
                    ctx.globalAlpha = winterAlpha;
                    ctx.strokeStyle = season.treeTrunk;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(x, groundY - trunkH);
                    ctx.lineTo(x - 15, groundY - trunkH - 20);
                    ctx.moveTo(x, groundY - trunkH);
                    ctx.lineTo(x + 15, groundY - trunkH - 18);
                    ctx.moveTo(x, groundY - trunkH + 10);
                    ctx.lineTo(x - 10, groundY - trunkH - 5);
                    ctx.stroke();
                    // 눈
                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath();
                    ctx.arc(x - 15, groundY - trunkH - 22, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x + 15, groundY - trunkH - 20, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }
        }

        // ============================================================================
        // SCENE CLASSES
        // ============================================================================
        class TitleScene {
            constructor() {
                this.bounceY = 0;
                this.bounceSpeed = 0.3;
                this.charFrame = 0;
                this.bg = new Background();
            }

            update(deltaTime) {
                this.bounceY += this.bounceSpeed;
                if (this.bounceY > 15 || this.bounceY < 0) this.bounceSpeed *= -1;
                this.charFrame += 0.05;
                this.bg.update(deltaTime * 0.3);
            }

            draw(ctx) {
                this.bg.draw(ctx);

                // 반투명 패널
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.beginPath();
                ctx.roundRect(GAME_CONFIG.width/2 - 280, 40, 560, 490, 20);
                ctx.fill();
                ctx.strokeStyle = '#0099FF';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.save();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // 제목
                ctx.fillStyle = '#FF4444';
                ctx.strokeStyle = '#CC0000';
                ctx.lineWidth = 3;
                ctx.font = 'bold 60px Arial';
                ctx.strokeText('동그라미 런', GAME_CONFIG.width/2, 95 - this.bounceY * 0.5);
                ctx.fillText('동그라미 런', GAME_CONFIG.width/2, 95 - this.bounceY * 0.5);

                // 선택된 캐릭터 미리보기
                const charKey = gameState.selectedCharacter;
                const char = spriteConfig.sprites[charKey];
                if (char && char.drawSprite) {
                    char.drawSprite(ctx, GAME_CONFIG.width/2 - 32, 130, this.charFrame, false, false);
                }
                ctx.fillStyle = '#333';
                ctx.font = 'bold 20px Arial';
                ctx.fillText(char ? char.name : '동그라미', GAME_CONFIG.width/2, 210);

                // 최고 점수 / 동전
                ctx.fillStyle = '#555';
                ctx.font = '22px Arial';
                ctx.fillText(`최고 점수: ${gameState.bestScore}  |  보유 동전: ${gameState.totalCoins}`, GAME_CONFIG.width/2, 250);

                // ★ 코인 이벤트 배너
                const eventBlink = Math.sin(Date.now() * 0.005) > 0;
                if (eventBlink) {
                    ctx.fillStyle = '#FFD700';
                    ctx.font = 'bold 18px Arial';
                    ctx.fillText('🎉 코인 대이벤트! 20,100,000 코인 지급중! 🎉', GAME_CONFIG.width/2, 280);
                }

                // 게임 시작 버튼
                ctx.fillStyle = '#0099FF';
                ctx.beginPath();
                ctx.roundRect(GAME_CONFIG.width/2 - 150, 290, 300, 65, 12);
                ctx.fill();
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 32px Arial';
                ctx.fillText('게임 시작!', GAME_CONFIG.width/2, 323);

                // 캐릭터 선택 버튼
                ctx.fillStyle = '#FF8800';
                ctx.beginPath();
                ctx.roundRect(GAME_CONFIG.width/2 - 150, 375, 140, 50, 12);
                ctx.fill();
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 22px Arial';
                ctx.fillText('캐릭터', GAME_CONFIG.width/2 - 80, 401);

                // 설정 버튼
                ctx.fillStyle = '#666';
                ctx.beginPath();
                ctx.roundRect(GAME_CONFIG.width/2 + 10, 375, 140, 50, 12);
                ctx.fill();
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 22px Arial';
                ctx.fillText('⚙ 설정', GAME_CONFIG.width/2 + 80, 401);

                // 조작법 안내
                ctx.fillStyle = '#888';
                ctx.font = '15px Arial';
                ctx.fillText('탭 = 점프 / 더블탭 = 더블점프 / 아래 스와이프 = 숙이기', GAME_CONFIG.width/2, 455);

                // 새로고침 버튼 (좌측 하단)
                ctx.fillStyle = '#4CAF50';
                ctx.beginPath();
                ctx.roundRect(15, GAME_CONFIG.height - 50, 110, 38, 10);
                ctx.fill();
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('🔄 새로고침', 70, GAME_CONFIG.height - 31);

                // 버전 표시 (우측 하단)
                ctx.textAlign = 'right';
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.font = '13px Arial';
                ctx.fillText('v3.11.6', GAME_CONFIG.width - 15, GAME_CONFIG.height - 12);

                ctx.restore();
            }

            handleInput(inputState) {
                if (!inputState.jumping) return;
                const mx = inputManager.lastTouchX;
                const my = inputManager.lastTouchY;
                if (mx === undefined || my === undefined) return;

                const cx = GAME_CONFIG.width / 2;
                // 게임 시작 버튼 영역
                if (mx >= cx - 150 && mx <= cx + 150 && my >= 290 && my <= 355) {
                    gameState.score = 0;
                    gameState.coins = 0;
                    gameState.coinsEarned = 0;
                    gameState.lives = gameState.maxLives;
                    gameState.invulnTimer = 0;
                    gameState.speedLevel = 0;
                    gameState.winterCount = 0;
                    gameState.seasonLevel = 0;
                    gameState.gameSpeed = GAME_CONFIG.initialSpeed;
                    gameState.currentScene = 'game';
                    gameState.isRunning = true;
                    gameState.isPaused = false;
                    gameState.endingTriggered = false;
                    gameState.hitFlashTimer = 0;
                    gameState.gameStartTime = Date.now();
                    // 캐릭터 능력 상태 초기화
                    gameState.abilityState = {};
                    const ability = CHARACTER_ABILITIES[gameState.selectedCharacter];
                    if (ability) {
                        if (ability.type === 'hitIgnore') gameState.abilityState.hitIgnoreLeft = ability.charges;
                        if (ability.type === 'springCoin') gameState.abilityState.springCoinTimer = 0;
                        if (ability.type === 'summerCoin') gameState.abilityState.seasonCoinTimer = 0;
                        if (ability.type === 'autumnWinterCoin') gameState.abilityState.seasonCoinTimer = 0;
                        if (ability.type === 'fartBoost') gameState.abilityState.fartCharges = ability.charges;
                        if (ability.type === 'waveBlast') gameState.abilityState.waveCharges = ability.charges;
                        if (ability.type === 'flight') { gameState.abilityState.flightCharges = ability.charges; gameState.abilityState.flyingTimer = 0; }
                        if (ability.type === 'eatObstacle') { gameState.abilityState.eatCharges = ability.charges; gameState.abilityState.eatEffectTimer = 0; }
                    }
                    if (typeof engine !== 'undefined' && engine.scenes) {
                        engine.scenes.game = null;
                        engine.scenes.gameOver = null;
                    }
                }
                // 캐릭터 선택 버튼 영역
                if (mx >= cx - 150 && mx <= cx - 10 && my >= 375 && my <= 425) {
                    gameState.currentScene = 'select';
                }
                // 설정 버튼 영역
                if (mx >= cx + 10 && mx <= cx + 150 && my >= 375 && my <= 425) {
                    gameState.currentScene = 'settings';
                }
                // 새로고침 버튼 영역 (좌측 하단)
                if (mx >= 15 && mx <= 125 && my >= GAME_CONFIG.height - 50 && my <= GAME_CONFIG.height - 12) {
                    // 캐시 삭제 후 강제 새로고침
                    if ('caches' in window) {
                        caches.keys().then(function(names) {
                            names.forEach(function(name) { caches.delete(name); });
                        }).then(function() { window.location.reload(true); });
                    } else {
                        window.location.reload(true);
                    }
                }
            }
        }

        // ============================================================================
        // SETTINGS SCENE - 설정 메뉴
        // ============================================================================
        class SettingsScene {
            constructor() {
                this.bg = new Background();
                this.dragging = null; // 'bgm' or 'sfx'
            }

            update(deltaTime) {
                this.bg.update(deltaTime * 0.2);
            }

            draw(ctx) {
                this.bg.draw(ctx);
                const W = GAME_CONFIG.width, H = GAME_CONFIG.height;

                // 메인 패널
                ctx.fillStyle = 'rgba(255,255,255,0.92)';
                ctx.beginPath(); ctx.roundRect(W/2 - 260, 30, 520, H - 60, 20); ctx.fill();
                ctx.strokeStyle = '#666'; ctx.lineWidth = 3; ctx.stroke();

                ctx.save();
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

                // 제목
                ctx.fillStyle = '#333'; ctx.font = 'bold 36px Arial';
                ctx.fillText('⚙ 설정', W/2, 70);

                // BGM 볼륨
                const sliderX = W/2 - 150, sliderW = 300, sliderY1 = 140, sliderY2 = 230;

                ctx.fillStyle = '#444'; ctx.font = 'bold 20px Arial'; ctx.textAlign = 'left';
                ctx.fillText('🎵 배경음악', sliderX, sliderY1 - 25);
                // 음소거 버튼
                ctx.textAlign = 'right';
                ctx.fillStyle = gameState.bgmMuted ? '#CC0000' : '#22AA22';
                ctx.font = 'bold 18px Arial';
                ctx.fillText(gameState.bgmMuted ? '🔇 OFF' : '🔊 ON', sliderX + sliderW, sliderY1 - 25);

                this._drawSlider(ctx, sliderX, sliderY1, sliderW, gameState.bgmMuted ? 0 : gameState.bgmVolume, '#0099FF');

                // SFX 볼륨
                ctx.textAlign = 'left'; ctx.fillStyle = '#444'; ctx.font = 'bold 20px Arial';
                ctx.fillText('🔔 효과음', sliderX, sliderY2 - 25);
                this._drawSlider(ctx, sliderX, sliderY2, sliderW, gameState.sfxVolume, '#FF8800');

                // 현재 통계
                ctx.textAlign = 'center'; ctx.fillStyle = '#666'; ctx.font = '18px Arial';
                ctx.fillText(`총 게임 횟수: ${gameState.totalGames || 0}`, W/2, 310);
                ctx.fillText(`최고 점수: ${gameState.bestScore}`, W/2, 340);
                ctx.fillText(`보유 동전: ${gameState.totalCoins}`, W/2, 370);

                // 돌아가기 버튼
                ctx.fillStyle = '#666';
                ctx.beginPath(); ctx.roundRect(W/2 - 80, H - 80, 160, 45, 10); ctx.fill();
                ctx.fillStyle = '#FFF'; ctx.font = 'bold 22px Arial';
                ctx.fillText('← 돌아가기', W/2, H - 57);

                ctx.restore();
            }

            _drawSlider(ctx, x, y, w, value, color) {
                // 트랙 배경
                ctx.fillStyle = '#DDD';
                ctx.beginPath(); ctx.roundRect(x, y - 6, w, 12, 6); ctx.fill();
                // 채워진 부분
                ctx.fillStyle = color;
                ctx.beginPath(); ctx.roundRect(x, y - 6, w * value, 12, 6); ctx.fill();
                // 핸들
                const hx = x + w * value;
                ctx.fillStyle = '#FFF'; ctx.strokeStyle = color; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(hx, y, 14, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                // 퍼센트 표시
                ctx.fillStyle = '#333'; ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(Math.round(value * 100) + '%', hx, y);
            }

            handleInput(inputState) {
                const mx = inputManager.lastTouchX;
                const my = inputManager.lastTouchY;
                if (mx === undefined || my === undefined) return;

                const W = GAME_CONFIG.width, H = GAME_CONFIG.height;
                const sliderX = W/2 - 150, sliderW = 300;

                // 슬라이더 드래그 (터치 이동 시)
                if (inputState.jumping || this.dragging) {
                    // BGM 슬라이더 영역 (y=140 ± 20)
                    if (my >= 120 && my <= 160) {
                        const val = Math.max(0, Math.min(1, (mx - sliderX) / sliderW));
                        gameState.bgmVolume = val;
                        gameState.bgmMuted = false;
                        localStorage.setItem('bgmVolume', val);
                        localStorage.setItem('bgmMuted', 'false');
                        if (typeof seasonalBGM !== 'undefined') { seasonalBGM.setVolume(val); seasonalBGM.setMuted(false); }
                        this.dragging = 'bgm';
                    }
                    // SFX 슬라이더 영역 (y=230 ± 20)
                    else if (my >= 210 && my <= 250) {
                        const val = Math.max(0, Math.min(1, (mx - sliderX) / sliderW));
                        gameState.sfxVolume = val;
                        localStorage.setItem('sfxVolume', val);
                        if (audioManager.masterGain) audioManager.masterGain.gain.value = 0.3 * val;
                        this.dragging = 'sfx';
                    }
                    // BGM 음소거 토글 (우측 상단)
                    else if (inputState.jumping && mx >= sliderX + sliderW - 80 && mx <= sliderX + sliderW &&
                             my >= 105 && my <= 130) {
                        gameState.bgmMuted = !gameState.bgmMuted;
                        localStorage.setItem('bgmMuted', gameState.bgmMuted);
                        if (typeof seasonalBGM !== 'undefined') seasonalBGM.setMuted(gameState.bgmMuted);
                    }
                    // 돌아가기
                    else if (inputState.jumping && mx >= W/2 - 80 && mx <= W/2 + 80 && my >= H - 80 && my <= H - 35) {
                        gameState.currentScene = 'title';
                        this.dragging = null;
                    }
                }

                if (!inputState.jumping) this.dragging = null;
            }
        }

        // ============================================================================
        // CHARACTER SELECT SCENE
        // ============================================================================
        class SelectScene {
            constructor() {
                this.charFrame = 0;
                this.bg = new Background();
                this.message = '';
                this.messageTimer = 0;
                // 스크롤 시스템
                this.scrollY = 0;
                this.scrollVelocity = 0;
                this.maxScroll = 0;
                this.isDragging = false;
                this.dragStartY = 0;
                this.dragStartScroll = 0;
                this.lastDragY = 0;
                this.dragMoved = false; // 드래그 vs 탭 구분용
                // 그리드 설정
                this.cols = 3;
                this.cellW = 160;
                this.cellH = 170;
                this.gridTop = 115; // 그리드 시작 Y (패널 내부 기준)
                this.gridBottom = GAME_CONFIG.height - 130; // 그리드 끝 Y
                this.gridClipH = this.gridBottom - this.gridTop; // 보이는 영역 높이
                // 터치/마우스 스크롤 이벤트 등록
                this._setupScrollListeners();
            }

            _setupScrollListeners() {
                const canvas = document.getElementById('gameCanvas');
                // 마우스 휠
                this._wheelHandler = (e) => {
                    if (gameState.currentScene !== 'select') return;
                    this.scrollY += e.deltaY * 0.5;
                    this._clampScroll();
                    e.preventDefault();
                };
                canvas.addEventListener('wheel', this._wheelHandler, { passive: false });

                // 터치 스크롤 (캐릭터 그리드 영역 내 드래그)
                this._touchStartHandler = (e) => {
                    if (gameState.currentScene !== 'select') return;
                    const rect = canvas.getBoundingClientRect();
                    const sy = GAME_CONFIG.height / rect.height;
                    const ty = (e.touches[0].clientY - rect.top) * sy;
                    if (ty >= this.gridTop && ty <= this.gridBottom) {
                        this.isDragging = true;
                        this.dragStartY = e.touches[0].clientY;
                        this.dragStartScroll = this.scrollY;
                        this.lastDragY = e.touches[0].clientY;
                        this.dragMoved = false;
                        this.scrollVelocity = 0;
                    }
                };
                this._touchMoveHandler = (e) => {
                    if (!this.isDragging || gameState.currentScene !== 'select') return;
                    const dy = e.touches[0].clientY - this.dragStartY;
                    const rect = canvas.getBoundingClientRect();
                    const scale = GAME_CONFIG.height / rect.height;
                    this.scrollY = this.dragStartScroll - dy * scale;
                    this._clampScroll();
                    // 속도 계산 (관성용)
                    this.scrollVelocity = -(e.touches[0].clientY - this.lastDragY) * scale;
                    this.lastDragY = e.touches[0].clientY;
                    if (Math.abs(dy) > 8) this.dragMoved = true;
                    e.preventDefault();
                };
                this._touchEndHandler = () => {
                    this.isDragging = false;
                };
                canvas.addEventListener('touchstart', this._touchStartHandler, { passive: true });
                canvas.addEventListener('touchmove', this._touchMoveHandler, { passive: false });
                canvas.addEventListener('touchend', this._touchEndHandler, { passive: true });
            }

            _clampScroll() {
                if (this.scrollY < 0) this.scrollY = 0;
                if (this.scrollY > this.maxScroll) this.scrollY = this.maxScroll;
            }

            _calcMaxScroll() {
                const keys = Object.keys(spriteConfig.sprites);
                const rows = Math.ceil(keys.length / this.cols);
                const totalH = rows * (this.cellH + 10);
                this.maxScroll = Math.max(0, totalH - this.gridClipH);
            }

            update(deltaTime) {
                this.charFrame += 0.05;
                this.bg.update(deltaTime * 0.2);
                if (this.messageTimer > 0) this.messageTimer -= deltaTime;
                this._calcMaxScroll();
                // 관성 스크롤
                if (!this.isDragging && Math.abs(this.scrollVelocity) > 0.5) {
                    this.scrollY += this.scrollVelocity * deltaTime * 60;
                    this.scrollVelocity *= 0.92;
                    this._clampScroll();
                } else if (!this.isDragging) {
                    this.scrollVelocity = 0;
                }
            }

            draw(ctx) {
                this.bg.draw(ctx);
                const W = GAME_CONFIG.width;
                const H = GAME_CONFIG.height;

                // 메인 패널
                ctx.fillStyle = 'rgba(255,255,255,0.92)';
                ctx.beginPath();
                ctx.roundRect(30, 15, W - 60, H - 30, 20);
                ctx.fill();
                ctx.strokeStyle = '#FF8800';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.save();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // 제목
                ctx.fillStyle = '#FF8800';
                ctx.font = 'bold 36px Arial';
                ctx.fillText('캐릭터 선택', W/2, 50);

                // 보유 동전
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 22px Arial';
                ctx.fillText(`💰 보유 동전: ${gameState.totalCoins}`, W/2, 88);

                // ── 스크롤 가능한 캐릭터 그리드 영역 ──
                const keys = Object.keys(spriteConfig.sprites);
                const { cols, cellW, cellH, gridTop, gridClipH } = this;
                const rows = Math.ceil(keys.length / cols);
                const gridW = cols * cellW;
                const gridStartX = W/2 - gridW / 2;

                // 클리핑 영역 설정
                ctx.save();
                ctx.beginPath();
                ctx.rect(35, gridTop, W - 70, gridClipH);
                ctx.clip();

                keys.forEach((key, i) => {
                    const char = spriteConfig.sprites[key];
                    const row = Math.floor(i / cols);
                    const col = i % cols;
                    // 각 줄의 실제 아이템 수로 중앙 정렬
                    const rowItems = Math.min(cols, keys.length - row * cols);
                    const rowW = rowItems * cellW;
                    const rowStartX = W/2 - rowW / 2;
                    const cx = rowStartX + col * cellW + cellW / 2;
                    const cardY = gridTop + row * (cellH + 10) - this.scrollY;

                    // 화면 밖이면 스킵 (성능)
                    if (cardY + cellH < gridTop - 10 || cardY > gridTop + gridClipH + 10) return;

                    const isSelected = gameState.selectedCharacter === key;
                    const isUnlocked = gameState.unlockedCharacters.includes(key);

                    // 카드 배경 (좀 더 큰 카드)
                    ctx.fillStyle = isSelected ? '#DDEEFF' : '#F5F5F5';
                    ctx.strokeStyle = isSelected ? '#0099FF' : '#DDD';
                    ctx.lineWidth = isSelected ? 3 : 1;
                    ctx.beginPath();
                    ctx.roundRect(cx - cellW/2 + 8, cardY, cellW - 16, cellH - 10, 12);
                    ctx.fill();
                    ctx.stroke();

                    // 선택 하이라이트 글로우
                    if (isSelected) {
                        ctx.shadowColor = '#0099FF';
                        ctx.shadowBlur = 8;
                        ctx.strokeStyle = '#0099FF';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.roundRect(cx - cellW/2 + 8, cardY, cellW - 16, cellH - 10, 12);
                        ctx.stroke();
                        ctx.shadowBlur = 0;
                    }

                    // 캐릭터 스프라이트 (큰 사이즈)
                    if (char.drawSprite) {
                        if (!isUnlocked) ctx.globalAlpha = 0.35;
                        try {
                            char.drawSprite(ctx, cx - 32, cardY + 15, this.charFrame, false, false);
                        } catch(e) {
                            ctx.fillStyle = char.colors ? char.colors.main : '#CCC';
                            ctx.beginPath();
                            ctx.arc(cx, cardY + 50, 24, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.globalAlpha = 1;
                    }
                    // 잠금 표시
                    if (!isUnlocked) {
                        ctx.fillStyle = 'rgba(0,0,0,0.3)';
                        ctx.beginPath();
                        ctx.arc(cx, cardY + 47, 24, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#FFF';
                        ctx.font = 'bold 28px Arial';
                        ctx.fillText('🔒', cx, cardY + 50);
                    }

                    // 캐릭터 이름
                    ctx.fillStyle = '#333';
                    ctx.font = 'bold 15px Arial';
                    ctx.fillText(char.name, cx, cardY + cellH - 48);

                    // 능력 이름 (작은 글씨)
                    const ab = CHARACTER_ABILITIES[key];
                    if (ab && ab.type !== 'none') {
                        ctx.fillStyle = '#888';
                        ctx.font = '11px Arial';
                        ctx.fillText(ab.name, cx, cardY + cellH - 32);
                    }

                    // 가격 또는 상태
                    if (isSelected && isUnlocked) {
                        ctx.fillStyle = '#0099FF';
                        ctx.font = 'bold 14px Arial';
                        ctx.fillText('✓ 선택됨', cx, cardY + cellH - 16);
                    } else if (isUnlocked) {
                        ctx.fillStyle = '#22BB22';
                        ctx.font = '13px Arial';
                        ctx.fillText('보유중', cx, cardY + cellH - 16);
                    } else {
                        ctx.fillStyle = '#FF8800';
                        ctx.font = 'bold 14px Arial';
                        ctx.fillText(`🪙 ${char.cost}`, cx, cardY + cellH - 16);
                    }
                });

                ctx.restore(); // 클리핑 해제

                // 스크롤바 (maxScroll > 0일 때만)
                if (this.maxScroll > 0) {
                    const sbX = W - 50;
                    const sbH = gridClipH;
                    const thumbH = Math.max(30, (gridClipH / (gridClipH + this.maxScroll)) * sbH);
                    const thumbY = gridTop + (this.scrollY / this.maxScroll) * (sbH - thumbH);
                    // 트랙
                    ctx.fillStyle = 'rgba(0,0,0,0.08)';
                    ctx.beginPath(); ctx.roundRect(sbX, gridTop, 6, sbH, 3); ctx.fill();
                    // 썸
                    ctx.fillStyle = 'rgba(255,136,0,0.5)';
                    ctx.beginPath(); ctx.roundRect(sbX, thumbY, 6, thumbH, 3); ctx.fill();
                }

                // ── 하단 고정 영역 ──
                // 선택된 캐릭터 능력 표시
                const selectedAbility = CHARACTER_ABILITIES[gameState.selectedCharacter];
                if (selectedAbility && selectedAbility.type !== 'none') {
                    ctx.fillStyle = 'rgba(255,102,0,0.1)';
                    ctx.beginPath();
                    ctx.roundRect(W/2 - 200, H - 120, 400, 35, 8);
                    ctx.fill();
                    ctx.strokeStyle = '#FF8800';
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    ctx.fillStyle = '#FF6600';
                    ctx.font = 'bold 15px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`⚡ ${selectedAbility.name}: ${selectedAbility.desc}`, W/2, H - 102);
                }

                // 메시지 표시
                if (this.messageTimer > 0 && this.message) {
                    ctx.fillStyle = 'rgba(0,0,0,0.85)';
                    ctx.beginPath();
                    ctx.roundRect(W/2 - 180, H - 155, 360, 36, 10);
                    ctx.fill();
                    ctx.fillStyle = '#FFDD00';
                    ctx.font = 'bold 17px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(this.message, W/2, H - 137);
                }

                // 뒤로가기 버튼
                ctx.fillStyle = '#666';
                ctx.beginPath();
                ctx.roundRect(W/2 - 80, H - 75, 160, 45, 10);
                ctx.fill();
                ctx.fillStyle = '#FFF';
                ctx.font = 'bold 22px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('← 돌아가기', W/2, H - 52);
                ctx.textAlign = 'left';

                ctx.restore();
            }

            handleInput(inputState) {
                if (!inputState.jumping) return;
                // 드래그 중이면 탭으로 처리 안 함
                if (this.dragMoved) { this.dragMoved = false; return; }
                const mx = inputManager.lastTouchX;
                const my = inputManager.lastTouchY;
                if (mx === undefined || my === undefined) return;
                const W = GAME_CONFIG.width;
                const H = GAME_CONFIG.height;

                // 돌아가기 버튼
                if (mx >= W/2 - 80 && mx <= W/2 + 80 &&
                    my >= H - 75 && my <= H - 30) {
                    gameState.currentScene = 'title';
                    localStorage.setItem('selectedCharacter', gameState.selectedCharacter);
                    return;
                }

                // 그리드 영역 밖 클릭 무시
                if (my < this.gridTop || my > this.gridBottom) return;

                // 캐릭터 카드 클릭 판정
                const keys = Object.keys(spriteConfig.sprites);
                const { cols, cellW, cellH, gridTop } = this;
                const gridW = cols * cellW;

                keys.forEach((key, i) => {
                    const char = spriteConfig.sprites[key];
                    const row = Math.floor(i / cols);
                    const col = i % cols;
                    const rowItems = Math.min(cols, keys.length - row * cols);
                    const rowW = rowItems * cellW;
                    const rowStartX = W/2 - rowW / 2;
                    const cx = rowStartX + col * cellW + cellW / 2;
                    const cardY = gridTop + row * (cellH + 10) - this.scrollY;
                    const isUnlocked = gameState.unlockedCharacters.includes(key);

                    const cardLeft = cx - cellW/2 + 8;
                    const cardRight = cx + cellW/2 - 8;
                    const cardBottom = cardY + cellH - 10;

                    if (mx >= cardLeft && mx <= cardRight && my >= cardY && my <= cardBottom) {
                        if (isUnlocked) {
                            gameState.selectedCharacter = key;
                            localStorage.setItem('selectedCharacter', key);
                            this.message = `${char.name} 선택 완료!`;
                            this.messageTimer = 1.5;
                        } else if (gameState.totalCoins >= char.cost) {
                            gameState.totalCoins -= char.cost;
                            gameState.unlockedCharacters.push(key);
                            gameState.selectedCharacter = key;
                            localStorage.setItem('totalCoins', gameState.totalCoins);
                            localStorage.setItem('unlockedCharacters', JSON.stringify(gameState.unlockedCharacters));
                            localStorage.setItem('selectedCharacter', key);
                            this.message = `${char.name} 구매 완료! 🎉`;
                            this.messageTimer = 2;
                            audioManager.playPowerUpSound();
                        } else {
                            this.message = `동전이 부족해요! (${char.cost - gameState.totalCoins}개 더 필요)`;
                            this.messageTimer = 2;
                        }
                    }
                });
            }
        }

        class GameScene {
            constructor() {
                this.background = new Background();
                this.player = new Player(gameState.selectedCharacter);
                this.obstacles = [];
                this.coins = [];
                this.powerUps = [];
                this.particles = new ParticleSystem();
                this.obstacleTimer = 3.0; // 첫 장애물까지 3초 대기
                this.coinTimer = 1.5;
                this.powerUpTimer = 8.0;
                this.seasonBanner = null; // { text, timer }
                this.lastSeason = 'spring';
                this.prevSeasonForWinter = 'spring'; // 겨울→봄 전환 감지용
                // BGM 시작 (AudioContext resume 보장)
                if (typeof seasonalBGM !== 'undefined') {
                    const ac = audioManager.audioContext;
                    if (ac && ac.state === 'suspended') {
                        ac.resume().then(() => seasonalBGM.start('spring'));
                    } else {
                        seasonalBGM.start('spring');
                    }
                }
                // 네모미 능력: 쉴드로 시작
                if (CHARACTER_ABILITIES[gameState.selectedCharacter]?.type === 'startShield') {
                    this.player.activePowerUp = 'shield';
                    this.player.powerUpTimer = 999; // 한번 맞을 때까지 유지
                }
                // 가스미 방귀 이펙트 타이머
                this.fartEffectTimer = 0;
                this.fartEffectX = 0;
                this.fartEffectY = 0;
                // 비행미 비행 상태
                this.flyingActive = false;
                // 파도미 파도 이펙트 타이머
                this.waveEffectTimer = 0;
                // 구간별 모드 배너 플래그
                this.furyModeTriggered = false;
                this.restModeTriggered = false;
                this.fury2ModeTriggered = false;
            }

            update(inputState, deltaTime) {
                if (gameState.isPaused) return;

                this.background.update(deltaTime, gameState.score);

                // 계절 전환 감지 → 배경의 실제 계절 상태를 기준으로 배너/BGM 전환
                const bgSeason = this.background.currentSeason;
                const bgReady = this.background.transitionT >= 0.5;
                if (bgReady && bgSeason !== this.lastSeason) {
                    // 시각 배너는 이제 BGM 오버레이로 대체 (seasonalBGM.drawOverlay)
                    this.lastSeason = bgSeason;

                    // BGM 계절 전환 (크로스페이드 + 오버레이)
                    if (typeof seasonalBGM !== 'undefined') {
                        seasonalBGM.changeSeason(bgSeason);
                    }
                }

                // 겨울 → 봄 전환 감지: 4계절(봄→여름→가을→겨울) 완전 순환
                const rawSeason = getCurrentSeason(gameState.score || 0);
                if (this.prevSeasonForWinter === 'winter' && rawSeason === 'spring') {
                    gameState.winterCount++;
                    // ★ 난이도 UP! 배너 표시
                    const diffNames = ['보통', '어려움', '매우어려움', '극한', '지옥', '???'];
                    const dIdx = Math.min(gameState.winterCount, diffNames.length - 1);
                    this.diffUpBanner = { text: `⚠️ 난이도 UP! → ${diffNames[dIdx]}`, timer: 3.0 };
                    // speedLevel은 매 프레임 자동 계산됨 (winterCount / 5)
                }
                this.prevSeasonForWinter = rawSeason;
                // 난이도 UP 배너 타이머 감소
                if (this.diffUpBanner && this.diffUpBanner.timer > 0) {
                    this.diffUpBanner.timer -= deltaTime;
                }

                // 캐릭터 능력 업데이트
                // 하트미 능력: 봄 시즌에 1초마다 코인+1
                if (CHARACTER_ABILITIES[gameState.selectedCharacter]?.type === 'springCoin') {
                    if (rawSeason === 'spring') {
                        gameState.abilityState.springCoinTimer = (gameState.abilityState.springCoinTimer || 0) + deltaTime;
                        if (gameState.abilityState.springCoinTimer >= 1.0) {
                            gameState.abilityState.springCoinTimer -= 1.0;
                            gameState.coins += 1;
                            gameState.coinsEarned += 1;
                        }
                    }
                }

                // 김여름 능력: 여름에 1초마다 코인 자동획득
                if (CHARACTER_ABILITIES[gameState.selectedCharacter]?.type === 'summerCoin') {
                    if (rawSeason === 'summer') {
                        gameState.abilityState.seasonCoinTimer = (gameState.abilityState.seasonCoinTimer || 0) + deltaTime;
                        if (gameState.abilityState.seasonCoinTimer >= 1.0) {
                            gameState.abilityState.seasonCoinTimer -= 1.0;
                            gameState.coins += 1;
                            gameState.coinsEarned += 1;
                        }
                    }
                }

                // 동그라미하준 능력: 가을/겨울에 1초마다 코인 자동획득
                if (CHARACTER_ABILITIES[gameState.selectedCharacter]?.type === 'autumnWinterCoin') {
                    if (rawSeason === 'autumn' || rawSeason === 'winter') {
                        gameState.abilityState.seasonCoinTimer = (gameState.abilityState.seasonCoinTimer || 0) + deltaTime;
                        if (gameState.abilityState.seasonCoinTimer >= 1.0) {
                            gameState.abilityState.seasonCoinTimer -= 1.0;
                            gameState.coins += 1;
                            gameState.coinsEarned += 1;
                        }
                    }
                }

                // BGM 업데이트
                if (typeof seasonalBGM !== 'undefined') {
                    seasonalBGM.update(deltaTime);
                }

                this.player.update(inputState, deltaTime);
                this.particles.update(deltaTime);

                // 가스미 방귀 부스터: 키보드 F키 활성화 (쿨다운: 이펙트 재생 중 재발동 방지)
                if (inputState.fart && CHARACTER_ABILITIES[gameState.selectedCharacter]?.type === 'fartBoost' &&
                    (gameState.abilityState?.fartCharges || 0) > 0 && this.fartEffectTimer <= 0) {
                    this.activateFartBoost();
                }
                // 파도미 파도: 키보드 F키 활성화 (쿨다운: 이펙트 재생 중 재발동 방지)
                if (inputState.fart && CHARACTER_ABILITIES[gameState.selectedCharacter]?.type === 'waveBlast' &&
                    (gameState.abilityState?.waveCharges || 0) > 0 && this.waveEffectTimer <= 0) {
                    this.activateWaveBlast();
                }
                // 비행미 비행: 키보드 F키 활성화
                if (inputState.fart && CHARACTER_ABILITIES[gameState.selectedCharacter]?.type === 'flight' &&
                    (gameState.abilityState?.flyingTimer || 0) <= 0 &&
                    (gameState.abilityState?.flightCharges || 0) > 0) {
                    this.activateFlight();
                }
                // 비행 중 물리: 중력 무시 + 위아래 이동
                if ((gameState.abilityState?.flyingTimer || 0) > 0) {
                    gameState.abilityState.flyingTimer -= deltaTime;
                    this.player.velocityY = 0;
                    this.player.isJumping = false;
                    // 위로 떠오르기 (점프키로 위, 엎드리기로 아래)
                    if (inputState.jumping) {
                        this.player.y -= 4;
                    } else if (inputState.ducking) {
                        this.player.y += 4;
                    } else {
                        // 살짝 떠있기
                        this.player.y += Math.sin(Date.now() * 0.003) * 0.5;
                    }
                    // 화면 밖 방지
                    if (this.player.y < 20) this.player.y = 20;
                    if (this.player.y + this.player.height > GAME_CONFIG.groundY) {
                        this.player.y = GAME_CONFIG.groundY - this.player.height;
                    }
                    // 비행 끝나면 착지
                    if (gameState.abilityState.flyingTimer <= 0) {
                        gameState.abilityState.flyingTimer = 0;
                        this.player.isJumping = true;
                    }
                }
                // 방귀 이펙트 타이머 감소
                if (this.fartEffectTimer > 0) this.fartEffectTimer -= deltaTime;
                // 파도 이펙트 타이머 감소
                if (this.waveEffectTimer > 0) this.waveEffectTimer -= deltaTime;
                // 냠냠미 먹기 이펙트 타이머 감소
                if (gameState.abilityState?.eatEffectTimer > 0) gameState.abilityState.eatEffectTimer -= deltaTime;

                // ═══════════════════════════════════════════════════════════
                // 속도 시스템 (v3.0 전면 재설계)
                // ─────────────────────────────────────────────────────────
                // ★ 핵심 규칙:
                //   - 계절 변화는 속도에 영향 없음 (시각효과만)
                //   - 봄→여름→가을→겨울 = 1세트 (400점)
                //   - 5세트(겨울 5회 통과) = 레벨 1 증가
                //   - 레벨 0~100, 레벨에 따른 지수적 속도 증가
                //   - 낮은 레벨: 속도 거의 안 올라감
                //   - 높은 레벨: 속도 급격히 올라감
                //
                // 공식: speed = 4.5 + 7.5 * (level/100)^2.5
                //   LV.0  → 4.5 (기본)
                //   LV.10 → 4.5 + 7.5 * 0.003 = 4.52
                //   LV.20 → 4.5 + 7.5 * 0.018 = 4.63
                //   LV.50 → 4.5 + 7.5 * 0.177 = 5.83
                //   LV.80 → 4.5 + 7.5 * 0.572 = 8.79
                //   LV.90 → 4.5 + 7.5 * 0.769 = 10.27
                //   LV.100→ 4.5 + 7.5 * 1.000 = 12.0 (최대)
                // ═══════════════════════════════════════════════════════════
                gameState.speedLevel = Math.min(100, Math.floor(gameState.winterCount / 5));
                const t = gameState.speedLevel / 100; // 0~1
                // 기본 속도 (레벨 기반)
                const baseSpeed = GAME_CONFIG.initialSpeed + (GAME_CONFIG.maxSpeed - GAME_CONFIG.initialSpeed) * Math.pow(t, 2.5);
                // 순환 보너스
                const cycleSpeedBonus = (gameState.winterCount || 0) * 0.8;
                let finalSpeed = baseSpeed + cycleSpeedBonus;

                // ★★★ 구간별 난이도 시스템 ★★★
                const currentScore = gameState.score || 0;
                if (currentScore >= 1500) {
                    // 1500+ 진짜 극악: 속도 대폭 상승
                    const overScore = currentScore - 1500;
                    finalSpeed += 2.5 + overScore * 0.012;
                } else if (currentScore >= 1000) {
                    // 1000~1499 휴식 구간: 속도 보너스 없음 (일반 난이도로 복귀)
                    finalSpeed += 0;
                } else if (currentScore >= 500) {
                    // 500~999 극악: 속도 상승
                    const overScore = currentScore - 500;
                    finalSpeed += 0.8 + overScore * 0.005;
                }

                gameState.gameSpeed = Math.min(16, finalSpeed); // 최대 16
                // 천사 능력: 속도 부스트 (15% 빠르게)
                const angelAbility = CHARACTER_ABILITIES[gameState.selectedCharacter];
                if (angelAbility?.type === 'angelBlessing' && angelAbility.speedBoost) {
                    gameState.gameSpeed = Math.min(22, gameState.gameSpeed * angelAbility.speedBoost);
                }

                // LV.100 도달 → 엔딩 씬으로 전환!
                if (gameState.speedLevel >= 100 && !gameState.endingTriggered) {
                    gameState.endingTriggered = true;
                    gameState.isRunning = false;
                    gameState.currentScene = 'ending';
                    if (typeof seasonalBGM !== 'undefined') seasonalBGM.stop();
                }

                // Spawn obstacles
                this.obstacleTimer -= deltaTime;
                if (this.obstacleTimer <= 0) {
                    this.spawnObstacle();
                    const wc = gameState.winterCount || 0;
                    const sc = gameState.score || 0;

                    if (sc >= 1500) {
                        // ★★★ 1500+ 진짜 극악: 빠른 스폰 ★★★
                        const fury = Math.min(3, (sc - 1500) / 200);
                        const spMin = Math.max(0.2, 0.4 - fury * 0.07);
                        const spRange = Math.max(0.1, 0.25 - fury * 0.05);
                        this.obstacleTimer = spMin + Math.random() * spRange;
                        if (Math.random() < 0.5) {
                            setTimeout(() => { if (gameState.isRunning) this.spawnObstacle(); }, 150);
                        }
                        if (Math.random() < 0.2) {
                            setTimeout(() => { if (gameState.isRunning) this.spawnObstacle(); }, 280);
                        }
                    } else if (sc >= 1000) {
                        // ★★★ 1000~1499 휴식 구간: 일반 난이도 ★★★
                        const baseMin = Math.max(0.5, 1.2 - wc * 0.3);
                        const baseRange = Math.max(0.3, 0.8 - wc * 0.15);
                        this.obstacleTimer = baseMin + Math.random() * baseRange;
                        if (wc >= 2 && Math.random() < 0.15) {
                            setTimeout(() => { if (gameState.isRunning) this.spawnObstacle(); }, 200);
                        }
                    } else if (sc >= 500) {
                        // ★★★ 500~999 극악 ★★★
                        const fury = Math.min(3, (sc - 500) / 400);
                        const spMin = Math.max(0.4, 0.7 - fury * 0.1);
                        const spRange = Math.max(0.2, 0.4 - fury * 0.07);
                        this.obstacleTimer = spMin + Math.random() * spRange;
                        if (Math.random() < 0.2) {
                            setTimeout(() => { if (gameState.isRunning) this.spawnObstacle(); }, 200);
                        }
                    } else {
                        // 일반 모드: 순환 기반 난이도
                        const baseMin = Math.max(0.4, 2.0 - wc * 0.5 - sc * 0.002);
                        const baseRange = Math.max(0.3, 1.5 - wc * 0.35 - sc * 0.001);
                        this.obstacleTimer = baseMin + Math.random() * baseRange;
                        // 동시 스폰
                        if (wc >= 1 && Math.random() < Math.min(0.5, wc * 0.15)) {
                            setTimeout(() => { if (gameState.isRunning) this.spawnObstacle(); }, 150);
                        }
                    }
                }

                // Spawn coins (가끔 2~3개 묶음으로 등장)
                this.coinTimer -= deltaTime;
                if (this.coinTimer <= 0) {
                    if (Math.random() < 0.4) {
                        const baseY = GAME_CONFIG.groundY - 110 - Math.random() * 80;
                        const coinCount = Math.random() < 0.3 ? (Math.random() < 0.5 ? 3 : 2) : 1;
                        for (let ci = 0; ci < coinCount; ci++) {
                            const c = new Coin();
                            c.x = GAME_CONFIG.width + ci * 45; // 간격 45px
                            c.y = baseY;
                            this.coins.push(c);
                        }
                    }
                    this.coinTimer = 1.2 + Math.random() * 1.0;
                }

                // Spawn power-ups
                this.powerUpTimer -= deltaTime;
                if (this.powerUpTimer <= 0) {
                    if (Math.random() < 0.3) {
                        const types = ['shield', 'magnet', '2x', 'slow'];
                        this.powerUps.push(new PowerUp(types[Math.floor(Math.random() * types.length)]));
                    }
                    this.powerUpTimer = 6.0 + Math.random() * 4.0;
                }

                // Update obstacles (다크동에게 플레이어 Y 전달)
                const playerY = this.player.y;
                this.obstacles = this.obstacles.filter(o => {
                    o.update(gameState.gameSpeed, deltaTime, playerY);
                    return o.x + o.width > 0;
                });

                // Update coins
                this.coins = this.coins.filter(c => {
                    c.update(gameState.gameSpeed, deltaTime);
                    return c.x + c.radius > 0;
                });

                // Update power-ups
                this.powerUps = this.powerUps.filter(p => {
                    p.update(gameState.gameSpeed, deltaTime);
                    return p.x + p.radius > 0;
                });

                // Collision detection
                this.checkCollisions(deltaTime);

                // 구간별 모드 전환 배너
                const modeScore = gameState.score || 0;
                if (!this.furyModeTriggered && modeScore >= 500) {
                    this.furyModeTriggered = true;
                    this.diffUpBanner = { text: '💀 극악 모드 돌입!! 💀', timer: 3.5 };
                }
                if (!this.restModeTriggered && modeScore >= 1000) {
                    this.restModeTriggered = true;
                    this.diffUpBanner = { text: '😌 휴식 구간! 잠시 쉬어가세요~', timer: 3.5 };
                }
                if (!this.fury2ModeTriggered && modeScore >= 1500) {
                    this.fury2ModeTriggered = true;
                    this.diffUpBanner = { text: '💀💀 진짜 극악 모드!! 💀💀', timer: 3.5 };
                }

                // Score increment (초당 ~10점 + 순환마다 25% 증가 → 계절 전환도 빨라짐)
                const scoreBoost = 1 + (gameState.winterCount || 0) * 0.25;
                gameState.score += deltaTime * 10 * scoreBoost;
            }

            spawnObstacle() {
                const score = gameState.score;
                const season = getCurrentSeason(score);
                const level = gameState.speedLevel || 0;
                const wc = gameState.winterCount || 0;
                let pool;

                // ★ 난이도 보정: 순환마다 큰 점수 보정 → 어려운 장애물이 확 빨리 등장
                const difficultyBonus = wc * 50; // 순환마다 50점 보정 (1순환이면 바로 중반급 장애물)
                const effectiveScore = score + difficultyBonus;

                if (effectiveScore < 30) {
                    // 초반: 작은 장애물만
                    pool = ['cactus-small', 'rock-small', 'mushroom'];
                } else if (effectiveScore < 70) {
                    // 중반 초기: 기본 + 계절별
                    const base = ['cactus-small', 'cactus-medium', 'rock-small', 'stump', 'bird-low'];
                    pool = this._addSeasonObstacles(base, season);
                } else if (effectiveScore < 150) {
                    // 중반: 다양한 장애물
                    const base = ['cactus-small', 'cactus-medium', 'cactus-large', 'rock-small', 'rock-large',
                                  'bird-low', 'bird-mid', 'stump', 'bee', 'puddle'];
                    pool = this._addSeasonObstacles(base, season);
                } else {
                    // 후반: 모든 장애물
                    const base = ['cactus-small', 'cactus-medium', 'cactus-large', 'rock-small', 'rock-large',
                                  'bird-low', 'bird-mid', 'bird-high', 'stump', 'bee', 'puddle', 'mushroom'];
                    pool = this._addSeasonObstacles(base, season);
                }

                // 레벨에 따른 악당 캐릭터 추가
                pool = this._addVillains(pool, level);

                const type = pool[Math.floor(Math.random() * pool.length)];
                this.obstacles.push(new Obstacle(type, score));
            }

            _addVillains(pool, level) {
                const result = [...pool];
                const wc = gameState.winterCount || 0;
                const sc = gameState.score || 0;
                // ★★★ 500점 극악 모드: 악당 가중치 폭증 ★★★
                let villainWeight;
                if (sc >= 1500) {
                    villainWeight = Math.min(10, 5 + Math.floor((sc - 1500) / 100)); // 1500=5, 1600=6 ...
                } else if (sc >= 1000) {
                    villainWeight = Math.min(4, 1 + wc); // 휴식 구간: 일반 수준
                } else if (sc >= 500) {
                    villainWeight = Math.min(6, 2 + Math.floor((sc - 500) / 200)); // 500=2, 700=3
                } else {
                    villainWeight = Math.min(8, 1 + wc);
                }
                // 500점 이상 또는 1500점 이상이면 모든 악당 등장
                const fury = sc >= 500;
                if (level >= 0 || fury) for (let v = 0; v < 2 * villainWeight; v++) result.push('villain-slime');
                if (level >= 3 || wc >= 2 || fury) for (let v = 0; v < 2 * villainWeight; v++) result.push('villain-cat');
                if (level >= 8 || wc >= 3 || fury) for (let v = 0; v < 2 * villainWeight; v++) result.push('villain-flame');
                if (level >= 15 || wc >= 4 || fury) for (let v = 0; v < villainWeight; v++) result.push('villain-spike');
                if (level >= 30 || wc >= 5 || fury) for (let v = 0; v < 2 * villainWeight; v++) result.push('villain-ghost');
                if (level >= 50 || wc >= 6 || fury) for (let v = 0; v < villainWeight; v++) result.push('villain-dark');
                return result;
            }

            _addSeasonObstacles(base, season) {
                const pool = [...base];
                if (season === 'winter') {
                    pool.push('snowman', 'snowman'); // 겨울: 눈사람 가중치
                } else if (season === 'spring') {
                    pool.push('mushroom', 'mushroom'); // 봄: 버섯 가중치
                } else if (season === 'summer') {
                    pool.push('bee', 'bee', 'puddle'); // 여름: 벌/웅덩이 가중치
                } else if (season === 'autumn') {
                    pool.push('stump', 'stump', 'rock-large'); // 가을: 그루터기/바위 가중치
                }
                return pool;
            }

            checkCollisions(deltaTime) {
                const playerHitbox = this.player.getHitbox();

                // 무적 타이머 감소
                if (gameState.invulnTimer > 0) gameState.invulnTimer -= deltaTime;

                // Check obstacle collisions
                this.obstacles.forEach(obstacle => {
                    if (this.checkAABBCollision(playerHitbox, obstacle.getHitbox())) {
                        if (this.player.activePowerUp === 'shield') {
                            // 쉴드로 파괴
                            const isVillainShield = obstacle.type.startsWith('villain-');
                            if (isVillainShield) {
                                // 악당을 쉴드로 처치하면 보너스 코인!
                                const bonusCoins = obstacle.type === 'villain-dark' ? 10 : 5;
                                gameState.coins += bonusCoins;
                                gameState.coinsEarned += bonusCoins;
                                this.particles.createExplosion(obstacle.x, obstacle.y, '#FFD700', 20);
                                this.particles.createExplosion(obstacle.x, obstacle.y, '#9B59B6', 12);
                                audioManager.playCoinSound();
                            } else {
                                this.particles.createExplosion(obstacle.x, obstacle.y, '#FF00FF', 12);
                            }
                            this.obstacles = this.obstacles.filter(o => o !== obstacle);
                            this.player.activePowerUp = null;
                        } else if (gameState.invulnTimer <= 0) {
                            // 삼각미 능력: 피격 무시 (3회)
