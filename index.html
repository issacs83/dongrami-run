<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <title>동그라미 런 - Dongrami Run</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Arial', sans-serif;
            position: fixed;
        }

        canvas {
            display: block;
            margin: 0 auto;
            background: #87ceeb;
            touch-action: none;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #gameContainer {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        body {
            touch-action: none;
            -webkit-user-select: none;
        }

        /* 모바일 세로 모드 → 자동 가로 회전 (CSS transform) */

        @media screen and (max-width: 768px) and (orientation: portrait) {
            #gameContainer {
                position: fixed;
                top: 0; left: 0;
                width: 100vh !important;
                height: 100vw !important;
                transform: rotate(90deg);
                transform-origin: top left;
                margin-left: 100vw;
                display: flex !important;
                justify-content: center;
                align-items: center;
                overflow: hidden;
            }
            #gameCanvas {
                width: 100vh !important;
                height: 100vw !important;
            }
        }
        @media screen and (max-width: 768px) and (orientation: landscape) {
            #gameContainer { display: flex !important; }

<body>
    <!-- 모바일 세로 모드 → 가로 회전 안내 -->
    <div id="rotateOverlay">
        <div class="icon">📱</div>
        <div class="text">화면을 가로로 돌려주세요!</div>
        <div class="sub">가로 모드에서 플레이할 수 있어요</div>
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        // roundRect 폴리필 (구형 브라우저 호환)
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (typeof r === 'number') r = [r, r, r, r];
                if (Array.isArray(r) && r.length === 1) r = [r[0], r[0], r[0], r[0]];
                const [tl, tr, br, bl] = r;
                this.moveTo(x + tl, y);
                this.lineTo(x + w - tr, y);
                this.arcTo(x + w, y, x + w, y + tr, tr);
                this.lineTo(x + w, y + h - br);
                this.arcTo(x + w, y + h, x + w - br, y + h, br);
                this.lineTo(x + bl, y + h);
                this.arcTo(x, y + h, x, y + h - bl, bl);
                this.lineTo(x, y + tl);
                this.arcTo(x, y, x + tl, y, tl);
                this.closePath();
                return this;
            };
        }

        /*
        ═══════════════════════════════════════════════════════════════════════════════
        동그라미 런 (Dongrami Run) - Enhanced Runner Game

        캐릭터 스프라이트 교체 가이드:
        ─────────────────────────────────────────────────────────────────────────────
        각 캐릭터는 canvas에 그려집니다. PNG 스프라이트로 교체하려면:

        spriteConfig.sprites['캐릭터명'].spriteSheet = 'path/to/sprite.png'
        frameWidth: 64, frameHeight: 64 (새로운 크기)
        frameCount: 4 (달리기 프레임 수)

        ═══════════════════════════════════════════════════════════════════════════════
        */

        // ============================================================================
        // GAME CONFIGURATION
        // ============================================================================
        const GAME_CONFIG = {
            width: 1024,
            height: 576,
            groundY: 576 * 0.82,  // 82% down the screen
            playerStartX: 80,
            playerSize: 64,
            initialSpeed: 4.5,
            maxSpeed: 12,
            speedIncrease: 0.0001,
            gravity: 0.42,
            jumpPower: -14.5,
            obstacleMinGap: 450,
        };

        // ============================================================================
        // SPRITE CONFIGURATION - All drawn with canvas
        // ============================================================================
        const spriteConfig = {
            sprites: {
                동그라미: {
                    name: '동그라미',
                    colors: { main: '#FF4444', secondary: '#FFFFFF' },
                    size: 64,
                    drawSprite: function(ctx, x, y, frameIndex, isJumping, isDucking) {
                        ctx.save();
                        ctx.translate(x + 32, y + 32);

                        // Body - big red circle
                        ctx.fillStyle = '#FF4444';
                        ctx.beginPath();
                        ctx.arc(0, 0, 28, 0, Math.PI * 2);
                        ctx.fill();

                        // Dark outline
                        ctx.strokeStyle = '#CC0000';
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        // White eyes
                        ctx.fillStyle = '#FFFFFF';
                        ctx.beginPath();
                        ctx.arc(-10, -8, 6, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(10, -8, 6, 0, Math.PI * 2);
                        ctx.fill();

                        // Black pupils - 오른쪽(앞)을 바라봄
                        ctx.fillStyle = '#000000';
                        let pupilX = 2;
                        ctx.beginPath();
                        ctx.arc(-10 + pupilX, -8, 3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(10 + pupilX, -8, 3, 0, Math.PI * 2);
                        ctx.fill();

                        // Rosy cheeks
                        ctx.fillStyle = 'rgba(255, 180, 180, 0.6)';
                        ctx.beginPath();
                        ctx.arc(-18, 5, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(18, 5, 5, 0, Math.PI * 2);
                        ctx.fill();

                        // Happy smile
                        ctx.strokeStyle = '#000000';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(0, 8, 8, 0, Math.PI, false);
                        ctx.stroke();

                        // Legs
                        if (!isDucking) {
                            let legOffset = Math.sin(frameIndex * 0.3) * 3;
                            ctx.fillStyle = '#FF6666';
                            // Left leg
                            ctx.fillRect(-8, 24 + legOffset, 4, 10);
                            // Right leg
                            ctx.fillRect(4, 24 - legOffset, 4, 10);
                        }

                        ctx.restore();
                    },
                    cost: 0,
                    hitbox: { offsetX: 10, offsetY: 10, width: 44, height: 44 }
                },

                네모미: {
                    name: '네모미',
                    colors: { main: '#4AACBB', secondary: '#FFFFFF' },
                    size: 64,
                    drawSprite: function(ctx, x, y, frameIndex, isJumping, isDucking) {
                        ctx.save();
                        ctx.translate(x + 32, y + 32);

                        // Body - teal square with rounded corners
                        ctx.fillStyle = '#4AACBB';
                        ctx.beginPath();
                        ctx.roundRect(-24, -24, 48, 48, 6);
                        ctx.fill();

                        // Dark outline
                        ctx.strokeStyle = '#1A7A8A';
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        // Eyes
                        ctx.fillStyle = '#FFFFFF';
                        ctx.beginPath();
                        ctx.arc(-10, -8, 6, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(10, -8, 6, 0, Math.PI * 2);
                        ctx.fill();

                        // Pupils
                        ctx.fillStyle = '#000000';
                        ctx.beginPath();
                        ctx.arc(-10, -8, 3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(10, -8, 3, 0, Math.PI * 2);
                        ctx.fill();

                        // Mouth
                        ctx.strokeStyle = '#000000';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.rect(-6, 6, 12, 6);
                        ctx.stroke();

                        // Small feet
                        if (!isDucking) {
                            ctx.fillStyle = '#1A7A8A';
                            ctx.fillRect(-10, 22, 5, 8);
                            ctx.fillRect(5, 22, 5, 8);
                        }

                        ctx.restore();
                    },
                    cost: 300,
                    hitbox: { offsetX: 10, offsetY: 10, width: 44, height: 44 }
                },

                별미: {
                    name: '별미',
                    colors: { main: '#FFD700', secondary: '#FFA500' },
                    size: 64,
                    drawSprite: function(ctx, x, y, frameIndex, isJumping, isDucking) {
                        ctx.save();
                        ctx.translate(x + 32, y + 32);
                        ctx.rotate(Math.sin(frameIndex * 0.1) * 0.1);

                        // Draw star
                        ctx.fillStyle = '#FFD700';
                        ctx.beginPath();
                        for (let i = 0; i < 5; i++) {
                            let angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
                            let px = Math.cos(angle) * 24;
                            let py = Math.sin(angle) * 24;
                            if (i === 0) ctx.moveTo(px, py);
                            else ctx.lineTo(px, py);

                            angle = ((i + 0.5) * 4 * Math.PI) / 5 - Math.PI / 2;
                            px = Math.cos(angle) * 12;
                            py = Math.sin(angle) * 12;
                            ctx.lineTo(px, py);
                        }
                        ctx.closePath();
                        ctx.fill();

                        // Dark outline
                        ctx.strokeStyle = '#FFA500';
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        // Eyes
                        ctx.fillStyle = '#000000';
                        ctx.beginPath();
                        ctx.arc(-8, -5, 4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(8, -5, 4, 0, Math.PI * 2);
                        ctx.fill();

                        // Smile
                        ctx.strokeStyle = '#000000';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(0, 6, 6, 0, Math.PI, false);
                        ctx.stroke();

                        ctx.restore();
                    },
                    cost: 300,
                    hitbox: { offsetX: 10, offsetY: 10, width: 44, height: 44 }
                },

                삼각미: {
                    name: '삼각미',
                    colors: { main: '#22BB22', secondary: '#11AA11' },
                    size: 64,
                    drawSprite: function(ctx, x, y, frameIndex, isJumping, isDucking) {
                        ctx.save();
                        ctx.translate(x + 32, y + 32);

                        // Draw triangle
                        ctx.fillStyle = '#22BB22';
                        ctx.beginPath();
                        ctx.moveTo(0, -28);
                        ctx.lineTo(26, 20);
                        ctx.lineTo(-26, 20);
                        ctx.closePath();
                        ctx.fill();

                        // Dark outline
                        ctx.strokeStyle = '#11AA11';
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        // Eyes
                        ctx.fillStyle = '#FFFFFF';
                        ctx.beginPath();
                        ctx.arc(-8, -5, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(8, -5, 5, 0, Math.PI * 2);
                        ctx.fill();

                        // Pupils
                        ctx.fillStyle = '#000000';
                        ctx.beginPath();
                        ctx.arc(-8, -5, 3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(8, -5, 3, 0, Math.PI * 2);
                        ctx.fill();

                        // Mouth
                        ctx.strokeStyle = '#000000';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(0, 8, 6, 0, Math.PI, false);
                        ctx.stroke();

                        ctx.restore();
                    },
                    cost: 300,
                    hitbox: { offsetX: 10, offsetY: 10, width: 44, height: 44 }
                },

                하트미: {
                    name: '하트미',
                    colors: { main: '#FF69B4', secondary: '#FF1493' },
                    size: 64,
                    drawSprite: function(ctx, x, y, frameIndex, isJumping, isDucking) {
                        ctx.save();
                        ctx.translate(x + 32, y + 32);
                        let pulse = 1 + Math.sin(frameIndex * 0.2) * 0.15;
                        ctx.scale(pulse, pulse);

                        // Draw heart shape
                        ctx.fillStyle = '#FF69B4';
                        ctx.beginPath();
                        ctx.moveTo(0, -6);
                        ctx.bezierCurveTo(-24, -30, -28, -22, -28, -8);
                        ctx.bezierCurveTo(-28, 4, -14, 18, 0, 28);
                        ctx.bezierCurveTo(14, 18, 28, 4, 28, -8);
                        ctx.bezierCurveTo(28, -22, 24, -30, 0, -6);
                        ctx.closePath();
                        ctx.fill();

                        // Dark outline
                        ctx.strokeStyle = '#FF1493';
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        // Eyes
                        ctx.fillStyle = '#000000';
                        ctx.beginPath();
                        ctx.arc(-8, -8, 4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(8, -8, 4, 0, Math.PI * 2);
                        ctx.fill();

                        // Smile
                        ctx.strokeStyle = '#000000';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(0, 4, 6, 0, Math.PI, false);
                        ctx.stroke();

                        ctx.restore();
                    },
                    cost: 500,
                    hitbox: { offsetX: 10, offsetY: 10, width: 44, height: 44 }
                }
            }
        };

        // 추가 캐릭터 삽입 + 순서 재배치
        // 최종 순서: 동그라미, 네모미, 별미, 삼각미, 김여름, 하트미, 동그라미하준
        (function setupExtraCharacters() {
            const kimYeoreum = {
                name: '김여름', colors: { main: '#FFF5EE', secondary: '#FFB6C1' }, size: 64,
                drawSprite: function(ctx, x, y, frameIndex, isJumping, isDucking) {
                    ctx.save(); ctx.translate(x + 32, y + 32);
                    const squish = isDucking ? 0.7 : 1.0;
                    const squishX = isDucking ? 1.2 : 1.0;
                    const wobble = Math.sin(frameIndex * 0.12) * 1.5;
                    ctx.scale(squishX, squish);

                    // 마시멜로 본체 (부드러운 흰색 원통형)
                    const mGrad = ctx.createRadialGradient(-4, -6, 3, 0, 0, 24);
                    mGrad.addColorStop(0, '#FFFFFF');
                    mGrad.addColorStop(0.5, '#FFF5EE');
                    mGrad.addColorStop(0.85, '#FFE4E1');
                    mGrad.addColorStop(1, '#FFD1CC');
                    ctx.fillStyle = mGrad;
                    // 둥글넓적한 마시멜로 형태 (rounded rect)
                    ctx.beginPath();
                    ctx.roundRect(-22, -20 + wobble, 44, 44, 18);
                    ctx.fill();
                    ctx.strokeStyle = '#F0C0B8'; ctx.lineWidth = 1.5; ctx.stroke();

                    // 마시멜로 윗면 하이라이트 (반짝)
                    ctx.fillStyle = 'rgba(255,255,255,0.7)';
                    ctx.beginPath();
                    ctx.ellipse(0, -16 + wobble, 16, 5, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // 볼 (핑크 홍조)
                    ctx.fillStyle = 'rgba(255,150,170,0.5)';
                    ctx.beginPath(); ctx.ellipse(-14, 6 + wobble, 6, 4, -0.2, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.ellipse(14, 6 + wobble, 6, 4, 0.2, 0, Math.PI * 2); ctx.fill();

                    // 눈 (동그란 점 눈 — 맬로맨 스타일)
                    ctx.fillStyle = '#2C2C2C';
                    ctx.beginPath(); ctx.arc(-8, -2 + wobble, 3, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(8, -2 + wobble, 3, 0, Math.PI * 2); ctx.fill();
                    // 눈 하이라이트
                    ctx.fillStyle = '#FFF';
                    ctx.beginPath(); ctx.arc(-7, -3.5 + wobble, 1.2, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(9, -3.5 + wobble, 1.2, 0, Math.PI * 2); ctx.fill();

                    // 입 (작고 귀여운 미소)
                    ctx.strokeStyle = '#D4837A'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
                    ctx.beginPath(); ctx.arc(0, 8 + wobble, 5, 0.2, Math.PI - 0.2, false); ctx.stroke();

                    // 이름표 "여름"
                    ctx.fillStyle = '#FFB6C1';
                    ctx.beginPath(); ctx.roundRect(-14, 18 + wobble, 28, 10, 5); ctx.fill();
                    ctx.fillStyle = '#FFF'; ctx.font = 'bold 7px Arial';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('여름', 0, 23 + wobble);

                    // 짧은 팔 (양옆에 작게)
                    ctx.fillStyle = '#FFE4E1';
                    ctx.beginPath(); ctx.ellipse(-24, 4 + wobble, 5, 7, -0.3, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#F0C0B8'; ctx.lineWidth = 1; ctx.stroke();
                    ctx.beginPath(); ctx.ellipse(24, 4 + wobble, 5, 7, 0.3, 0, Math.PI * 2); ctx.fill();
                    ctx.stroke();

                    // 다리
                    if (!isDucking) {
                        const lo = Math.sin(frameIndex * 0.3) * 3;
                        ctx.fillStyle = '#FFE4E1';
                        ctx.beginPath(); ctx.ellipse(-8, 27 + lo, 5, 6, 0, 0, Math.PI * 2); ctx.fill();
                        ctx.beginPath(); ctx.ellipse(8, 27 - lo, 5, 6, 0, 0, Math.PI * 2); ctx.fill();
                    }

                    // 점프 시 반짝이 이펙트
                    if (isJumping) {
                        ctx.globalAlpha = 0.6;
                        ctx.fillStyle = '#FFB6C1';
                        for (let i = 0; i < 5; i++) {
                            const sa = frameIndex * 0.08 + i * 1.3;
                            const sr = 26 + i * 4;
                            const sparkX = Math.cos(sa) * sr;
                            const sparkY = Math.sin(sa) * sr + wobble;
                            // 별 모양 반짝이
                            ctx.save(); ctx.translate(sparkX, sparkY); ctx.rotate(frameIndex * 0.1 + i);
                            ctx.beginPath();
                            for (let j = 0; j < 4; j++) {
                                const a = j * Math.PI / 2;
                                ctx.moveTo(0, 0);
                                ctx.lineTo(Math.cos(a) * 3, Math.sin(a) * 3);
                            }
                            ctx.strokeStyle = '#FFB6C1'; ctx.lineWidth = 1.5; ctx.stroke();
                            ctx.restore();
                        }
                        ctx.globalAlpha = 1;
                    }

                    ctx.restore();
                },
                cost: 1000, hitbox: { offsetX: 8, offsetY: 8, width: 48, height: 48 }
            };

            const donggramiHajun = {
                name: '동그라미하준', colors: { main: '#E8A050', secondary: '#D4843C' }, size: 64,
                drawSprite: function(ctx, x, y, frameIndex, isJumping, isDucking) {
                    ctx.save(); ctx.translate(x + 32, y + 32);
                    const bounce = Math.sin(frameIndex * 0.15) * 1.5;

                    // 호빵 빵 본체 (따뜻한 갈색 그라데이션)
                    const breadGrad = ctx.createRadialGradient(-3, -5, 4, 0, 0, 26);
                    breadGrad.addColorStop(0, '#F5C882');
                    breadGrad.addColorStop(0.5, '#E8A050');
                    breadGrad.addColorStop(1, '#C07830');
                    ctx.fillStyle = breadGrad;
                    ctx.beginPath(); ctx.arc(0, bounce, 26, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#A06020'; ctx.lineWidth = 2; ctx.stroke();

                    // 김 (호빵 위 갈라진 선)
                    ctx.strokeStyle = '#A06020'; ctx.lineWidth = 1.5;
                    ctx.beginPath(); ctx.moveTo(-8, -24 + bounce); ctx.quadraticCurveTo(0, -20 + bounce, 8, -24 + bounce); ctx.stroke();

                    // 볼 (빨간 동그라미 — 호빵맨 특징)
                    ctx.fillStyle = '#FF6666';
                    ctx.beginPath(); ctx.arc(-15, 6 + bounce, 7, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(15, 6 + bounce, 7, 0, Math.PI * 2); ctx.fill();

                    // 큰 반짝 눈
                    ctx.fillStyle = '#FFF';
                    ctx.beginPath(); ctx.ellipse(-8, -4 + bounce, 6, 7, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.ellipse(8, -4 + bounce, 6, 7, 0, 0, Math.PI * 2); ctx.fill();
                    // 눈동자 (앞을 봄)
                    ctx.fillStyle = '#331100';
                    ctx.beginPath(); ctx.arc(-6, -3 + bounce, 3.5, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(10, -3 + bounce, 3.5, 0, Math.PI * 2); ctx.fill();
                    // 하이라이트
                    ctx.fillStyle = '#FFF';
                    ctx.beginPath(); ctx.arc(-7, -5 + bounce, 1.8, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(9, -5 + bounce, 1.8, 0, Math.PI * 2); ctx.fill();

                    // 동그란 코 (빨강)
                    ctx.fillStyle = '#FF4444';
                    ctx.beginPath(); ctx.arc(0, 3 + bounce, 5, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#CC2222'; ctx.lineWidth = 1; ctx.stroke();

                    // 입 (활짝 웃음)
                    ctx.strokeStyle = '#663300'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(0, 9 + bounce, 8, 0.15, Math.PI - 0.15, false); ctx.stroke();

                    // 이름표 "하준" (귀여운 뱃지)
                    ctx.fillStyle = '#FF6644';
                    ctx.beginPath(); ctx.roundRect(-16, 18 + bounce, 32, 11, 5); ctx.fill();
                    ctx.fillStyle = '#FFF'; ctx.font = 'bold 8px Arial';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('하준', 0, 23 + bounce);

                    // 다리
                    if (!isDucking) {
                        let lo = Math.sin(frameIndex * 0.3) * 4;
                        ctx.fillStyle = '#C07830';
                        ctx.fillRect(-8, 26 + lo, 5, 9);
                        ctx.fillRect(3, 26 - lo, 5, 9);
                    }

                    // 점프 시 김 올라오는 이펙트
                    if (isJumping) {
                        ctx.globalAlpha = 0.5;
                        ctx.fillStyle = '#FFF';
                        for (let i = 0; i < 4; i++) {
                            const sy = -28 - i * 6 - Math.sin(frameIndex * 0.2 + i) * 3;
                            const sx = Math.sin(frameIndex * 0.1 + i * 2) * 8;
                            ctx.beginPath(); ctx.arc(sx, sy + bounce, 2.5 - i * 0.4, 0, Math.PI * 2); ctx.fill();
                        }
                        ctx.globalAlpha = 1;
                    }

                    ctx.restore();
                },
                cost: 3000, hitbox: { offsetX: 8, offsetY: 8, width: 48, height: 48 }
            };

            // 순서 재배치: 동그라미, 네모미, 별미, 삼각미, 김여름, 하트미, 동그라미하준
            const desiredOrder = ['동그라미', '네모미', '별미', '삼각미', '김여름', '하트미', '동그라미하준'];
            const oldSprites = spriteConfig.sprites;
            const extras = { '김여름': kimYeoreum, '동그라미하준': donggramiHajun };
            const newSprites = {};
            desiredOrder.forEach(name => {
                if (oldSprites[name]) newSprites[name] = oldSprites[name];
                else if (extras[name]) newSprites[name] = extras[name];
            });
            spriteConfig.sprites = newSprites;
        })();

        // ============================================================================
        // AUDIO MANAGER
        // ============================================================================
        class AudioManager {
            constructor() {
                this.audioContext = null;
                this.masterGain = null;
                this.initAudio();
            }

            initAudio() {
                if (!window.AudioContext && !window.webkitAudioContext) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.audioContext = new AudioContext();
                this.masterGain = this.audioContext.createGain();
                this.masterGain.gain.value = 0.3;
                this.masterGain.connect(this.audioContext.destination);
            }

            playJumpSound() {
                if (!this.audioContext) return;
                const now = this.audioContext.currentTime;
                const osc = this.audioContext.createOscillator();
                const gain = this.audioContext.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start(now);
                osc.stop(now + 0.1);
            }

            playCoinSound() {
                if (!this.audioContext) return;
                const now = this.audioContext.currentTime;
                const osc = this.audioContext.createOscillator();
                const gain = this.audioContext.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start(now);
                osc.stop(now + 0.15);
            }

            playGameOverSound() {
                if (!this.audioContext) return;
                const now = this.audioContext.currentTime;
                const notes = [400, 300, 200];
                notes.forEach((freq, i) => {
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();

                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, now + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.15);

                    osc.connect(gain);
                    gain.connect(this.masterGain);
                    osc.start(now + i * 0.1);
                    osc.stop(now + i * 0.1 + 0.15);
                });
            }

            playPowerUpSound() {
                if (!this.audioContext) return;
                const now = this.audioContext.currentTime;
                const notes = [800, 1000, 1200];
                notes.forEach((freq, i) => {
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();

                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.15, now + i * 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.05 + 0.1);

                    osc.connect(gain);
                    gain.connect(this.masterGain);
                    osc.start(now + i * 0.05);
                    osc.stop(now + i * 0.05 + 0.1);
                });
            }

            playSeasonChangeSound(season) {
                if (!this.audioContext) return;
                const now = this.audioContext.currentTime;
                const chords = {
                    spring: [523, 659, 784], // C E G (밝은 메이저)
                    summer: [587, 740, 880], // D F# A (활기찬)
                    autumn: [440, 523, 659], // A C E (차분한 마이너)
                    winter: [392, 494, 587]  // G B D (서정적)
                };
                const chord = chords[season] || chords.spring;
                chord.forEach((freq, i) => {
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.12, now + 0.15);
                    gain.gain.linearRampToValueAtTime(0.08, now + 0.8);
                    gain.gain.linearRampToValueAtTime(0, now + 1.5);
                    osc.connect(gain);
                    gain.connect(this.masterGain);
                    osc.start(now + i * 0.08);
                    osc.stop(now + 1.6);
                });
            }
        }

        // ============================================================================
        // SEASONAL BGM SYSTEM - 계절별 프로시저럴 배경음악
        // ============================================================================
        class SeasonalBGM {
            constructor(audioManager) {
                this.am = audioManager;
                this.currentSeason = null;
                this.bgmNodes = []; // 현재 재생 중인 노드들
                this.bgmGain = null; // BGM 전용 gain
                this.fadeGain = null; // 크로스페이드용 gain
                this.nextBeatTime = 0;
                this.beatIndex = 0;
                this.bpm = 120;
                this.isPlaying = false;
                this.targetVolume = 0.7; // BGM 볼륨 (효과음 수준)
                this.seasonTransitionOverlay = null; // { season, timer, maxTime }

                // 계절별 음악 패턴 정의
                this.patterns = {
                    spring: {
                        // 봄: 밝고 경쾌한 멜로디 (C 메이저, 빠른 템포)
                        bpm: 138,
                        scale: [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25],
                        melody: [0,2,4,5, 4,2,3,4, 5,4,2,0, 2,4,5,7],
                        bass: [0,0,3,3, 5,5,4,4],
                        waveType: 'triangle',
                        bassType: 'sine',
                        melodyVol: 0.45,
                        bassVol: 0.30,
                        arpeggio: true
                    },
                    summer: {
                        bpm: 150,
                        scale: [293.66, 329.63, 369.99, 392.00, 440.00, 493.88, 554.37, 587.33],
                        melody: [0,4,2,5, 7,5,4,2, 0,2,4,7, 5,4,2,0],
                        bass: [0,0,4,4, 5,5,2,2],
                        waveType: 'square',
                        bassType: 'triangle',
                        melodyVol: 0.30,
                        bassVol: 0.20,
                        arpeggio: false
                    },
                    autumn: {
                        bpm: 108,
                        scale: [220.00, 246.94, 261.63, 293.66, 329.63, 349.23, 392.00, 440.00],
                        melody: [0,2,4,7, 5,4,2,0, 3,5,7,5, 4,2,0,2],
                        bass: [0,0,3,3, 5,5,4,4],
                        waveType: 'triangle',
                        bassType: 'sine',
                        melodyVol: 0.40,
                        bassVol: 0.28,
                        arpeggio: false
                    },
                    winter: {
                        bpm: 96,
                        scale: [164.81, 185.00, 196.00, 220.00, 246.94, 261.63, 293.66, 329.63],
                        melody: [0,3,5,7, 5,3,2,0, 4,5,7,5, 3,2,0,3],
                        bass: [0,0,2,2, 4,4,3,3],
                        waveType: 'sine',
                        bassType: 'sine',
                        melodyVol: 0.40,
                        bassVol: 0.35,
                        arpeggio: true
                    }
                };
            }

            start(season) {
                if (!this.am.audioContext) return;
                this.isPlaying = true;
                this.currentSeason = season;
                this.beatIndex = 0;
                this._ensureGain();
                this.bgmGain.gain.setValueAtTime(this.targetVolume, this.am.audioContext.currentTime);
                this.nextBeatTime = this.am.audioContext.currentTime + 0.1;
            }

            stop() {
                this.isPlaying = false;
                if (this.bgmGain && this.am.audioContext) {
                    try {
                        this.bgmGain.gain.linearRampToValueAtTime(0, this.am.audioContext.currentTime + 0.5);
                    } catch(e) {}
                }
            }

            _ensureGain() {
                if (!this.bgmGain || !this.am.audioContext) {
                    if (!this.am.audioContext) return;
                    this.bgmGain = this.am.audioContext.createGain();
                    this.bgmGain.gain.value = this.targetVolume;
                    this.bgmGain.connect(this.am.masterGain);
                }
            }

            setVolume(vol) {
                this.targetVolume = 0.7 * vol; // vol: 0~1
                if (this.bgmGain && this.am.audioContext) {
                    this.bgmGain.gain.setValueAtTime(this.targetVolume, this.am.audioContext.currentTime);
                }
            }

            setMuted(muted) {
                if (this.bgmGain && this.am.audioContext) {
                    this.bgmGain.gain.setValueAtTime(muted ? 0 : this.targetVolume, this.am.audioContext.currentTime);
                }
            }

            changeSeason(newSeason) {
                if (!this.am.audioContext || newSeason === this.currentSeason) return;
                const ctx = this.am.audioContext;
                const now = ctx.currentTime;

                // 크로스페이드: 현재 음악 페이드아웃
                if (this.bgmGain) {
                    this.bgmGain.gain.cancelScheduledValues(now);
                    this.bgmGain.gain.setValueAtTime(this.bgmGain.gain.value, now);
                    this.bgmGain.gain.linearRampToValueAtTime(0, now + 1.5);
                }

                // 새 gain 노드 생성해서 페이드인
                const oldGain = this.bgmGain;
                this.bgmGain = ctx.createGain();
                this.bgmGain.gain.setValueAtTime(0, now);
                this.bgmGain.gain.linearRampToValueAtTime(this.targetVolume, now + 2.0);
                this.bgmGain.connect(this.am.masterGain);

                // 이전 gain은 2초 후 자동 정리
                setTimeout(() => {
                    try { oldGain.disconnect(); } catch(e) {}
                }, 3000);

                this.currentSeason = newSeason;
                this.beatIndex = 0;
                this.nextBeatTime = now + 0.5; // 크로스페이드 중 약간 딜레이 후 시작

                // 계절 전환 오버레이 설정
                this.seasonTransitionOverlay = { season: newSeason, timer: 4.0, maxTime: 4.0 };

                // 전환 효과음
                this.am.playSeasonChangeSound(newSeason);
            }

            update(deltaTime) {
                if (!this.isPlaying || !this.am.audioContext) return;
                const ctx = this.am.audioContext;
                const now = ctx.currentTime;
                const pattern = this.patterns[this.currentSeason];
                if (!pattern) return;

                const beatDuration = 60 / pattern.bpm;

                // 스케줄링: 현재 시간보다 앞선 비트들을 예약
                while (this.nextBeatTime < now + 0.2) {
                    this._playBeat(pattern, this.nextBeatTime, beatDuration);
                    this.beatIndex = (this.beatIndex + 1) % pattern.melody.length;
                    this.nextBeatTime += beatDuration;
                }

                // 오버레이 타이머 업데이트
                if (this.seasonTransitionOverlay) {
                    this.seasonTransitionOverlay.timer -= deltaTime;
                    if (this.seasonTransitionOverlay.timer <= 0) {
                        this.seasonTransitionOverlay = null;
                    }
                }
            }

            _playBeat(pattern, time, duration) {
                if (!this.am.audioContext) return;
                const ctx = this.am.audioContext;
                this._ensureGain();

                // 멜로디 노트
                const noteIdx = pattern.melody[this.beatIndex];
                const freq = pattern.scale[noteIdx];

                if (pattern.arpeggio && this.beatIndex % 2 === 0) {
                    // 아르페지오: 2개 음을 빠르게
                    const freq2 = pattern.scale[Math.min(noteIdx + 2, pattern.scale.length - 1)];
                    this._playNote(freq, time, duration * 0.45, pattern.waveType, pattern.melodyVol);
                    this._playNote(freq2, time + duration * 0.5, duration * 0.45, pattern.waveType, pattern.melodyVol * 0.7);
                } else {
                    this._playNote(freq, time, duration * 0.8, pattern.waveType, pattern.melodyVol);
                }

                // 베이스 (4비트마다)
                if (this.beatIndex % 2 === 0) {
                    const bassIdx = pattern.bass[Math.floor(this.beatIndex / 2) % pattern.bass.length];
                    const bassFreq = pattern.scale[bassIdx] / 2; // 옥타브 아래
                    this._playNote(bassFreq, time, duration * 1.8, pattern.bassType, pattern.bassVol);
                }
            }

            _playNote(freq, time, duration, waveType, volume) {
                const ctx = this.am.audioContext;
                if (!ctx || !this.bgmGain) return;

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = waveType;
                osc.frequency.setValueAtTime(freq, time);

                // 부드러운 어택/릴리즈 (ADSR)
                gain.gain.setValueAtTime(0, time);
                gain.gain.linearRampToValueAtTime(volume, time + 0.02);
                gain.gain.setValueAtTime(volume, time + duration * 0.6);
                gain.gain.linearRampToValueAtTime(0, time + duration);

                osc.connect(gain);
                gain.connect(this.bgmGain);
                osc.start(time);
                osc.stop(time + duration + 0.05);
            }

            // 계절 전환 오버레이 그리기
            drawOverlay(ctx) {
                if (!this.seasonTransitionOverlay) return;

                const ov = this.seasonTransitionOverlay;
                const progress = 1 - (ov.timer / ov.maxTime); // 0→1
                const fadeIn = Math.min(1, progress * 3); // 처음 0.33 동안 페이드인
                const fadeOut = Math.min(1, ov.timer / 1.0); // 마지막 1초 페이드아웃
                const alpha = Math.min(fadeIn, fadeOut);

                if (alpha <= 0.01) return;

                const W = GAME_CONFIG.width;
                const H = GAME_CONFIG.height;

                ctx.save();
                ctx.globalAlpha = alpha;

                // 계절별 오버레이 색상 + 이모지
                const overlayColors = {
                    spring: { top: 'rgba(255,192,203,0.25)', bot: 'rgba(255,255,255,0.05)', emoji: '🌸', text: '봄이 왔어요!', particles: '🌷🌼🦋' },
                    summer: { top: 'rgba(255,200,0,0.20)', bot: 'rgba(135,206,235,0.05)', emoji: '☀️', text: '여름이 왔어요!', particles: '🌻🌊🦎' },
                    autumn: { top: 'rgba(255,140,0,0.25)', bot: 'rgba(139,69,19,0.05)', emoji: '🍂', text: '가을이 왔어요!', particles: '🍁🌰🍄' },
                    winter: { top: 'rgba(100,149,237,0.25)', bot: 'rgba(255,255,255,0.10)', emoji: '❄️', text: '겨울이 왔어요!', particles: '⛄🌨️💎' }
                };
                const oc = overlayColors[ov.season] || overlayColors.spring;

                // 그라데이션 오버레이
                const grad = ctx.createLinearGradient(0, 0, 0, H);
                grad.addColorStop(0, oc.top);
                grad.addColorStop(1, oc.bot);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                // 중앙 배너 (계절 배너보다 더 화려하게)
                const bannerAlpha = alpha * 0.92;
                ctx.globalAlpha = bannerAlpha;

                const bw = 500, bh = 120;
                const bx = W / 2 - bw / 2;
                const by = H / 2 - bh / 2 - 30;

                // 배너 배경 (그라데이션 + 둥근 모서리)
                const bannerGrad = ctx.createLinearGradient(bx, by, bx, by + bh);
                bannerGrad.addColorStop(0, 'rgba(0,0,0,0.75)');
                bannerGrad.addColorStop(1, 'rgba(0,0,0,0.55)');
                ctx.fillStyle = bannerGrad;
                ctx.beginPath();
                ctx.roundRect(bx, by, bw, bh, 20);
                ctx.fill();

                // 배너 테두리 (계절색)
                const borderColors = { spring: '#FF69B4', summer: '#FFD700', autumn: '#FF8C00', winter: '#87CEEB' };
                ctx.strokeStyle = borderColors[ov.season] || '#FFFFFF';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.roundRect(bx, by, bw, bh, 20);
                ctx.stroke();

                // 이모지 + 텍스트
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 44px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(`${oc.emoji} ${oc.text} ${oc.emoji}`, W / 2, by + bh * 0.45);

                // 음표 아이콘 표시 (음악 바뀐다는 표시)
                ctx.font = '20px Arial';
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.fillText(`♪ ♫ 배경음악이 바뀝니다 ♫ ♪`, W / 2, by + bh * 0.82);

                // 떨어지는 파티클 이모지 (계절 분위기)
                const particleEmojis = oc.particles.match(/./gu) || [];
                ctx.font = '28px Arial';
                const time = (ov.maxTime - ov.timer) * 2;
                for (let i = 0; i < 8; i++) {
                    const emoji = particleEmojis[i % particleEmojis.length];
                    const px = (W * 0.1) + (i * W * 0.11) + Math.sin(time + i * 1.5) * 30;
                    const py = ((time * 60 + i * 80) % (H + 40)) - 20;
                    ctx.globalAlpha = bannerAlpha * 0.6;
                    ctx.fillText(emoji, px, py);
                }

                ctx.restore();
            }
        }

        // ============================================================================
        // INPUT MANAGER - FIXED TOUCH HANDLING
        // ============================================================================
        class InputManager {
            constructor() {
                this.keys = {};
                this.jumping = false;
                this.ducking = false;
                this.jumpPressed = false;
                this.touchStartY = 0;
                this.lastTouchX = undefined;
                this.lastTouchY = undefined;
                this.setupListeners();
            }

            setupListeners() {
                document.addEventListener('keydown', (e) => {
                    this.keys[e.key] = true;
                    if (e.key === ' ') {
                        e.preventDefault();
                        if (!this.jumpPressed) {
                            this.jumping = true;
                            this.jumpPressed = true;
                        }
                    }
                    if (e.key === 'ArrowDown') {
                        this.ducking = true;
                    }
                });

                document.addEventListener('keyup', (e) => {
                    this.keys[e.key] = false;
                    if (e.key === ' ') {
                        this.jumpPressed = false;
                    }
                    if (e.key === 'ArrowDown') {
                        this.ducking = false;
                    }
                });

                // Touch jump
                const canvas = document.getElementById('gameCanvas');
                canvas.addEventListener('touchstart', (e) => {
                    this.touchStartY = e.touches[0].clientY;
                    // 캔버스 좌표 변환
                    const rect = canvas.getBoundingClientRect();
                    const scaleX = GAME_CONFIG.width / rect.width;
                    const scaleY = GAME_CONFIG.height / rect.height;
                    this.lastTouchX = (e.touches[0].clientX - rect.left) * scaleX;
                    this.lastTouchY = (e.touches[0].clientY - rect.top) * scaleY;
                    if (!this.jumpPressed) {
                        this.jumping = true;
                        this.jumpPressed = true;
                    }
                    e.preventDefault();
                });

                canvas.addEventListener('touchmove', (e) => {
                    if (e.touches.length > 0) {
                        const deltaY = e.touches[0].clientY - this.touchStartY;
                        if (deltaY > 50) {
                            this.ducking = true;
                        }
                    }
                });

                canvas.addEventListener('touchend', (e) => {
                    this.jumpPressed = false;
                    this.ducking = false;
                    e.preventDefault();
                });

                // Mouse click for jump
                canvas.addEventListener('click', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const scaleX = GAME_CONFIG.width / rect.width;
                    const scaleY = GAME_CONFIG.height / rect.height;
                    this.lastTouchX = (e.clientX - rect.left) * scaleX;
                    this.lastTouchY = (e.clientY - rect.top) * scaleY;
                    if (!this.jumpPressed) {
                        this.jumping = true;
                        this.jumpPressed = true;
                        setTimeout(() => {
                            this.jumpPressed = false;
                        }, 100);
                    }
                });
            }

            getInputState() {
                return {
                    jumping: this.jumping,
                    ducking: this.ducking
                };
            }

            resetJump() {
                this.jumping = false;
            }
        }

        // ============================================================================
        // PARTICLE SYSTEM
        // ============================================================================
        class ParticleSystem {
            constructor() {
                this.particles = [];
            }

            createExplosion(x, y, color, count = 8) {
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2;
                    const vx = Math.cos(angle) * 3;
                    const vy = Math.sin(angle) * 3 - 2;
                    this.particles.push({
                        x, y, vx, vy, life: 1, color,
                        size: Math.random() * 3 + 2
                    });
                }
            }

            update(deltaTime) {
                this.particles = this.particles.filter(p => p.life > 0);
                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.2;
                    p.life -= 0.02;
                });
            }

            draw(ctx) {
                this.particles.forEach(p => {
                    ctx.save();
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });
            }
        }

        // ============================================================================
        // PLAYER CLASS
        // ============================================================================
        class Player {
            constructor(characterName) {
                // 캐릭터가 없으면 첫 번째 캐릭터로 폴백
                const spriteKeys = Object.keys(spriteConfig.sprites);
                this.character = spriteConfig.sprites[characterName] || spriteConfig.sprites[spriteKeys[0]];
                this.x = GAME_CONFIG.playerStartX;
                this.y = GAME_CONFIG.groundY - GAME_CONFIG.playerSize;
                this.width = GAME_CONFIG.playerSize;
                this.height = GAME_CONFIG.playerSize;
                this.velocityY = 0;
                this.isJumping = false;
                this.isDucking = false;
                this.frameIndex = 0;
                this.doubleJumpAvailable = false;
                this.activePowerUp = null;
                this.powerUpTimer = 0;

                this.hitbox = this.character.hitbox || { offsetX: 10, offsetY: 10, width: 44, height: 44 };
            }

            update(inputState, deltaTime) {
                // Jump
                if (inputState.jumping && !this.isJumping && !this.isDucking) {
                    this.velocityY = GAME_CONFIG.jumpPower;
                    this.isJumping = true;
                    this.doubleJumpAvailable = true;
                    audioManager.playJumpSound();
                } else if (inputState.jumping && this.doubleJumpAvailable && this.isJumping) {
                    this.velocityY = GAME_CONFIG.jumpPower;
                    this.doubleJumpAvailable = false;
                    audioManager.playJumpSound();
                }

                // Duck
                this.isDucking = inputState.ducking && !this.isJumping;

                // Apply gravity
                this.velocityY += GAME_CONFIG.gravity;
                this.y += this.velocityY;

                // Ground collision
                if (this.y + this.height >= GAME_CONFIG.groundY) {
                    this.y = GAME_CONFIG.groundY - this.height;
                    this.velocityY = 0;
                    this.isJumping = false;
                }

                // Animation
                this.frameIndex = (this.frameIndex + 0.15) % 100;

                // Power-up timer
                if (this.activePowerUp) {
                    this.powerUpTimer -= deltaTime;
                    if (this.powerUpTimer <= 0) {
                        this.activePowerUp = null;
                    }
                }
            }

            getHitbox() {
                return {
                    x: this.x + this.hitbox.offsetX,
                    y: this.y + this.hitbox.offsetY,
                    width: this.hitbox.width,
                    height: this.hitbox.height
                };
            }

            draw(ctx) {
                // 무적 상태일 때 캐릭터 깜빡임 효과
                if (gameState.invulnTimer > 0) {
                    const blinkRate = Math.floor(Date.now() / 100) % 2;
                    ctx.globalAlpha = blinkRate === 0 ? 0.3 : 1.0;
                }

                if (this.character && this.character.drawSprite) {
                    try {
                        this.character.drawSprite(ctx, this.x, this.y, this.frameIndex, this.isJumping, this.isDucking);
                    } catch(e) {
                        // 폴백: 빨간 원
                        ctx.fillStyle = '#FF4444';
                        ctx.beginPath();
                        ctx.arc(this.x + 32, this.y + 32, 28, 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else {
                    // drawSprite 없을 때 폴백
                    ctx.fillStyle = '#FF4444';
                    ctx.beginPath();
                    ctx.arc(this.x + 32, this.y + 32, 28, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FFF';
                    ctx.font = '14px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('?', this.x + 32, this.y + 36);
                }

                // 무적 깜빡임 후 알파 복원
                ctx.globalAlpha = 1.0;

                // Power-up indicator
                if (this.activePowerUp) {
                    ctx.save();
                    ctx.strokeStyle = '#FFD700';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(this.x + this.width / 2, this.y - 10, 28, 0, Math.PI * 2);
                    ctx.stroke();

                    const progress = this.powerUpTimer / 5;
                    ctx.strokeStyle = '#FF6600';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(this.x + this.width / 2, this.y - 10, 25, -Math.PI / 2, -Math.PI / 2 + progress * Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }
            }
        }

        // ============================================================================
        // OBSTACLE CLASS
        // ============================================================================
        class Obstacle {
            constructor(type, score) {
                this.type = type;
                this.x = GAME_CONFIG.width;

                // 새 장애물 유형들 (크기 업!)
                const defs = {
                    // 새 (큰 사이즈)
                    'bird-low':     { w: 65, h: 45, y: GAME_CONFIG.groundY - 55,  color: '#FFB000' },
                    'bird-mid':     { w: 65, h: 45, y: GAME_CONFIG.groundY - 110, color: '#FFB000' },
                    'bird-high':    { w: 65, h: 45, y: GAME_CONFIG.groundY - 165, color: '#FFB000' },
                    // 선인장 (크기 업)
                    'cactus-small': { w: 40, h: 60,  y: GAME_CONFIG.groundY - 60,  color: '#00AA00' },
                    'cactus-medium':{ w: 55, h: 80,  y: GAME_CONFIG.groundY - 80,  color: '#00BB00' },
                    'cactus-large': { w: 65, h: 100, y: GAME_CONFIG.groundY - 100, color: '#00CC00' },
                    // 바위
                    'rock-small':   { w: 50, h: 40,  y: GAME_CONFIG.groundY - 40,  color: '#888888' },
                    'rock-large':   { w: 70, h: 55,  y: GAME_CONFIG.groundY - 55,  color: '#777777' },
                    // 물웅덩이 (낮고 넓음 — 점프해야 함)
                    'puddle':       { w: 80, h: 20,  y: GAME_CONFIG.groundY - 10,  color: '#4488CC' },
                    // 벌 (공중 작은 적)
                    'bee':          { w: 45, h: 40,  y: GAME_CONFIG.groundY - 90 - Math.random() * 60, color: '#FFD700' },
                    // 눈사람 (겨울)
                    'snowman':      { w: 55, h: 80,  y: GAME_CONFIG.groundY - 80,  color: '#FFFFFF' },
                    // 버섯 (봄)
                    'mushroom':     { w: 45, h: 55,  y: GAME_CONFIG.groundY - 55,  color: '#FF4444' },
                    // 나무 그루터기
                    'stump':        { w: 55, h: 45,  y: GAME_CONFIG.groundY - 45,  color: '#8B5E3C' },
                    // === 악당 캐릭터들 ===
                    // 1. 삐뚤이 (LV.0~) — 작은 보라색 슬라임 악당
                    'villain-slime':   { w: 50, h: 45,  y: GAME_CONFIG.groundY - 45,  color: '#9B59B6' },
                    // 2. 까미 (LV.3~) — 검은 고양이 악당, 빠르게 달려옴
                    'villain-cat':     { w: 55, h: 50,  y: GAME_CONFIG.groundY - 50,  color: '#2C3E50' },
                    // 3. 불꽃이 (LV.8~) — 공중 화염 악당
                    'villain-flame':   { w: 50, h: 50,  y: GAME_CONFIG.groundY - 110 - Math.random() * 40, color: '#E74C3C' },
                    // 4. 가시왕 (LV.15~) — 거대 가시 몬스터
                    'villain-spike':   { w: 70, h: 75,  y: GAME_CONFIG.groundY - 75,  color: '#7F8C8D' },
                    // 5. 유령이 (LV.30~) — 투명해졌다 나타나는 유령
                    'villain-ghost':   { w: 55, h: 60,  y: GAME_CONFIG.groundY - 100 - Math.random() * 30, color: '#BDC3C7' },
                    // 6. 보스악당 다크동 (LV.50~) — 동그라미의 어둠 버전
                    'villain-dark':    { w: 64, h: 64,  y: GAME_CONFIG.groundY - 64,  color: '#1A1A2E' },
                };

                const def = defs[type] || defs['cactus-small'];
                this.width = def.w;
                this.height = def.h;
                this.y = def.y;
                this.color = def.color;

                this.hitbox = {
                    offsetX: 8,
                    offsetY: 8,
                    width: this.width - 16,
                    height: this.height - 16
                };

                this.frameIndex = 0;
            }

            update(gameSpeed, deltaTime) {
                this.x -= gameSpeed;
                this.frameIndex += 0.1;
            }

            getHitbox() {
                return {
                    x: this.x + this.hitbox.offsetX,
                    y: this.y + this.hitbox.offsetY,
                    width: this.hitbox.width,
                    height: this.hitbox.height
                };
            }

            draw(ctx) {
                ctx.save();
                const cx = this.x + this.width / 2;
                const cy = this.y + this.height / 2;

                if (this.type.includes('bird')) {
                    // 새 (크게)
                    const bw = this.width * 0.45, bh = this.height * 0.4;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.ellipse(cx - 5, cy, bw, bh, 0, 0, Math.PI * 2);
                    ctx.fill();
                    // 머리
                    ctx.beginPath();
                    ctx.arc(cx + bw - 2, cy - 3, bh * 0.8, 0, Math.PI * 2);
                    ctx.fill();
                    // 눈
                    ctx.fillStyle = '#FFF';
                    ctx.beginPath();
                    ctx.arc(cx + bw + 2, cy - 5, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(cx + bw + 3, cy - 5, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    // 부리
                    ctx.fillStyle = '#FF6600';
                    ctx.beginPath();
                    ctx.moveTo(cx + bw + 12, cy - 2);
                    ctx.lineTo(cx + bw + 5, cy - 6);
                    ctx.lineTo(cx + bw + 5, cy + 2);
                    ctx.closePath();
                    ctx.fill();
                    // 날개
                    const wingFlap = Math.sin(this.frameIndex * 1.5) * 12;
                    ctx.strokeStyle = '#CC8800';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(cx - 5, cy);
                    ctx.quadraticCurveTo(cx - 15, cy - 15 + wingFlap, cx - bw, cy - 5 + wingFlap);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(cx - 5, cy);
                    ctx.quadraticCurveTo(cx + 5, cy - 15 - wingFlap, cx + 15, cy - 10 - wingFlap);
                    ctx.stroke();

                } else if (this.type === 'bee') {
                    // 벌
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, 16, 12, 0, 0, Math.PI * 2);
                    ctx.fill();
                    // 줄무늬
                    ctx.fillStyle = '#222';
                    ctx.fillRect(cx - 6, cy - 10, 4, 20);
                    ctx.fillRect(cx + 3, cy - 10, 4, 20);
                    // 날개
                    const bwing = Math.sin(this.frameIndex * 3) * 5;
                    ctx.fillStyle = 'rgba(200,220,255,0.6)';
                    ctx.beginPath();
                    ctx.ellipse(cx - 8, cy - 14 + bwing, 10, 6, -0.3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(cx + 8, cy - 14 - bwing, 10, 6, 0.3, 0, Math.PI * 2);
                    ctx.fill();
                    // 눈
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(cx - 6, cy - 3, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + 6, cy - 3, 3, 0, Math.PI * 2);
                    ctx.fill();
                    // 침
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(cx + 16, cy + 2);
                    ctx.lineTo(cx + 24, cy + 5);
                    ctx.stroke();

                } else if (this.type.includes('rock')) {
                    // 바위
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.moveTo(this.x + 5, this.y + this.height);
                    ctx.lineTo(this.x + 10, this.y + 5);
                    ctx.lineTo(this.x + this.width * 0.4, this.y);
                    ctx.lineTo(this.x + this.width * 0.7, this.y + 3);
                    ctx.lineTo(this.x + this.width - 5, this.y + 8);
                    ctx.lineTo(this.x + this.width, this.y + this.height);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = '#555';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    // 하이라이트
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.beginPath();
                    ctx.arc(cx - 5, cy - 5, 8, 0, Math.PI * 2);
                    ctx.fill();

                } else if (this.type === 'puddle') {
                    // 물웅덩이
                    ctx.fillStyle = 'rgba(60,130,200,0.6)';
                    ctx.beginPath();
                    ctx.ellipse(cx, this.y + this.height / 2, this.width / 2, this.height / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    // 반짝임
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.beginPath();
                    ctx.ellipse(cx - 10, this.y + 3, 8, 3, -0.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(cx + 15, this.y + 5, 5, 2, 0.3, 0, Math.PI * 2);
                    ctx.fill();

                } else if (this.type === 'snowman') {
                    // 눈사람
                    ctx.fillStyle = '#FFFFFF';
                    // 몸통 (아래)
                    ctx.beginPath();
                    ctx.arc(cx, this.y + this.height - 22, 22, 0, Math.PI * 2);
                    ctx.fill();
                    // 머리 (위)
                    ctx.beginPath();
                    ctx.arc(cx, this.y + 20, 16, 0, Math.PI * 2);
                    ctx.fill();
                    // 눈
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(cx - 6, this.y + 17, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + 6, this.y + 17, 3, 0, Math.PI * 2);
                    ctx.fill();
                    // 코 (당근)
                    ctx.fillStyle = '#FF6600';
                    ctx.beginPath();
                    ctx.moveTo(cx, this.y + 22);
                    ctx.lineTo(cx + 12, this.y + 24);
                    ctx.lineTo(cx, this.y + 26);
                    ctx.closePath();
                    ctx.fill();
                    // 모자
                    ctx.fillStyle = '#333';
                    ctx.fillRect(cx - 14, this.y + 2, 28, 5);
                    ctx.fillRect(cx - 10, this.y - 15, 20, 18);
                    // 외곽선
                    ctx.strokeStyle = '#CCCCDD';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(cx, this.y + this.height - 22, 22, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(cx, this.y + 20, 16, 0, Math.PI * 2);
                    ctx.stroke();

                } else if (this.type === 'mushroom') {
                    // 버섯
                    // 줄기
                    ctx.fillStyle = '#F5DEB3';
                    ctx.fillRect(cx - 7, cy + 5, 14, this.height * 0.45);
                    // 갓
                    ctx.fillStyle = '#FF4444';
                    ctx.beginPath();
                    ctx.arc(cx, cy, this.width * 0.42, Math.PI, 0);
                    ctx.closePath();
                    ctx.fill();
                    // 점 무늬
                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath(); ctx.arc(cx - 8, cy - 8, 4, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx + 7, cy - 10, 3, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx, cy - 14, 3.5, 0, Math.PI * 2); ctx.fill();
                    // 외곽
                    ctx.strokeStyle = '#CC0000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(cx, cy, this.width * 0.42, Math.PI, 0);
                    ctx.stroke();

                } else if (this.type === 'stump') {
                    // 나무 그루터기
                    ctx.fillStyle = '#8B5E3C';
                    ctx.fillRect(this.x + 8, this.y + 10, this.width - 16, this.height - 10);
                    // 나이테 (윗면)
                    ctx.fillStyle = '#A0724B';
                    ctx.beginPath();
                    ctx.ellipse(cx, this.y + 10, (this.width - 16) / 2, 10, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#6B3F1F';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    // 나이테 링
                    ctx.strokeStyle = '#6B3F1F';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.ellipse(cx, this.y + 10, 10, 5, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.ellipse(cx, this.y + 10, 5, 3, 0, 0, Math.PI * 2);
                    ctx.stroke();

                } else if (this.type === 'villain-slime') {
                    // 삐뚤이 — 보라색 슬라임 악당
                    const bounce = Math.sin(this.frameIndex * 0.8) * 3;
                    // 슬라임 몸체
                    const slimeGrad = ctx.createRadialGradient(cx - 3, cy - 8 + bounce, 3, cx, cy + bounce, 22);
                    slimeGrad.addColorStop(0, '#C39BD3');
                    slimeGrad.addColorStop(0.6, '#9B59B6');
                    slimeGrad.addColorStop(1, '#6C3483');
                    ctx.fillStyle = slimeGrad;
                    ctx.beginPath();
                    // 물결치는 슬라임 형태
                    ctx.moveTo(this.x + 2, this.y + this.height);
                    ctx.quadraticCurveTo(this.x + 5, cy - 5 + bounce, cx - 10, this.y + 5 + bounce);
                    ctx.quadraticCurveTo(cx, this.y - 5 + bounce, cx + 10, this.y + 5 + bounce);
                    ctx.quadraticCurveTo(this.x + this.width - 5, cy - 5 + bounce, this.x + this.width - 2, this.y + this.height);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = '#6C3483'; ctx.lineWidth = 1.5; ctx.stroke();
                    // 사악한 눈 (X자)
                    ctx.strokeStyle = '#FFF'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
                    ctx.beginPath(); ctx.moveTo(cx - 12, cy - 6 + bounce); ctx.lineTo(cx - 6, cy + bounce); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(cx - 6, cy - 6 + bounce); ctx.lineTo(cx - 12, cy + bounce); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(cx + 6, cy - 6 + bounce); ctx.lineTo(cx + 12, cy + bounce); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(cx + 12, cy - 6 + bounce); ctx.lineTo(cx + 6, cy + bounce); ctx.stroke();
                    // 삐죽 입
                    ctx.strokeStyle = '#FFF'; ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(cx - 8, cy + 8 + bounce);
                    ctx.lineTo(cx - 4, cy + 5 + bounce);
                    ctx.lineTo(cx, cy + 10 + bounce);
                    ctx.lineTo(cx + 4, cy + 5 + bounce);
                    ctx.lineTo(cx + 8, cy + 8 + bounce);
                    ctx.stroke();

                } else if (this.type === 'villain-cat') {
                    // 까미 — 검은 고양이 악당
                    const run = Math.sin(this.frameIndex * 0.6) * 2;
                    // 몸통
                    ctx.fillStyle = '#2C3E50';
                    ctx.beginPath();
                    ctx.ellipse(cx, cy + 5 + run, 20, 16, 0, 0, Math.PI * 2);
                    ctx.fill();
                    // 머리
                    ctx.beginPath();
                    ctx.arc(cx + 16, cy - 8 + run, 14, 0, Math.PI * 2);
                    ctx.fill();
                    // 귀 (삼각형)
                    ctx.beginPath();
                    ctx.moveTo(cx + 7, cy - 20 + run); ctx.lineTo(cx + 12, cy - 8 + run); ctx.lineTo(cx + 4, cy - 10 + run);
                    ctx.closePath(); ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(cx + 25, cy - 20 + run); ctx.lineTo(cx + 20, cy - 8 + run); ctx.lineTo(cx + 28, cy - 10 + run);
                    ctx.closePath(); ctx.fill();
                    // 귀 안쪽 (핑크)
                    ctx.fillStyle = '#E91E63';
                    ctx.beginPath();
                    ctx.moveTo(cx + 9, cy - 17 + run); ctx.lineTo(cx + 12, cy - 10 + run); ctx.lineTo(cx + 6, cy - 11 + run);
                    ctx.closePath(); ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(cx + 23, cy - 17 + run); ctx.lineTo(cx + 20, cy - 10 + run); ctx.lineTo(cx + 26, cy - 11 + run);
                    ctx.closePath(); ctx.fill();
                    // 빛나는 빨간 눈
                    ctx.fillStyle = '#E74C3C';
                    ctx.beginPath(); ctx.arc(cx + 11, cy - 10 + run, 3, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx + 21, cy - 10 + run, 3, 0, Math.PI * 2); ctx.fill();
                    // 눈 하이라이트
                    ctx.fillStyle = '#FFF';
                    ctx.beginPath(); ctx.arc(cx + 10, cy - 11 + run, 1.2, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx + 20, cy - 11 + run, 1.2, 0, Math.PI * 2); ctx.fill();
                    // 꼬리 (구불구불)
                    ctx.strokeStyle = '#2C3E50'; ctx.lineWidth = 4; ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(cx - 18, cy + 2 + run);
                    ctx.quadraticCurveTo(cx - 28, cy - 15 + run, cx - 22, cy - 25 + Math.sin(this.frameIndex * 0.4) * 5 + run);
                    ctx.stroke();
                    // 다리 (달리는 모션)
                    ctx.fillStyle = '#2C3E50';
                    const legAnim = Math.sin(this.frameIndex * 0.8) * 6;
                    ctx.fillRect(cx - 8, cy + 16 + legAnim, 5, 10);
                    ctx.fillRect(cx + 3, cy + 16 - legAnim, 5, 10);
                    ctx.fillRect(cx + 12, cy + 16 + legAnim, 5, 10);

                } else if (this.type === 'villain-flame') {
                    // 불꽃이 — 공중 화염 악당
                    const flicker = Math.sin(this.frameIndex * 1.2) * 3;
                    // 외곽 불꽃
                    ctx.fillStyle = 'rgba(255,100,0,0.4)';
                    ctx.beginPath(); ctx.arc(cx, cy + flicker, 24, 0, Math.PI * 2); ctx.fill();
                    // 내부 불꽃 몸체
                    const fireGrad = ctx.createRadialGradient(cx, cy + flicker, 3, cx, cy + flicker, 18);
                    fireGrad.addColorStop(0, '#FFEB3B');
                    fireGrad.addColorStop(0.4, '#FF9800');
                    fireGrad.addColorStop(0.8, '#E74C3C');
                    fireGrad.addColorStop(1, '#C0392B');
                    ctx.fillStyle = fireGrad;
                    ctx.beginPath(); ctx.arc(cx, cy + flicker, 18, 0, Math.PI * 2); ctx.fill();
                    // 불꽃 꼬리 (위로 솟아오름)
                    ctx.fillStyle = '#FF5722';
                    for (let i = 0; i < 5; i++) {
                        const fa = this.frameIndex * 0.3 + i * 1.3;
                        const fx = cx + Math.sin(fa) * 8;
                        const fy = cy - 18 - i * 5 + Math.sin(fa * 1.5) * 3 + flicker;
                        const fr = 5 - i * 0.7;
                        ctx.globalAlpha = 0.8 - i * 0.15;
                        ctx.beginPath(); ctx.arc(fx, fy, fr, 0, Math.PI * 2); ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                    // 성난 눈
                    ctx.fillStyle = '#FFF';
                    ctx.beginPath(); ctx.arc(cx - 6, cy - 2 + flicker, 4, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx + 6, cy - 2 + flicker, 4, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath(); ctx.arc(cx - 5, cy - 1 + flicker, 2, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx + 7, cy - 1 + flicker, 2, 0, Math.PI * 2); ctx.fill();
                    // 화난 눈썹
                    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(cx - 10, cy - 7 + flicker); ctx.lineTo(cx - 3, cy - 5 + flicker); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(cx + 10, cy - 7 + flicker); ctx.lineTo(cx + 3, cy - 5 + flicker); ctx.stroke();
                    // 입
                    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(cx, cy + 7 + flicker, 6, 0.3, Math.PI - 0.3, true); ctx.stroke();

                } else if (this.type === 'villain-spike') {
                    // 가시왕 — 거대 가시 몬스터
                    // 몸통 (짙은 회색 육각형)
                    ctx.fillStyle = '#5D6D7E';
                    ctx.beginPath();
                    for (let i = 0; i < 6; i++) {
                        const a = i * Math.PI / 3 - Math.PI / 6;
                        const px = cx + Math.cos(a) * 25;
                        const py = cy + Math.sin(a) * 25;
                        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                    }
                    ctx.closePath(); ctx.fill();
                    ctx.strokeStyle = '#2C3E50'; ctx.lineWidth = 2; ctx.stroke();
                    // 가시들 (바깥으로 뾰족)
                    ctx.fillStyle = '#E74C3C';
                    for (let i = 0; i < 8; i++) {
                        const sa = this.frameIndex * 0.05 + i * Math.PI / 4;
                        ctx.save(); ctx.translate(cx, cy); ctx.rotate(sa);
                        ctx.beginPath();
                        ctx.moveTo(-4, -24); ctx.lineTo(0, -38); ctx.lineTo(4, -24);
                        ctx.closePath(); ctx.fill();
                        ctx.restore();
                    }
                    // 무서운 얼굴
                    ctx.fillStyle = '#E74C3C';
                    ctx.beginPath(); ctx.arc(cx - 8, cy - 5, 5, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx + 8, cy - 5, 5, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#FFF';
                    ctx.beginPath(); ctx.arc(cx - 8, cy - 6, 2, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx + 8, cy - 6, 2, 0, Math.PI * 2); ctx.fill();
                    // 이빨 달린 입
                    ctx.fillStyle = '#2C3E50';
                    ctx.beginPath(); ctx.arc(cx, cy + 8, 10, 0, Math.PI, false); ctx.fill();
                    ctx.fillStyle = '#FFF';
                    for (let t = 0; t < 4; t++) {
                        ctx.beginPath();
                        ctx.moveTo(cx - 8 + t * 5, cy + 8);
                        ctx.lineTo(cx - 5.5 + t * 5, cy + 14);
                        ctx.lineTo(cx - 3 + t * 5, cy + 8);
                        ctx.closePath(); ctx.fill();
                    }

                } else if (this.type === 'villain-ghost') {
                    // 유령이 — 투명해졌다 나타나는 유령
                    const ghostAlpha = 0.4 + Math.sin(this.frameIndex * 0.3) * 0.35;
                    const float = Math.sin(this.frameIndex * 0.25) * 8;
                    ctx.globalAlpha = ghostAlpha;
                    // 유령 몸체
                    const ghostGrad = ctx.createRadialGradient(cx, cy - 5 + float, 5, cx, cy + float, 25);
                    ghostGrad.addColorStop(0, '#FFFFFF');
                    ghostGrad.addColorStop(0.6, '#ECF0F1');
                    ghostGrad.addColorStop(1, '#BDC3C7');
                    ctx.fillStyle = ghostGrad;
                    ctx.beginPath();
                    ctx.arc(cx, cy - 8 + float, 22, Math.PI, 0);
                    // 물결치는 아랫단
                    ctx.lineTo(cx + 22, cy + 15 + float);
                    ctx.quadraticCurveTo(cx + 15, cy + 8 + float, cx + 8, cy + 18 + float);
                    ctx.quadraticCurveTo(cx, cy + 10 + float, cx - 8, cy + 18 + float);
                    ctx.quadraticCurveTo(cx - 15, cy + 8 + float, cx - 22, cy + 15 + float);
                    ctx.closePath();
                    ctx.fill();
                    // 무서운 눈 (큰 검은 구멍)
                    ctx.fillStyle = '#2C3E50';
                    ctx.beginPath(); ctx.ellipse(cx - 8, cy - 8 + float, 5, 7, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.ellipse(cx + 8, cy - 8 + float, 5, 7, 0, 0, Math.PI * 2); ctx.fill();
                    // 눈 안 빛
                    ctx.fillStyle = '#E74C3C';
                    ctx.beginPath(); ctx.arc(cx - 7, cy - 8 + float, 2, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx + 9, cy - 8 + float, 2, 0, Math.PI * 2); ctx.fill();
                    // 입 (O형)
                    ctx.fillStyle = '#2C3E50';
                    ctx.beginPath(); ctx.ellipse(cx, cy + 5 + float, 6, 8, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.globalAlpha = 1;

                } else if (this.type === 'villain-dark') {
                    // 다크동 — 동그라미의 어둠 버전 (보스급)
                    const pulse = Math.sin(this.frameIndex * 0.2) * 2;
                    // 어두운 오라
                    ctx.fillStyle = 'rgba(26,26,46,0.3)';
