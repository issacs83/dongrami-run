    <style>
        * {

            -webkit-touch-callout: none;

            overflow: hidden;

        }

        canvas {
            display: block;
            margin: 0 auto;
            background: #87ceeb;

            width: 100%;

            object-fit: contain;
        }

        #gameContainer {
            width: 100%;
            height: 100%;

<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        // roundRect 폴리필 (구형 브라우저 호환)
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (typeof r === 'number') r = [r, r, r, r];
                if (Array.isArray(r) && r.length === 1) r = [r[0], r[0], r[0], r[0]];
                const [tl, tr, br, bl] = r;
                this.moveTo(x + tl, y);
                this.lineTo(x + w - tr, y);
                this.arcTo(x + w, y, x + w, y + tr, tr);
                this.lineTo(x + w, y + h - br);
                this.arcTo(x + w, y + h, x + w - br, y + h, br);
                this.lineTo(x + bl, y + h);
                this.arcTo(x, y + h, x, y + h - bl, bl);
                this.lineTo(x, y + tl);
                this.arcTo(x, y, x + tl, y, tl);
                this.closePath();
                return this;
            };
        }

        /*
        ═══════════════════════════════════════════════════════════════════════════════
        동그라미 런 (Dongrami Run) - Enhanced Runner Game

        캐릭터 스프라이트 교체 가이드:
        ─────────────────────────────────────────────────────────────────────────────
        각 캐릭터는 canvas에 그려집니다. PNG 스프라이트로 교체하려면:

        spriteConfig.sprites['캐릭터명'].spriteSheet = 'path/to/sprite.png'
        frameWidth: 64, frameHeight: 64 (새로운 크기)
        frameCount: 4 (달리기 프레임 수)

        ═══════════════════════════════════════════════════════════════════════════════
        */

        // ============================================================================
        // GAME CONFIGURATION
        // ============================================================================
        const GAME_CONFIG = {
            width: 1024,
            height: 576,
            groundY: 576 * 0.82,  // 82% down the screen
            playerStartX: 80,
            playerSize: 64,
            initialSpeed: 4.5,
            maxSpeed: 12,
            speedIncrease: 0.0001,
            gravity: 0.42,
            jumpPower: -14.5,
            obstacleMinGap: 450,
        };

        // ============================================================================
        // SPRITE CONFIGURATION - All drawn with canvas
        // ============================================================================
        const spriteConfig = {
            sprites: {
                동그라미: {
                    name: '동그라미',
                    colors: { main: '#FF4444', secondary: '#FFFFFF' },
                    size: 64,
                    drawSprite: function(ctx, x, y, frameIndex, isJumping, isDucking) {
                        ctx.save();
                        ctx.translate(x + 32, y + 32);

                        // Body - big red circle
                        ctx.fillStyle = '#FF4444';
                        ctx.beginPath();
                        ctx.arc(0, 0, 28, 0, Math.PI * 2);
                        ctx.fill();

                        // Dark outline
                        ctx.strokeStyle = '#CC0000';
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        // White eyes
                        ctx.fillStyle = '#FFFFFF';
                        ctx.beginPath();
                        ctx.arc(-10, -8, 6, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(10, -8, 6, 0, Math.PI * 2);
                        ctx.fill();

                        // Black pupils - 오른쪽(앞)을 바라봄
                        ctx.fillStyle = '#000000';
                        let pupilX = 2;
                        ctx.beginPath();
                        ctx.arc(-10 + pupilX, -8, 3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(10 + pupilX, -8, 3, 0, Math.PI * 2);
                        ctx.fill();

                        // Rosy cheeks
                        ctx.fillStyle = 'rgba(255, 180, 180, 0.6)';
                        ctx.beginPath();
                        ctx.arc(-18, 5, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(18, 5, 5, 0, Math.PI * 2);
                        ctx.fill();

                        // Happy smile
                        ctx.strokeStyle = '#000000';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(0, 8, 8, 0, Math.PI, false);
                        ctx.stroke();

                        // Legs
                        if (!isDucking) {
                            let legOffset = Math.sin(frameIndex * 0.3) * 3;
                            ctx.fillStyle = '#FF6666';
                            // Left leg
                            ctx.fillRect(-8, 24 + legOffset, 4, 10);
                            // Right leg
                            ctx.fillRect(4, 24 - legOffset, 4, 10);
                        }

                        ctx.restore();
                    },
                    cost: 0,
                    hitbox: { offsetX: 10, offsetY: 10, width: 44, height: 44 }
                },

                네모미: {
                    name: '네모미',
                    colors: { main: '#4AACBB', secondary: '#FFFFFF' },
                    size: 64,
                    drawSprite: function(ctx, x, y, frameIndex, isJumping, isDucking) {
                        ctx.save();
                        ctx.translate(x + 32, y + 32);

                        // Body - teal square with rounded corners
                        ctx.fillStyle = '#4AACBB';
                        ctx.beginPath();
                        ctx.roundRect(-24, -24, 48, 48, 6);
                        ctx.fill();

                        // Dark outline
                        ctx.strokeStyle = '#1A7A8A';
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        // Eyes
                        ctx.fillStyle = '#FFFFFF';
                        ctx.beginPath();
                        ctx.arc(-10, -8, 6, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(10, -8, 6, 0, Math.PI * 2);
                        ctx.fill();

                        // Pupils
                        ctx.fillStyle = '#000000';
                        ctx.beginPath();
                        ctx.arc(-10, -8, 3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(10, -8, 3, 0, Math.PI * 2);
                        ctx.fill();

                        // Mouth
                        ctx.strokeStyle = '#000000';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.rect(-6, 6, 12, 6);
                        ctx.stroke();

                        // Small feet
                        if (!isDucking) {
                            ctx.fillStyle = '#1A7A8A';
                            ctx.fillRect(-10, 22, 5, 8);
                            ctx.fillRect(5, 22, 5, 8);
                        }

                        ctx.restore();
                    },
                    cost: 300,
                    hitbox: { offsetX: 10, offsetY: 10, width: 44, height: 44 }
                },

                별미: {
                    name: '별미',
                    colors: { main: '#FFD700', secondary: '#FFA500' },
                    size: 64,
                    drawSprite: function(ctx, x, y, frameIndex, isJumping, isDucking) {
                        ctx.save();
                        ctx.translate(x + 32, y + 32);
                        ctx.rotate(Math.sin(frameIndex * 0.1) * 0.1);

                        // Draw star
                        ctx.fillStyle = '#FFD700';
                        ctx.beginPath();
                        for (let i = 0; i < 5; i++) {
                            let angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
                            let px = Math.cos(angle) * 24;
                            let py = Math.sin(angle) * 24;
                            if (i === 0) ctx.moveTo(px, py);
                            else ctx.lineTo(px, py);

                            angle = ((i + 0.5) * 4 * Math.PI) / 5 - Math.PI / 2;
                            px = Math.cos(angle) * 12;
                            py = Math.sin(angle) * 12;
                            ctx.lineTo(px, py);
                        }
                        ctx.closePath();
                        ctx.fill();

                        // Dark outline
                        ctx.strokeStyle = '#FFA500';
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        // Eyes
                        ctx.fillStyle = '#000000';
                        ctx.beginPath();
                        ctx.arc(-8, -5, 4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(8, -5, 4, 0, Math.PI * 2);
                        ctx.fill();

                        // Smile
                        ctx.strokeStyle = '#000000';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(0, 6, 6, 0, Math.PI, false);
                        ctx.stroke();

                        ctx.restore();
                    },
                    cost: 300,
                    hitbox: { offsetX: 10, offsetY: 10, width: 44, height: 44 }
                },

                삼각미: {
                    name: '삼각미',
                    colors: { main: '#22BB22', secondary: '#11AA11' },
                    size: 64,
                    drawSprite: function(ctx, x, y, frameIndex, isJumping, isDucking) {
                        ctx.save();
                        ctx.translate(x + 32, y + 32);

                        // Draw triangle
                        ctx.fillStyle = '#22BB22';
                        ctx.beginPath();
                        ctx.moveTo(0, -28);
                        ctx.lineTo(26, 20);
                        ctx.lineTo(-26, 20);
                        ctx.closePath();
                        ctx.fill();

                        // Dark outline
                        ctx.strokeStyle = '#11AA11';
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        // Eyes
                        ctx.fillStyle = '#FFFFFF';
                        ctx.beginPath();
                        ctx.arc(-8, -5, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(8, -5, 5, 0, Math.PI * 2);
                        ctx.fill();

                        // Pupils
                        ctx.fillStyle = '#000000';
                        ctx.beginPath();
                        ctx.arc(-8, -5, 3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(8, -5, 3, 0, Math.PI * 2);
                        ctx.fill();

                        // Mouth
                        ctx.strokeStyle = '#000000';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(0, 8, 6, 0, Math.PI, false);
                        ctx.stroke();

                        ctx.restore();
                    },
                    cost: 300,
                    hitbox: { offsetX: 10, offsetY: 10, width: 44, height: 44 }
                },

                하트미: {
                    name: '하트미',
                    colors: { main: '#FF69B4', secondary: '#FF1493' },
                    size: 64,
                    drawSprite: function(ctx, x, y, frameIndex, isJumping, isDucking) {
                        ctx.save();
                        ctx.translate(x + 32, y + 32);
                        let pulse = 1 + Math.sin(frameIndex * 0.2) * 0.15;
                        ctx.scale(pulse, pulse);

                        // Draw heart shape
                        ctx.fillStyle = '#FF69B4';
                        ctx.beginPath();
                        ctx.moveTo(0, -6);
                        ctx.bezierCurveTo(-24, -30, -28, -22, -28, -8);
                        ctx.bezierCurveTo(-28, 4, -14, 18, 0, 28);
                        ctx.bezierCurveTo(14, 18, 28, 4, 28, -8);
                        ctx.bezierCurveTo(28, -22, 24, -30, 0, -6);
                        ctx.closePath();
                        ctx.fill();

                        // Dark outline
                        ctx.strokeStyle = '#FF1493';
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        // Eyes
                        ctx.fillStyle = '#000000';
                        ctx.beginPath();
                        ctx.arc(-8, -8, 4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(8, -8, 4, 0, Math.PI * 2);
                        ctx.fill();

                        // Smile
                        ctx.strokeStyle = '#000000';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(0, 4, 6, 0, Math.PI, false);
                        ctx.stroke();

                        ctx.restore();
                    },
                    cost: 500,
                    hitbox: { offsetX: 10, offsetY: 10, width: 44, height: 44 }
                },

                김여름: {
                    name: '김여름',
                    colors: { main: '#FFD700', secondary: '#FF8C00' },
                    size: 64,
                    hidden: true, // 히든 캐릭터
                    drawSprite: function(ctx, x, y, frameIndex, isJumping, isDucking) {
                        ctx.save();
                        ctx.translate(x + 32, y + 32);
                        const glow = 1 + Math.sin(frameIndex * 0.15) * 0.08;
                        ctx.scale(glow, glow);

                        // 태양 광선 (8개, 회전)
                        const rayAngle = frameIndex * 0.03;
                        ctx.fillStyle = '#FFD700';
                        for (let i = 0; i < 8; i++) {
                            const angle = rayAngle + (i * Math.PI / 4);
                            ctx.save();
                            ctx.rotate(angle);
                            ctx.beginPath();
                            ctx.moveTo(-5, -20);
                            ctx.lineTo(0, -32);
                            ctx.lineTo(5, -20);
                            ctx.closePath();
                            ctx.fill();
                            ctx.restore();
                        }

                        // 태양 본체 (그라데이션)
                        const sunGrad = ctx.createRadialGradient(0, 0, 5, 0, 0, 22);
                        sunGrad.addColorStop(0, '#FFEE44');
                        sunGrad.addColorStop(0.6, '#FFD700');
                        sunGrad.addColorStop(1, '#FF8C00');
                        ctx.fillStyle = sunGrad;
                        ctx.beginPath();
                        ctx.arc(0, 0, 22, 0, Math.PI * 2);
                        ctx.fill();

                        // 태양 테두리
                        ctx.strokeStyle = '#FF6600';
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        // 선글라스 (쿨한 히든 캐릭터)
                        ctx.fillStyle = '#222222';
                        ctx.beginPath();
                        ctx.roundRect(-16, -10, 12, 8, 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.roundRect(4, -10, 12, 8, 2);
                        ctx.fill();
                        // 선글라스 다리
                        ctx.strokeStyle = '#222222';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(-4, -6);
                        ctx.lineTo(4, -6);
                        ctx.stroke();

                        // 자신감 넘치는 미소
                        ctx.strokeStyle = '#CC4400';
                        ctx.lineWidth = 2.5;
                        ctx.beginPath();
                        ctx.arc(0, 4, 8, 0.1, Math.PI - 0.1, false);
                        ctx.stroke();

                        // 점프 시 불꽃 이펙트
                        if (isJumping) {
                            ctx.fillStyle = 'rgba(255,100,0,0.6)';
                            for (let i = 0; i < 5; i++) {
                                const fa = (frameIndex * 0.1 + i * 1.2);
                                const fx = Math.cos(fa) * 28;
                                const fy = Math.sin(fa) * 28;
                                ctx.beginPath();
                                ctx.arc(fx, fy, 3, 0, Math.PI * 2);
                                ctx.fill();
                            }
                        }

                        ctx.restore();
                    },
                    cost: 1000,
                    hitbox: { offsetX: 8, offsetY: 8, width: 48, height: 48 }
                }
            }
        };

        // ============================================================================
        // GAME STATE
        // ============================================================================
        const gameState = {
            score: 0,
            coins: 0,
            coinsEarned: 0,
            lives: 3,          // 하트 3개
            maxLives: 3,
            invulnTimer: 0,    // 피격 후 무적 시간
            bestScore: parseInt(localStorage.getItem('bestScore')) || 0,
            bestCoins: parseInt(localStorage.getItem('bestCoins')) || 0,
            bestSpeedLevel: parseInt(localStorage.getItem('bestSpeedLevel')) || 0,
            totalCoins: parseInt(localStorage.getItem('totalCoins')) || 300,
            totalGames: parseInt(localStorage.getItem('totalGames')) || 0,
            gameSpeed: GAME_CONFIG.initialSpeed,
            speedLevel: 0,
            isRunning: false,
            isPaused: false,
            currentScene: 'title',
            selectedCharacter: (() => {
                const saved = localStorage.getItem('selectedCharacter');
                // 이전 버전 호환: 저장된 캐릭터가 현재 스프라이트에 없으면 기본값 사용
                return (saved && spriteConfig.sprites[saved]) ? saved : Object.keys(spriteConfig.sprites)[0];
            })(),
            unlockedCharacters: (() => {
                const saved = JSON.parse(localStorage.getItem('unlockedCharacters') || 'null');
                const firstKey = Object.keys(spriteConfig.sprites)[0];
                return (saved && Array.isArray(saved)) ? saved : [firstKey];
            })(),
            gameStartTime: 0,
            gameTime: 0,
            winterCount: 0,      // 겨울을 지난 횟수
            seasonLevel: 0,      // 겨울 통과 보너스 레벨 (0.5씩 증가)
        };

        // ============================================================================
        // AUDIO MANAGER
        // ============================================================================
        class AudioManager {
            constructor() {
                this.audioContext = null;
                this.masterGain = null;
                this.initAudio();
            }

            initAudio() {
                if (!window.AudioContext && !window.webkitAudioContext) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.audioContext = new AudioContext();
                this.masterGain = this.audioContext.createGain();
                this.masterGain.gain.value = 0.3;
                this.masterGain.connect(this.audioContext.destination);
            }

            playJumpSound() {
                if (!this.audioContext) return;
                const now = this.audioContext.currentTime;
                const osc = this.audioContext.createOscillator();
                const gain = this.audioContext.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start(now);
                osc.stop(now + 0.1);
            }

            playCoinSound() {
                if (!this.audioContext) return;
                const now = this.audioContext.currentTime;
                const osc = this.audioContext.createOscillator();
                const gain = this.audioContext.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start(now);
                osc.stop(now + 0.15);
            }

            playGameOverSound() {
                if (!this.audioContext) return;
                const now = this.audioContext.currentTime;
                const notes = [400, 300, 200];
                notes.forEach((freq, i) => {
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();

                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, now + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.15);

                    osc.connect(gain);
                    gain.connect(this.masterGain);
                    osc.start(now + i * 0.1);
                    osc.stop(now + i * 0.1 + 0.15);
                });
            }

            playPowerUpSound() {
                if (!this.audioContext) return;
                const now = this.audioContext.currentTime;
                const notes = [800, 1000, 1200];
                notes.forEach((freq, i) => {
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();

                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.15, now + i * 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.05 + 0.1);

                    osc.connect(gain);
                    gain.connect(this.masterGain);
                    osc.start(now + i * 0.05);
                    osc.stop(now + i * 0.05 + 0.1);
                });
            }

            playSeasonChangeSound(season) {
                if (!this.audioContext) return;
                const now = this.audioContext.currentTime;
                const chords = {
                    spring: [523, 659, 784], // C E G (밝은 메이저)
                    summer: [587, 740, 880], // D F# A (활기찬)
                    autumn: [440, 523, 659], // A C E (차분한 마이너)
                    winter: [392, 494, 587]  // G B D (서정적)
                };
                const chord = chords[season] || chords.spring;
                chord.forEach((freq, i) => {
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.12, now + 0.15);
                    gain.gain.linearRampToValueAtTime(0.08, now + 0.8);
                    gain.gain.linearRampToValueAtTime(0, now + 1.5);
                    osc.connect(gain);
                    gain.connect(this.masterGain);
                    osc.start(now + i * 0.08);
                    osc.stop(now + 1.6);
                });
            }
        }

        // ============================================================================
        // SEASONAL BGM SYSTEM - 계절별 프로시저럴 배경음악
        // ============================================================================
        class SeasonalBGM {
            constructor(audioManager) {
                this.am = audioManager;
                this.currentSeason = null;
                this.bgmNodes = []; // 현재 재생 중인 노드들
                this.bgmGain = null; // BGM 전용 gain
                this.fadeGain = null; // 크로스페이드용 gain
                this.nextBeatTime = 0;
                this.beatIndex = 0;
                this.bpm = 120;
                this.isPlaying = false;
                this.targetVolume = 0.10; // BGM 볼륨 (효과음보다 낮게)
                this.seasonTransitionOverlay = null; // { season, timer, maxTime }

                // 계절별 음악 패턴 정의
                this.patterns = {
                    spring: {
                        // 봄: 밝고 경쾌한 멜로디 (C 메이저, 빠른 템포)
                        bpm: 138,
                        scale: [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25],
                        melody: [0,2,4,5, 4,2,3,4, 5,4,2,0, 2,4,5,7],
                        bass: [0,0,3,3, 5,5,4,4],
                        waveType: 'triangle',
                        bassType: 'sine',
                        melodyVol: 0.09,
                        bassVol: 0.05,
                        arpeggio: true
                    },
                    summer: {
                        // 여름: 활기차고 리드미컬 (D 메이저, 가장 빠름)
                        bpm: 150,
                        scale: [293.66, 329.63, 369.99, 392.00, 440.00, 493.88, 554.37, 587.33],
                        melody: [0,4,2,5, 7,5,4,2, 0,2,4,7, 5,4,2,0],
                        bass: [0,0,4,4, 5,5,2,2],
                        waveType: 'square',
                        bassType: 'triangle',
                        melodyVol: 0.06,
                        bassVol: 0.04,
                        arpeggio: false
                    },
                    autumn: {
                        // 가을: 차분하고 서정적 (A 마이너, 느린 템포)
                        bpm: 108,
                        scale: [220.00, 246.94, 261.63, 293.66, 329.63, 349.23, 392.00, 440.00],
                        melody: [0,2,4,7, 5,4,2,0, 3,5,7,5, 4,2,0,2],
                        bass: [0,0,3,3, 5,5,4,4],
                        waveType: 'triangle',
                        bassType: 'sine',
                        melodyVol: 0.08,
                        bassVol: 0.05,
                        arpeggio: false
                    },
                    winter: {
                        // 겨울: 고요하고 신비로운 (E 마이너, 가장 느림)
                        bpm: 96,
                        scale: [164.81, 185.00, 196.00, 220.00, 246.94, 261.63, 293.66, 329.63],
                        melody: [0,3,5,7, 5,3,2,0, 4,5,7,5, 3,2,0,3],
                        bass: [0,0,2,2, 4,4,3,3],
                        waveType: 'sine',
                        bassType: 'sine',
                        melodyVol: 0.08,
                        bassVol: 0.06,
                        arpeggio: true
                    }
                };
            }

            start(season) {
                if (!this.am.audioContext) return;
                this.isPlaying = true;
                this.currentSeason = season;
                this.beatIndex = 0;
                this._ensureGain();
                this.bgmGain.gain.setValueAtTime(this.targetVolume, this.am.audioContext.currentTime);
                this.nextBeatTime = this.am.audioContext.currentTime + 0.1;
            }

            stop() {
                this.isPlaying = false;
                if (this.bgmGain && this.am.audioContext) {
                    try {
                        this.bgmGain.gain.linearRampToValueAtTime(0, this.am.audioContext.currentTime + 0.5);
                    } catch(e) {}
                }
            }

            _ensureGain() {
                if (!this.bgmGain || !this.am.audioContext) {
                    if (!this.am.audioContext) return;
                    this.bgmGain = this.am.audioContext.createGain();
                    this.bgmGain.gain.value = this.targetVolume;
                    this.bgmGain.connect(this.am.masterGain);
                }
            }

            changeSeason(newSeason) {
                if (!this.am.audioContext || newSeason === this.currentSeason) return;
                const ctx = this.am.audioContext;
                const now = ctx.currentTime;

                // 크로스페이드: 현재 음악 페이드아웃
                if (this.bgmGain) {
                    this.bgmGain.gain.cancelScheduledValues(now);
                    this.bgmGain.gain.setValueAtTime(this.bgmGain.gain.value, now);
                    this.bgmGain.gain.linearRampToValueAtTime(0, now + 1.5);
                }

                // 새 gain 노드 생성해서 페이드인
                const oldGain = this.bgmGain;
                this.bgmGain = ctx.createGain();
                this.bgmGain.gain.setValueAtTime(0, now);
                this.bgmGain.gain.linearRampToValueAtTime(this.targetVolume, now + 2.0);
                this.bgmGain.connect(this.am.masterGain);

                // 이전 gain은 2초 후 자동 정리
                setTimeout(() => {
                    try { oldGain.disconnect(); } catch(e) {}
                }, 3000);

                this.currentSeason = newSeason;
                this.beatIndex = 0;
                this.nextBeatTime = now + 0.5; // 크로스페이드 중 약간 딜레이 후 시작

                // 계절 전환 오버레이 설정
                this.seasonTransitionOverlay = { season: newSeason, timer: 4.0, maxTime: 4.0 };

                // 전환 효과음
                this.am.playSeasonChangeSound(newSeason);
            }

            update(deltaTime) {
                if (!this.isPlaying || !this.am.audioContext) return;
                const ctx = this.am.audioContext;
                const now = ctx.currentTime;
                const pattern = this.patterns[this.currentSeason];
                if (!pattern) return;

                const beatDuration = 60 / pattern.bpm;

                // 스케줄링: 현재 시간보다 앞선 비트들을 예약
                while (this.nextBeatTime < now + 0.2) {
                    this._playBeat(pattern, this.nextBeatTime, beatDuration);
                    this.beatIndex = (this.beatIndex + 1) % pattern.melody.length;
                    this.nextBeatTime += beatDuration;
                }

                // 오버레이 타이머 업데이트
                if (this.seasonTransitionOverlay) {
                    this.seasonTransitionOverlay.timer -= deltaTime;
                    if (this.seasonTransitionOverlay.timer <= 0) {
                        this.seasonTransitionOverlay = null;
                    }
                }
            }

            _playBeat(pattern, time, duration) {
                if (!this.am.audioContext) return;
                const ctx = this.am.audioContext;
                this._ensureGain();

                // 멜로디 노트
                const noteIdx = pattern.melody[this.beatIndex];
                const freq = pattern.scale[noteIdx];

                if (pattern.arpeggio && this.beatIndex % 2 === 0) {
                    // 아르페지오: 2개 음을 빠르게
                    const freq2 = pattern.scale[Math.min(noteIdx + 2, pattern.scale.length - 1)];
                    this._playNote(freq, time, duration * 0.45, pattern.waveType, pattern.melodyVol);
                    this._playNote(freq2, time + duration * 0.5, duration * 0.45, pattern.waveType, pattern.melodyVol * 0.7);
                } else {
                    this._playNote(freq, time, duration * 0.8, pattern.waveType, pattern.melodyVol);
                }

                // 베이스 (4비트마다)
                if (this.beatIndex % 2 === 0) {
                    const bassIdx = pattern.bass[Math.floor(this.beatIndex / 2) % pattern.bass.length];
                    const bassFreq = pattern.scale[bassIdx] / 2; // 옥타브 아래
                    this._playNote(bassFreq, time, duration * 1.8, pattern.bassType, pattern.bassVol);
                }
            }

            _playNote(freq, time, duration, waveType, volume) {
                const ctx = this.am.audioContext;
                if (!ctx || !this.bgmGain) return;

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = waveType;
                osc.frequency.setValueAtTime(freq, time);

                // 부드러운 어택/릴리즈 (ADSR)
                gain.gain.setValueAtTime(0, time);
                gain.gain.linearRampToValueAtTime(volume, time + 0.02);
                gain.gain.setValueAtTime(volume, time + duration * 0.6);
                gain.gain.linearRampToValueAtTime(0, time + duration);

                osc.connect(gain);
                gain.connect(this.bgmGain);
                osc.start(time);
                osc.stop(time + duration + 0.05);
            }

            // 계절 전환 오버레이 그리기
            drawOverlay(ctx) {
                if (!this.seasonTransitionOverlay) return;

                const ov = this.seasonTransitionOverlay;
                const progress = 1 - (ov.timer / ov.maxTime); // 0→1
                const fadeIn = Math.min(1, progress * 3); // 처음 0.33 동안 페이드인
                const fadeOut = Math.min(1, ov.timer / 1.0); // 마지막 1초 페이드아웃
                const alpha = Math.min(fadeIn, fadeOut);

                if (alpha <= 0.01) return;

                const W = GAME_CONFIG.width;
                const H = GAME_CONFIG.height;

                ctx.save();
                ctx.globalAlpha = alpha;

                // 계절별 오버레이 색상 + 이모지
                const overlayColors = {
                    spring: { top: 'rgba(255,192,203,0.25)', bot: 'rgba(255,255,255,0.05)', emoji: '🌸', text: '봄이 왔어요!', particles: '🌷🌼🦋' },
                    summer: { top: 'rgba(255,200,0,0.20)', bot: 'rgba(135,206,235,0.05)', emoji: '☀️', text: '여름이 왔어요!', particles: '🌻🌊🦎' },
                    autumn: { top: 'rgba(255,140,0,0.25)', bot: 'rgba(139,69,19,0.05)', emoji: '🍂', text: '가을이 왔어요!', particles: '🍁🌰🍄' },
                    winter: { top: 'rgba(100,149,237,0.25)', bot: 'rgba(255,255,255,0.10)', emoji: '❄️', text: '겨울이 왔어요!', particles: '⛄🌨️💎' }
                };
                const oc = overlayColors[ov.season] || overlayColors.spring;

                // 그라데이션 오버레이
                const grad = ctx.createLinearGradient(0, 0, 0, H);
                grad.addColorStop(0, oc.top);
                grad.addColorStop(1, oc.bot);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                // 중앙 배너 (계절 배너보다 더 화려하게)
                const bannerAlpha = alpha * 0.92;
                ctx.globalAlpha = bannerAlpha;

                const bw = 500, bh = 120;
                const bx = W / 2 - bw / 2;
                const by = H / 2 - bh / 2 - 30;

                // 배너 배경 (그라데이션 + 둥근 모서리)
                const bannerGrad = ctx.createLinearGradient(bx, by, bx, by + bh);
                bannerGrad.addColorStop(0, 'rgba(0,0,0,0.75)');
                bannerGrad.addColorStop(1, 'rgba(0,0,0,0.55)');
                ctx.fillStyle = bannerGrad;
                ctx.beginPath();
                ctx.roundRect(bx, by, bw, bh, 20);
                ctx.fill();

                // 배너 테두리 (계절색)
                const borderColors = { spring: '#FF69B4', summer: '#FFD700', autumn: '#FF8C00', winter: '#87CEEB' };
                ctx.strokeStyle = borderColors[ov.season] || '#FFFFFF';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.roundRect(bx, by, bw, bh, 20);
                ctx.stroke();

                // 이모지 + 텍스트
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 44px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(`${oc.emoji} ${oc.text} ${oc.emoji}`, W / 2, by + bh * 0.45);

                // 음표 아이콘 표시 (음악 바뀐다는 표시)
                ctx.font = '20px Arial';
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.fillText(`♪ ♫ 배경음악이 바뀝니다 ♫ ♪`, W / 2, by + bh * 0.82);

                // 떨어지는 파티클 이모지 (계절 분위기)
                const particleEmojis = oc.particles.match(/./gu) || [];
                ctx.font = '28px Arial';
                const time = (ov.maxTime - ov.timer) * 2;
                for (let i = 0; i < 8; i++) {
                    const emoji = particleEmojis[i % particleEmojis.length];
                    const px = (W * 0.1) + (i * W * 0.11) + Math.sin(time + i * 1.5) * 30;
                    const py = ((time * 60 + i * 80) % (H + 40)) - 20;
                    ctx.globalAlpha = bannerAlpha * 0.6;
                    ctx.fillText(emoji, px, py);
                }

                ctx.restore();
            }
        }

        // ============================================================================
        // INPUT MANAGER - FIXED TOUCH HANDLING
        // ============================================================================
        class InputManager {
            constructor() {
                this.keys = {};
                this.jumping = false;
                this.ducking = false;
                this.jumpPressed = false;
                this.touchStartY = 0;
                this.lastTouchX = undefined;
                this.lastTouchY = undefined;
                this.setupListeners();
            }

            setupListeners() {
                document.addEventListener('keydown', (e) => {
                    this.keys[e.key] = true;
                    if (e.key === ' ') {
                        e.preventDefault();
                        if (!this.jumpPressed) {
                            this.jumping = true;
                            this.jumpPressed = true;
                        }
                    }
                    if (e.key === 'ArrowDown') {
                        this.ducking = true;
                    }
                });

                document.addEventListener('keyup', (e) => {
                    this.keys[e.key] = false;
                    if (e.key === ' ') {
                        this.jumpPressed = false;
                    }
                    if (e.key === 'ArrowDown') {
                        this.ducking = false;
                    }
                });

                // Touch jump
                const canvas = document.getElementById('gameCanvas');
                canvas.addEventListener('touchstart', (e) => {
                    this.touchStartY = e.touches[0].clientY;
                    // 캔버스 좌표 변환
                    const rect = canvas.getBoundingClientRect();
                    const scaleX = GAME_CONFIG.width / rect.width;
                    const scaleY = GAME_CONFIG.height / rect.height;
                    this.lastTouchX = (e.touches[0].clientX - rect.left) * scaleX;
                    this.lastTouchY = (e.touches[0].clientY - rect.top) * scaleY;
                    if (!this.jumpPressed) {
                        this.jumping = true;
                        this.jumpPressed = true;
                    }
                    e.preventDefault();
                });

                canvas.addEventListener('touchmove', (e) => {
                    if (e.touches.length > 0) {
                        const deltaY = e.touches[0].clientY - this.touchStartY;
                        if (deltaY > 50) {
                            this.ducking = true;
                        }
                    }
                });

                canvas.addEventListener('touchend', (e) => {
                    this.jumpPressed = false;
                    this.ducking = false;
                    e.preventDefault();
                });

                // Mouse click for jump
                canvas.addEventListener('click', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const scaleX = GAME_CONFIG.width / rect.width;
                    const scaleY = GAME_CONFIG.height / rect.height;
                    this.lastTouchX = (e.clientX - rect.left) * scaleX;
                    this.lastTouchY = (e.clientY - rect.top) * scaleY;
                    if (!this.jumpPressed) {
                        this.jumping = true;
                        this.jumpPressed = true;
                        setTimeout(() => {
                            this.jumpPressed = false;
                        }, 100);
                    }
                });
            }

            getInputState() {
                return {
                    jumping: this.jumping,
                    ducking: this.ducking
                };
            }

            resetJump() {
                this.jumping = false;
            }
        }

        // ============================================================================
        // PARTICLE SYSTEM
        // ============================================================================
        class ParticleSystem {
            constructor() {
                this.particles = [];
            }

            createExplosion(x, y, color, count = 8) {
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2;
                    const vx = Math.cos(angle) * 3;
                    const vy = Math.sin(angle) * 3 - 2;
                    this.particles.push({
                        x, y, vx, vy, life: 1, color,
                        size: Math.random() * 3 + 2
                    });
                }
            }

            update(deltaTime) {
                this.particles = this.particles.filter(p => p.life > 0);
                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.2;
                    p.life -= 0.02;
                });
            }

            draw(ctx) {
                this.particles.forEach(p => {
                    ctx.save();
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });
            }
        }

        // ============================================================================
        // PLAYER CLASS
        // ============================================================================
        class Player {
            constructor(characterName) {
                // 캐릭터가 없으면 첫 번째 캐릭터로 폴백
                const spriteKeys = Object.keys(spriteConfig.sprites);
                this.character = spriteConfig.sprites[characterName] || spriteConfig.sprites[spriteKeys[0]];
                this.x = GAME_CONFIG.playerStartX;
                this.y = GAME_CONFIG.groundY - GAME_CONFIG.playerSize;
                this.width = GAME_CONFIG.playerSize;
                this.height = GAME_CONFIG.playerSize;
                this.velocityY = 0;
                this.isJumping = false;
                this.isDucking = false;
                this.frameIndex = 0;
                this.doubleJumpAvailable = false;
                this.activePowerUp = null;
                this.powerUpTimer = 0;

                this.hitbox = this.character.hitbox || { offsetX: 10, offsetY: 10, width: 44, height: 44 };
            }

            update(inputState, deltaTime) {
                // Jump
                if (inputState.jumping && !this.isJumping && !this.isDucking) {
                    this.velocityY = GAME_CONFIG.jumpPower;
                    this.isJumping = true;
                    this.doubleJumpAvailable = true;
                    audioManager.playJumpSound();
                } else if (inputState.jumping && this.doubleJumpAvailable && this.isJumping) {
                    this.velocityY = GAME_CONFIG.jumpPower;
                    this.doubleJumpAvailable = false;
                    audioManager.playJumpSound();
                }

                // Duck
                this.isDucking = inputState.ducking && !this.isJumping;

                // Apply gravity
                this.velocityY += GAME_CONFIG.gravity;
                this.y += this.velocityY;

                // Ground collision
                if (this.y + this.height >= GAME_CONFIG.groundY) {
                    this.y = GAME_CONFIG.groundY - this.height;
                    this.velocityY = 0;
                    this.isJumping = false;
                }

                // Animation
                this.frameIndex = (this.frameIndex + 0.15) % 100;

                // Power-up timer
                if (this.activePowerUp) {
                    this.powerUpTimer -= deltaTime;
                    if (this.powerUpTimer <= 0) {
                        this.activePowerUp = null;
                    }
                }
            }

            getHitbox() {
                return {
                    x: this.x + this.hitbox.offsetX,
                    y: this.y + this.hitbox.offsetY,
                    width: this.hitbox.width,
                    height: this.hitbox.height
                };
            }

            draw(ctx) {
                // 무적 상태일 때 캐릭터 깜빡임 효과
                if (gameState.invulnTimer > 0) {
                    const blinkRate = Math.floor(Date.now() / 100) % 2;
                    ctx.globalAlpha = blinkRate === 0 ? 0.3 : 1.0;
                }

                if (this.character && this.character.drawSprite) {
                    try {
                        this.character.drawSprite(ctx, this.x, this.y, this.frameIndex, this.isJumping, this.isDucking);
                    } catch(e) {
                        // 폴백: 빨간 원
                        ctx.fillStyle = '#FF4444';
                        ctx.beginPath();
                        ctx.arc(this.x + 32, this.y + 32, 28, 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else {
                    // drawSprite 없을 때 폴백
                    ctx.fillStyle = '#FF4444';
                    ctx.beginPath();
                    ctx.arc(this.x + 32, this.y + 32, 28, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FFF';
                    ctx.font = '14px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('?', this.x + 32, this.y + 36);
                }

                // 무적 깜빡임 후 알파 복원
                ctx.globalAlpha = 1.0;

                // Power-up indicator
                if (this.activePowerUp) {
                    ctx.save();
                    ctx.strokeStyle = '#FFD700';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(this.x + this.width / 2, this.y - 10, 28, 0, Math.PI * 2);
                    ctx.stroke();

                    const progress = this.powerUpTimer / 5;
                    ctx.strokeStyle = '#FF6600';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(this.x + this.width / 2, this.y - 10, 25, -Math.PI / 2, -Math.PI / 2 + progress * Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }
            }
        }

                    'mushroom':     { w: 45, h: 55,  y: GAME_CONFIG.groundY - 55,  color: '#FF4444' },
                    // 나무 그루터기
                    'stump':        { w: 55, h: 45,  y: GAME_CONFIG.groundY - 45,  color: '#8B5E3C' },
                };

                const def = defs[type] || defs['cactus-small'];
                this.width = def.w;
                this.height = def.h;
                this.y = def.y;
                this.color = def.color;

                this.hitbox = {
                    offsetX: 8,
                    offsetY: 8,
                    width: this.width - 16,
                    height: this.height - 16
                };

                this.frameIndex = 0;
            }

            update(gameSpeed, deltaTime) {
                this.x -= gameSpeed;
                this.frameIndex += 0.1;
            }

            getHitbox() {
                return {
                    x: this.x + this.hitbox.offsetX,
                    y: this.y + this.hitbox.offsetY,
                    width: this.hitbox.width,
                    height: this.hitbox.height
                };
            }

            draw(ctx) {
                ctx.save();
                const cx = this.x + this.width / 2;
                const cy = this.y + this.height / 2;

                if (this.type.includes('bird')) {
                    // 새 (크게)
                    const bw = this.width * 0.45, bh = this.height * 0.4;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.ellipse(cx - 5, cy, bw, bh, 0, 0, Math.PI * 2);
                    ctx.fill();
                    // 머리
                    ctx.beginPath();
                    ctx.arc(cx + bw - 2, cy - 3, bh * 0.8, 0, Math.PI * 2);
                    ctx.fill();
                    // 눈
                    ctx.fillStyle = '#FFF';
                    ctx.beginPath();
                    ctx.arc(cx + bw + 2, cy - 5, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(cx + bw + 3, cy - 5, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    // 부리
                    ctx.fillStyle = '#FF6600';
                    ctx.beginPath();
                    ctx.moveTo(cx + bw + 12, cy - 2);
                    ctx.lineTo(cx + bw + 5, cy - 6);
                    ctx.lineTo(cx + bw + 5, cy + 2);
                    ctx.closePath();
                    ctx.fill();
                    // 날개
                    const wingFlap = Math.sin(this.frameIndex * 1.5) * 12;
                    ctx.strokeStyle = '#CC8800';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(cx - 5, cy);
                    ctx.quadraticCurveTo(cx - 15, cy - 15 + wingFlap, cx - bw, cy - 5 + wingFlap);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(cx - 5, cy);
                    ctx.quadraticCurveTo(cx + 5, cy - 15 - wingFlap, cx + 15, cy - 10 - wingFlap);
                    ctx.stroke();

                } else if (this.type === 'bee') {
                    // 벌
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, 16, 12, 0, 0, Math.PI * 2);
                    ctx.fill();
                    // 줄무늬
                    ctx.fillStyle = '#222';
                    ctx.fillRect(cx - 6, cy - 10, 4, 20);
                    ctx.fillRect(cx + 3, cy - 10, 4, 20);
                    // 날개
                    const bwing = Math.sin(this.frameIndex * 3) * 5;
                    ctx.fillStyle = 'rgba(200,220,255,0.6)';
                    ctx.beginPath();
                    ctx.ellipse(cx - 8, cy - 14 + bwing, 10, 6, -0.3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(cx + 8, cy - 14 - bwing, 10, 6, 0.3, 0, Math.PI * 2);
                    ctx.fill();
                    // 눈
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(cx - 6, cy - 3, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + 6, cy - 3, 3, 0, Math.PI * 2);
                    ctx.fill();
                    // 침
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(cx + 16, cy + 2);
                    ctx.lineTo(cx + 24, cy + 5);
                    ctx.stroke();

                } else if (this.type.includes('rock')) {
                    // 바위
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.moveTo(this.x + 5, this.y + this.height);
                    ctx.lineTo(this.x + 10, this.y + 5);
                    ctx.lineTo(this.x + this.width * 0.4, this.y);
                    ctx.lineTo(this.x + this.width * 0.7, this.y + 3);
                    ctx.lineTo(this.x + this.width - 5, this.y + 8);
                    ctx.lineTo(this.x + this.width, this.y + this.height);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = '#555';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    // 하이라이트
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.beginPath();
                    ctx.arc(cx - 5, cy - 5, 8, 0, Math.PI * 2);
                    ctx.fill();

                } else if (this.type === 'puddle') {
                    // 물웅덩이
                    ctx.fillStyle = 'rgba(60,130,200,0.6)';
                    ctx.beginPath();
                    ctx.ellipse(cx, this.y + this.height / 2, this.width / 2, this.height / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    // 반짝임
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.beginPath();
                    ctx.ellipse(cx - 10, this.y + 3, 8, 3, -0.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(cx + 15, this.y + 5, 5, 2, 0.3, 0, Math.PI * 2);
                    ctx.fill();

                } else if (this.type === 'snowman') {
                    // 눈사람
                    ctx.fillStyle = '#FFFFFF';
                    // 몸통 (아래)
                    ctx.beginPath();
                    ctx.arc(cx, this.y + this.height - 22, 22, 0, Math.PI * 2);
                    ctx.fill();
                    // 머리 (위)
                    ctx.beginPath();
                    ctx.arc(cx, this.y + 20, 16, 0, Math.PI * 2);
                    ctx.fill();
                    // 눈
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(cx - 6, this.y + 17, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + 6, this.y + 17, 3, 0, Math.PI * 2);
                    ctx.fill();
                    // 코 (당근)
                    ctx.fillStyle = '#FF6600';
                    ctx.beginPath();
                    ctx.moveTo(cx, this.y + 22);
                    ctx.lineTo(cx + 12, this.y + 24);
                    ctx.lineTo(cx, this.y + 26);
                    ctx.closePath();
                    ctx.fill();
                    // 모자
                    ctx.fillStyle = '#333';
                    ctx.fillRect(cx - 14, this.y + 2, 28, 5);
                    ctx.fillRect(cx - 10, this.y - 15, 20, 18);
                    // 외곽선
                    ctx.strokeStyle = '#CCCCDD';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(cx, this.y + this.height - 22, 22, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(cx, this.y + 20, 16, 0, Math.PI * 2);
                    ctx.stroke();

                } else if (this.type === 'mushroom') {
                    // 버섯
                    // 줄기
                    ctx.fillStyle = '#F5DEB3';
                    ctx.fillRect(cx - 7, cy + 5, 14, this.height * 0.45);
                    // 갓
                    ctx.fillStyle = '#FF4444';
                    ctx.beginPath();
                    ctx.arc(cx, cy, this.width * 0.42, Math.PI, 0);
                    ctx.closePath();
                    ctx.fill();
                    // 점 무늬
                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath(); ctx.arc(cx - 8, cy - 8, 4, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx + 7, cy - 10, 3, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx, cy - 14, 3.5, 0, Math.PI * 2); ctx.fill();
                    // 외곽
                    ctx.strokeStyle = '#CC0000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(cx, cy, this.width * 0.42, Math.PI, 0);
                    ctx.stroke();

                } else if (this.type === 'stump') {
                    // 나무 그루터기
                    ctx.fillStyle = '#8B5E3C';
                    ctx.fillRect(this.x + 8, this.y + 10, this.width - 16, this.height - 10);
                    // 나이테 (윗면)
                    ctx.fillStyle = '#A0724B';
                    ctx.beginPath();
                    ctx.ellipse(cx, this.y + 10, (this.width - 16) / 2, 10, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#6B3F1F';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    // 나이테 링
                    ctx.strokeStyle = '#6B3F1F';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.ellipse(cx, this.y + 10, 10, 5, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.ellipse(cx, this.y + 10, 5, 3, 0, 0, Math.PI * 2);
                    ctx.stroke();

                } else {
                    // 선인장 (기본)
                    ctx.fillStyle = this.color;
                    ctx.fillRect(this.x + 12, this.y, this.width - 24, this.height);
                    // 가시
                    ctx.fillStyle = '#009900';
                    for (let i = 0; i < this.height; i += 14) {
                        ctx.fillRect(this.x + 3, this.y + i, 8, 5);
                        ctx.fillRect(this.x + this.width - 11, this.y + i, 8, 5);
                    }
                    // 팔
                    if (this.type === 'cactus-medium' || this.type === 'cactus-large') {
                        ctx.fillStyle = this.color;
                        ctx.fillRect(this.x - 10, this.y + 18, 12, 10);
                        ctx.fillRect(this.x + this.width - 2, this.y + 18, 12, 10);
                    }
                    if (this.type === 'cactus-large') {
                        ctx.fillRect(this.x - 10, this.y + 50, 12, 10);
                        ctx.fillRect(this.x + this.width - 2, this.y + 50, 12, 10);
                    }
                    // 외곽
                    ctx.strokeStyle = '#005500';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(this.x + 12, this.y, this.width - 24, this.height);
                }

                ctx.restore();
            }
        }

        // ============================================================================
        // COIN CLASS
        // ============================================================================
        class Coin {
            constructor() {
                this.x = GAME_CONFIG.width;
                this.y = GAME_CONFIG.groundY - 110 - Math.random() * 80;
                this.radius = 20; // 14 → 20 (크기 업!)
                this.frameIndex = 0;
            }

            update(gameSpeed, deltaTime) {
                this.x -= gameSpeed;
                this.frameIndex += 0.15;
            }

            getHitbox() {
                return {
                    x: this.x - this.radius,
                    y: this.y - this.radius,
                    width: this.radius * 2,
                    height: this.radius * 2
                };
            }

            draw(ctx) {
                ctx.save();

                // Rotate
                ctx.translate(this.x, this.y);
                ctx.rotate(this.frameIndex * 0.05);

                // 그림자
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.beginPath();
                ctx.ellipse(2, 3, this.radius, this.radius * 0.7, 0, 0, Math.PI * 2);
                ctx.fill();

                // Coin body
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // 내부 링
                ctx.strokeStyle = '#DAA520';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius - 5, 0, Math.PI * 2);
                ctx.stroke();

                // Shine
                ctx.fillStyle = '#FFFF44';
                ctx.beginPath();
                ctx.arc(-5, -5, 5, 0, Math.PI * 2);
                ctx.fill();

                // Symbol
                ctx.fillStyle = '#CC8800';
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('★', 0, 1);

                // Outline
                ctx.strokeStyle = '#CC9900';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.stroke();

                ctx.restore();
            }
        }

        // ============================================================================
        // POWER-UP CLASS
        // ============================================================================
        class PowerUp {
            constructor(type) {
                this.type = type;
                this.x = GAME_CONFIG.width;
                this.y = GAME_CONFIG.groundY - 130 - Math.random() * 60;
                this.radius = 26; // 20 → 26 (크기 업!)
                this.frameIndex = 0;

                if (type === 'shield') {
                    this.color = '#0099FF';
                    this.icon = '🛡';
                } else if (type === 'magnet') {
                    this.color = '#9900FF';
                    this.icon = '🧲';
                } else if (type === '2x') {
                    this.color = '#FFD700';
                    this.icon = 'x2';
                } else if (type === 'slow') {
                    this.color = '#00FF88';
                    this.icon = '🐢';
                }
            }

            update(gameSpeed, deltaTime) {
                this.x -= gameSpeed;
                this.frameIndex += 0.1;
            }

            getHitbox() {
                return {
                    x: this.x - this.radius,
                    y: this.y - this.radius,
                    width: this.radius * 2,
                    height: this.radius * 2
                };
            }

            draw(ctx) {
                ctx.save();

                // Glow
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 25;

                // Body
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // Pulsing outline
                const pulse = 2.5 + Math.sin(this.frameIndex) * 2.5;
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = pulse;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius + 4, 0, Math.PI * 2);
                ctx.stroke();

                // Icon
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 22px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.icon, this.x, this.y + 1);

                ctx.restore();
            }
        }

        // ============================================================================
        // BACKGROUND CLASS - 계절 시스템 (봄 → 여름 → 가을 → 겨울)
        // ============================================================================
        // 계절 전환 기준 점수
        const SEASONS = {
            spring: { // 봄: 0~49점
                skyTop: '#A8D8FF', skyMid: '#D4ECFF', skyBot: '#FFF0F5',
                mountain: '#7BAE5E', mountainSnow: '#FFFFFF',
                ground: '#55CC55', groundLine: '#44AA44',
                cloudColor: '#FFFFFF',
                label: '🌸 봄', particles: 'petals',
                treeColor: '#FF99BB', treeTrunk: '#8B5E3C',
                flowerColors: ['#FF69B4', '#FF85C8', '#FFB7D5', '#FFFFFF']
            },
            summer: { // 여름: 50~149점
                skyTop: '#1E90FF', skyMid: '#66BBFF', skyBot: '#F0F8FF',
                mountain: '#5A8A3A', mountainSnow: null,
                ground: '#22AA22', groundLine: '#1A8A1A',
                cloudColor: '#FFFFFF',
                label: '☀️ 여름', particles: 'none',
                treeColor: '#228B22', treeTrunk: '#654321',
                flowerColors: ['#FFD700', '#FF6347', '#ADFF2F']
            },
            autumn: { // 가을: 150~299점
                skyTop: '#FF8C42', skyMid: '#FFBA73', skyBot: '#FFE0B2',
                mountain: '#B8860B', mountainSnow: null,
                ground: '#CC9944', groundLine: '#AA7733',
                cloudColor: '#FFE4C4',
                label: '🍂 가을', particles: 'leaves',
                treeColor: '#FF6600', treeTrunk: '#5C3317',
                flowerColors: ['#FF4500', '#FF8C00', '#FFD700', '#8B4513']
            },
            winter: { // 겨울: 300점 이상
                skyTop: '#4A6FA5', skyMid: '#8AACC8', skyBot: '#C8D8E8',
                mountain: '#6A7B8B', mountainSnow: '#FFFFFF',
                ground: '#E8E8F0', groundLine: '#B0B8C0',
                cloudColor: '#D0D8E0',
                label: '❄️ 겨울', particles: 'snow',
                treeColor: null, treeTrunk: '#5C3317',
                flowerColors: []
            }
        };

        // 계절 순환: 봄→여름→가을→겨울→봄→여름→... (200점 주기)
        function getCurrentSeason(score) {
            const cycle = score % 200;
            if (cycle < 50) return 'spring';
            if (cycle < 100) return 'summer';
            if (cycle < 150) return 'autumn';
            return 'winter';
        }

        function lerpColor(c1, c2, t) {
            // c1, c2 = '#RRGGBB'
            const r1 = parseInt(c1.slice(1,3),16), g1 = parseInt(c1.slice(3,5),16), b1 = parseInt(c1.slice(5,7),16);
            const r2 = parseInt(c2.slice(1,3),16), g2 = parseInt(c2.slice(3,5),16), b2 = parseInt(c2.slice(5,7),16);
            const r = Math.round(r1 + (r2-r1)*t), g = Math.round(g1 + (g2-g1)*t), b = Math.round(b1 + (b2-b1)*t);
            return `rgb(${r},${g},${b})`;
        }

        class Background {
            constructor() {
                this.cloudX = 0;
                this.time = 0;
                this.weatherParticles = [];
                this.currentSeason = 'spring';
                this.transitionT = 0; // 0~1 전환 진행도
                this.prevSeason = 'spring';
                this.treePositions = [120, 350, 580, 780, 950]; // 나무 x좌표
                this._cachedSeason = null; // 캐싱된 보간 결과
                this._cachedTransitionT = -1; // 마지막 캐싱 시 transitionT
                this._cachedSeasonKey = ''; // 캐시 키
            }

            update(deltaTime, score) {
                this.cloudX -= 90 * deltaTime; // 초당 90px (deltaTime 기반으로 부드럽게)
                // cloudX를 리셋하지 않음 — 구름/나무는 modulo로 위치 계산하므로
                // 끊김 없이 무한 스크롤됨. float 오버플로 방지만 처리.
                if (this.cloudX < -100000) this.cloudX += 100000;
                this.time += deltaTime;

                // 계절 전환 (이전 전환이 완료되지 않아도 즉시 새 계절로 전환 시작)
                const newSeason = getCurrentSeason(score || 0);
                if (newSeason !== this.currentSeason) {
                    this.prevSeason = this.currentSeason;
                    this.currentSeason = newSeason;
                    this.transitionT = 0;
                }
                if (this.transitionT < 1) {
                    this.transitionT = Math.min(1, this.transitionT + deltaTime * 0.18); // ~5.5초에 걸쳐 부드럽게 전환
                }

                // 날씨 파티클 생성 (계절 전환 시 페이드인/아웃)
                const currSeason = SEASONS[this.currentSeason];
                const prevSeason = SEASONS[this.prevSeason];
                const t = this.transitionT;

                // 새 계절 파티클 (전환 진행에 따라 확률 증가)
                const currRate = t >= 1 ? 1 : t;
                // 이전 계절 파티클 (전환 진행에 따라 확률 감소)
                const prevRate = t >= 1 ? 0 : (1 - t);

                // 헬퍼: 파티클 타입별 생성
                this._spawnParticles(currSeason, currRate);
                if (prevRate > 0.05 && this.prevSeason !== this.currentSeason) {
                    this._spawnParticles(prevSeason, prevRate);
                }

                // 파티클 업데이트
                this.weatherParticles = this.weatherParticles.filter(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.type === 'snow') p.x += Math.sin(p.y * 0.02) * 0.5;
                    if (p.rot !== undefined) p.rot += p.rotSpeed;
                    return p.x > -20 && p.y < GAME_CONFIG.height + 10;
                });
                // 파티클 수 제한
                if (this.weatherParticles.length > 60) {
                    this.weatherParticles = this.weatherParticles.slice(-60);
                }
            }

            _spawnParticles(season, rate) {
                if (season.particles === 'snow' && Math.random() < 0.15 * rate) {
                    this.weatherParticles.push({
                        x: Math.random() * GAME_CONFIG.width,
                        y: -5,
                        vx: Math.random() * 2 - 1,
                        vy: Math.random() * 1.5 + 1,
                        size: Math.random() * 3 + 2,
                        type: 'snow'
                    });
                }
                if (season.particles === 'leaves' && Math.random() < 0.08 * rate) {
                    const colors = season.flowerColors;
                    if (colors.length > 0) {
                        this.weatherParticles.push({
                            x: GAME_CONFIG.width + 10,
                            y: Math.random() * GAME_CONFIG.groundY * 0.7,
                            vx: -(Math.random() * 3 + 2),
                            vy: Math.random() * 1 + 0.5,
                            rot: Math.random() * Math.PI * 2,
                            rotSpeed: (Math.random() - 0.5) * 0.1,
                            size: Math.random() * 6 + 4,
                            color: colors[Math.floor(Math.random() * colors.length)],
                            type: 'leaf'
                        });
                    }
                }
                if (season.particles === 'petals' && Math.random() < 0.12 * rate) {
                    const colors = season.flowerColors;
                    if (colors.length > 0) {
                        this.weatherParticles.push({
                            x: GAME_CONFIG.width + 10,
                            y: Math.random() * GAME_CONFIG.groundY * 0.6,
                            vx: -(Math.random() * 2 + 1),
                            vy: Math.sin(this.time * 3) * 0.5 + 0.5,
                            size: Math.random() * 4 + 3,
                            color: colors[Math.floor(Math.random() * colors.length)],
                            type: 'petal'
                        });
                    }
                }
            }

            getSeason() {
                const s = SEASONS[this.currentSeason];
                if (this.transitionT >= 1 || this.prevSeason === this.currentSeason) {
                    // 전환 완료 상태에서도 snowAlpha / treeAlpha 포함
                    return Object.assign({}, s, {
                        snowAlpha: s.mountainSnow ? 1 : 0,
                        treeAlpha: s.treeColor ? 1 : 0,
                        winterGroundAlpha: this.currentSeason === 'winter' ? 0.3 : 0
                    });
                }

                // transitionT를 5% 단위로 스냅해서 캐시 히트율 높이기
                const snappedT = Math.round(this.transitionT * 20) / 20;
                const cacheKey = this.prevSeason + '_' + this.currentSeason + '_' + snappedT;
                if (this._cachedSeasonKey === cacheKey && this._cachedSeason) {
                    return this._cachedSeason;
                }

                const p = SEASONS[this.prevSeason];

                // 나무 잎 색상 보간 (null인 겨울 처리)
                let treeColorResult = s.treeColor;
                let treeAlpha = s.treeColor ? 1 : 0;
                if (p.treeColor && s.treeColor) {
                    // 둘 다 잎이 있음 → 색상 보간
                    treeColorResult = lerpColor(p.treeColor, s.treeColor, snappedT);
                    treeAlpha = 1;
                } else if (p.treeColor && !s.treeColor) {
                    // 잎 있음 → 겨울(잎 없음): 페이드아웃
                    treeColorResult = p.treeColor;
                    treeAlpha = 1 - snappedT;
                } else if (!p.treeColor && s.treeColor) {
                    // 겨울(잎 없음) → 잎 있음: 페이드인
                    treeColorResult = s.treeColor;
                    treeAlpha = snappedT;
                }

                // 산 위 눈 알파 보간
                const prevHasSnow = p.mountainSnow ? 1 : 0;
                const currHasSnow = s.mountainSnow ? 1 : 0;
                const snowAlpha = prevHasSnow + (currHasSnow - prevHasSnow) * snappedT;

                // 겨울 땅 눈 효과 알파
                const prevWinter = this.prevSeason === 'winter' ? 0.3 : 0;
                const currWinter = this.currentSeason === 'winter' ? 0.3 : 0;
                const winterGroundAlpha = prevWinter + (currWinter - prevWinter) * snappedT;

                this._cachedSeason = {
                    skyTop: lerpColor(p.skyTop, s.skyTop, snappedT),
                    skyMid: lerpColor(p.skyMid, s.skyMid, snappedT),
                    skyBot: lerpColor(p.skyBot, s.skyBot, snappedT),
                    mountain: lerpColor(p.mountain, s.mountain, snappedT),
                    mountainSnow: s.mountainSnow || p.mountainSnow,
                    snowAlpha: snowAlpha,
                    ground: lerpColor(p.ground, s.ground, snappedT),
                    groundLine: lerpColor(p.groundLine, s.groundLine, snappedT),
                    cloudColor: lerpColor(p.cloudColor, s.cloudColor, snappedT),
                    label: s.label,
                    particles: s.particles,
                    prevParticles: p.particles,
                    particleFade: snappedT,
                    treeColor: treeColorResult,
                    treeAlpha: treeAlpha,
                    treeTrunk: lerpColor(p.treeTrunk, s.treeTrunk, snappedT),
                    flowerColors: snappedT < 0.5 ? p.flowerColors : s.flowerColors,
                    winterGroundAlpha: winterGroundAlpha
                };
                this._cachedSeasonKey = cacheKey;
                return this._cachedSeason;
            }

            draw(ctx) {
                const s = this.getSeason();

                // 하늘 그라데이션 (캐싱)
                const skyKey = s.skyTop + s.skyMid + s.skyBot;
                if (this._skyKey !== skyKey) {
                    this._skyGradient = ctx.createLinearGradient(0, 0, 0, GAME_CONFIG.height);
                    this._skyGradient.addColorStop(0, s.skyTop);
                    this._skyGradient.addColorStop(0.5, s.skyMid);
                    this._skyGradient.addColorStop(1, s.skyBot);
                    this._skyKey = skyKey;
                }
                ctx.fillStyle = this._skyGradient;
                ctx.fillRect(0, 0, GAME_CONFIG.width, GAME_CONFIG.height);

                // 구름
                for (let i = 0; i < 4; i++) {
                    const cw = GAME_CONFIG.width + 200;
                    const cx = ((this.cloudX * 0.8 + i * 320) % cw + cw) % cw - 50;
                    this.drawCloud(ctx, cx, 60 + i * 35, s.cloudColor);
                }

                // 산
                ctx.fillStyle = s.mountain;
                ctx.beginPath();
                ctx.moveTo(-50, GAME_CONFIG.groundY - 50);
                ctx.lineTo(150, GAME_CONFIG.groundY - 180);
                ctx.lineTo(350, GAME_CONFIG.groundY - 60);
                ctx.lineTo(500, GAME_CONFIG.groundY - 200);
                ctx.lineTo(700, GAME_CONFIG.groundY - 70);
                ctx.lineTo(850, GAME_CONFIG.groundY - 160);
                ctx.lineTo(GAME_CONFIG.width + 50, GAME_CONFIG.groundY - 80);
                ctx.lineTo(GAME_CONFIG.width + 50, GAME_CONFIG.height);
                ctx.lineTo(-50, GAME_CONFIG.height);
                ctx.closePath();
                ctx.fill();

                // 산 위 눈 (봄, 겨울) — 페이드인/아웃
                if (s.mountainSnow && s.snowAlpha > 0.01) {
                    ctx.save();
                    ctx.globalAlpha = s.snowAlpha;
                    ctx.fillStyle = s.mountainSnow;
                    // 봉우리 1
                    ctx.beginPath();
                    ctx.moveTo(150, GAME_CONFIG.groundY - 180);
                    ctx.lineTo(130, GAME_CONFIG.groundY - 145);
                    ctx.lineTo(170, GAME_CONFIG.groundY - 145);
                    ctx.closePath();
                    ctx.fill();
                    // 봉우리 2
                    ctx.beginPath();
                    ctx.moveTo(500, GAME_CONFIG.groundY - 200);
                    ctx.lineTo(475, GAME_CONFIG.groundY - 160);
                    ctx.lineTo(525, GAME_CONFIG.groundY - 160);
                    ctx.closePath();
                    ctx.fill();
                    // 봉우리 3
                    ctx.beginPath();
                    ctx.moveTo(850, GAME_CONFIG.groundY - 160);
                    ctx.lineTo(830, GAME_CONFIG.groundY - 130);
                    ctx.lineTo(870, GAME_CONFIG.groundY - 130);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                }

                // 나무들
                this.treePositions.forEach((tx, i) => {
                    const scrolledX = ((tx + this.cloudX * 0.5) % (GAME_CONFIG.width + 100) + (GAME_CONFIG.width + 100)) % (GAME_CONFIG.width + 100) - 50;
                    this.drawTree(ctx, scrolledX, GAME_CONFIG.groundY, s, i);
                });

                // 땅
                ctx.fillStyle = s.ground;
                ctx.fillRect(0, GAME_CONFIG.groundY, GAME_CONFIG.width, GAME_CONFIG.height - GAME_CONFIG.groundY);

                // 땅 경계선
                ctx.strokeStyle = s.groundLine;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, GAME_CONFIG.groundY);
                ctx.lineTo(GAME_CONFIG.width, GAME_CONFIG.groundY);
                ctx.stroke();

                // 겨울 눈 쌓인 효과 (그라데이션 페이드)
                if (s.winterGroundAlpha > 0.01) {
                    ctx.save();
                    ctx.globalAlpha = s.winterGroundAlpha / 0.3; // 0~1 범위로 정규화
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.fillRect(0, GAME_CONFIG.groundY - 2, GAME_CONFIG.width, 6);
